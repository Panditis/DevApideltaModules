<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A8020 calculado · Apidelta</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#405936;--verde-dark:#2e4027;--verde-hover:#4f6e42;--verde-cont:#cfe0c2;--verde-on-cont:#0c1f06;
    --amarillo:#FFCC00;--amarillo-on:#3a2f00;--amarillo-cont:#fff1bf;
    --bg:#eef2e9;--card:#fff;--surface1:#f1f5ec;--surface2:#eaf0e4;--surface3:#e3ebdb;
    --text:#1a1c18;--muted:#434840;--faint:#73796d;--border:#c3c9bc;--line:#dfe5d8;--error:#ba1a1a;
    --disp:'Barlow Condensed',sans-serif;--body:'Roboto',sans-serif;
    --shadow:0 1px 3px rgba(46,64,39,.12);--shadow-lg:0 6px 18px rgba(46,64,39,.16);
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh}
  header{background:var(--verde);color:#fff;padding:11px 22px;box-shadow:var(--shadow-lg);z-index:30}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.3px}
  .brand b{color:var(--amarillo)}
  .brand .sub{font-weight:500;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-left:10px}
  .sp{flex:1}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 22px;background:var(--card);border-bottom:1px solid var(--border);min-height:46px}
  input[type=search]{font-family:var(--body);background:var(--surface1);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;width:240px;font-size:13px;outline:none}
  input[type=search]:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(64,89,54,.15)}
  button{font-family:var(--body);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500}
  button.primary{background:var(--verde);color:#fff;border:0;box-shadow:var(--shadow)}
  button.primary:hover{background:var(--verde-hover)}
  button:disabled{opacity:.5;cursor:default}
  .stat{font-size:11.5px;background:var(--surface1);border:1px solid var(--line);border-radius:7px;padding:4px 10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .stat b{color:var(--text);font-weight:700}
  .div{width:1px;height:18px;background:var(--border);margin:0 3px}
  main{flex:1;overflow:auto;position:relative}
  main::-webkit-scrollbar{width:12px;height:12px}main::-webkit-scrollbar-thumb{background:var(--border);border:3px solid var(--bg);border-radius:8px}
  table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;background:var(--card)}
  thead th{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:9px 8px;text-align:right;white-space:nowrap;font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--verde-dark);cursor:pointer}
  thead th:hover{background:var(--verde-hover)}
  thead th.l{text-align:left}thead th.suc,thead th.suc-rank{color:var(--amarillo)}
  thead th small{display:block;font-family:var(--body);font-size:9.5px;font-weight:400;color:rgba(255,255,255,.6);text-transform:none;letter-spacing:0}
  tbody td{padding:0 8px;height:31px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-size:12.5px}
  tbody td.l{text-align:left}
  tbody td.nombre{max-width:320px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  tbody tr:nth-child(even){background:var(--surface1)}
  tbody tr:hover{background:var(--verde-cont)}
  .plu{color:var(--faint)}
  td.s.pos span{background:var(--verde-cont);color:var(--verde-on-cont);font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block;min-width:24px;cursor:help}
  td.s.boot span{background:var(--amarillo-cont);color:var(--amarillo-on);font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block;min-width:24px;cursor:help;font-style:italic}
  td.s{color:var(--faint)}
  .abc{font-weight:700;font-size:11px;padding:2px 8px;border-radius:5px;display:inline-block;width:22px;text-align:center}
  .abc.A{background:var(--verde);color:#fff}.abc.B{background:var(--amarillo-cont);color:var(--amarillo-on)}.abc.C{background:var(--surface3);color:var(--faint)}
  .rank{font-weight:700;font-size:10.5px;padding:2px 6px;border-radius:5px;display:inline-block;min-width:30px;text-align:center}
  .rank.hi{background:var(--verde);color:#fff}.rank.mid{background:var(--amarillo-cont);color:var(--amarillo-on)}.rank.lo{background:var(--surface3);color:var(--faint)}
  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:14px;color:var(--muted)}
  .spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--verde);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ts{font-size:11px;color:var(--faint)}
  /* ── Panel anomalías ── */
  #anom-panel{background:var(--amarillo-cont);border-bottom:2px solid var(--amarillo);display:none}
  .anom-hdr{display:flex;align-items:center;gap:10px;padding:9px 22px;cursor:pointer;user-select:none;color:var(--amarillo-on);font-size:12.5px;font-weight:600}
  .anom-hdr:hover{background:rgba(255,204,0,.18)}
  .anom-badge{background:var(--error);color:#fff;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700}
  #anom-body{max-height:340px;overflow:auto;border-top:1px solid rgba(255,204,0,.35)}
  #anom-tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--amarillo-cont)}
  #anom-tbl thead th{background:rgba(255,204,0,.25);color:var(--amarillo-on);padding:7px 8px;text-align:right;font-family:var(--disp);font-size:12px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0}
  #anom-tbl thead th.l{text-align:left}
  #anom-tbl tbody td{padding:0 8px;height:29px;text-align:right;border-bottom:1px solid rgba(255,204,0,.3);white-space:nowrap;font-size:12px}
  #anom-tbl tbody td.l{text-align:left}
  #anom-tbl tbody tr:hover td{background:rgba(255,204,0,.22);cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <span class="brand">api<b>delta</b><span class="sub">A8020 calculado</span></span>
      <span class="sp"></span>
      <a href="/distribucion" style="font-family:var(--body);font-size:12px;font-weight:500;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:7px 14px;border-radius:8px;text-decoration:none">← Distribución</a>
    </div>
  </header>
  <div class="meta">
    <input type="search" id="q" placeholder="Buscar PLU o producto…">
    <div id="rubroWrap" style="position:relative;display:inline-block">
      <button id="rubroBtn" onclick="toggleRubroDrop()" style="font-family:var(--body);font-size:13px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface1);color:var(--text);cursor:pointer">Rubros ▾</button>
      <div id="rubroDrop" style="display:none;position:absolute;z-index:50;top:calc(100% + 4px);left:0;min-width:220px;max-height:340px;overflow:auto;background:var(--surface1,#fff);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px"></div>
    </div>
    <button class="primary" id="recalc">↻ Recalcular desde Siga</button>
    <span class="div"></span>
    <span id="resumen" class="ts">cargando…</span>
  </div>
  <div id="anom-panel">
    <div class="anom-hdr" onclick="toggleAnom()">
      <span>⚠</span>
      <span>consumo anómalo por sucursal</span>
      <span class="anom-badge" id="anom-badge">0</span>
      <span style="flex:1"></span>
      <span id="anom-chevron">▼ ver</span>
    </div>
    <div id="anom-body" style="display:none">
      <table id="anom-tbl">
        <thead><tr>
          <th class="l">PLU</th><th class="l">Producto</th><th>ABC</th>
          <th class="l">Sucursal baja</th><th>Min suc</th><th>Mediana otras</th><th>%</th>
        </tr></thead>
        <tbody id="anom-rows"></tbody>
      </table>
    </div>
  </div>
  <main>
    <div class="state" id="state"><div class="spinner"></div><div id="stmsg">Cargando A8020…</div></div>
    <table id="tabla" style="display:none"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  </main>
</div>
<style>
#rubroDrop .rubro-opt{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:13px;cursor:pointer}
#rubroDrop .rubro-opt:hover{background:var(--surface2,#f1f1f1)}
#rubroDrop .rubro-opt-clear{padding:5px 8px;font-size:12px;color:var(--primary,#2563eb);cursor:pointer;border-bottom:1px solid var(--border);margin-bottom:4px}
</style>
<script>
const SUC = [['riv','Rivadavia'],['urq','Urquiza'],['nacion','Nación'],['chaca','Chacabuco'],['pergamino','Pergamino'],['sanpedro','San Pedro'],['ramallo','Villa Ramallo']];
const SUC_ID = {riv:5,urq:2,nacion:3,chaca:4,pergamino:10,sanpedro:7,ramallo:9};
let cache = {}, filas = [], orden = {col:'tot',dir:-1};
const fmt = (n)=> (n==null||n===0)?'·':(Math.round(n*100)/100).toLocaleString('es-AR');
const sumS = (r)=> SUC.reduce((s,[k])=> s+(r.mins[k]||0),0);
const RANK_SUFFIX = '_r';
const rankCol = (k)=> k+RANK_SUFFIX;
const sucOfRankCol = (c)=> c.slice(0,-RANK_SUFFIX.length);

function construir(){
  const opsTxt = (k)=>{ const id=SUC_ID[k]; const n=(cache.opsDays||{})[id]; return n?`<small>${n}d op.</small>`:''; };
  const cols = [['plu','PLU','l'],['nombre','Producto','l'],['abc','ABC',''],['rankGeneral','Gral','']]
    .concat(SUC.flatMap(([k,n])=>[[k,n,'suc'],[rankCol(k),'R','suc-rank']]))
    .concat([['tot','Σ S','']]);
  document.getElementById('head').innerHTML = cols.map(([k,n,cls])=>{
    const ar = orden.col===k ? (orden.dir<0?' ▼':' ▲') : '';
    const sub = cls==='suc' ? opsTxt(k) : cls==='suc-rank' ? `<small>${sucOfRankCol(k)}</small>` : '';
    return `<th class="${cls||''}" data-col="${k}">${n}${ar}${sub}</th>`;
  }).join('');
  document.querySelectorAll('#head th').forEach(th=> th.onclick = ()=>{
    const c=th.dataset.col;
    if(orden.col===c) orden.dir*=-1; else {orden.col=c; orden.dir=(c==='plu'||c==='nombre'||c==='abc')?1:-1;}
    render();
  });
}
function valor(r,c){
  if(c==='tot') return sumS(r);
  if(c==='rankGeneral') return r.rankGeneral??-1;
  if(c.endsWith(RANK_SUFFIX)){ const k=sucOfRankCol(c); const d=(r.detalle||{})[k]||{}; return d.ranking??-1; }
  if(SUC.some(([k])=>k===c)) return r.mins[c]||0;
  if(c==='nombre') return (r.nombre||'').toLowerCase();
  if(c==='abc') return ({A:0,B:1,C:2})[r.abc] ?? 3;
  return r[c]??0;
}
let filtroClase=null;
let rubrosSel=new Set();   // vacío = todos
function construirRubroFiltro(){
  const set=new Set(filas.map(r=>r.rubro).filter(Boolean));
  const rubros=[...set].sort((a,b)=>a.localeCompare(b));
  const drop=document.getElementById('rubroDrop');
  drop.innerHTML=`<div class="rubro-opt-clear" onclick="rubroAll()">Mostrar todos</div>`+
    rubros.map(rb=>`<label class="rubro-opt"><input type="checkbox" ${rubrosSel.has(rb)?'checked':''} onchange="toggleRubro(this,'${rb.replace(/'/g,"\\'")}')"><span>${rb}</span></label>`).join('');
  actualizarRubroBtn();
}
function actualizarRubroBtn(){ const b=document.getElementById('rubroBtn'); if(b) b.textContent=(rubrosSel.size?`Rubros (${rubrosSel.size})`:'Rubros')+' ▾'; }
function toggleRubroDrop(){ const d=document.getElementById('rubroDrop'); d.style.display=d.style.display==='none'?'':'none'; }
function toggleRubro(chk,rb){ chk.checked?rubrosSel.add(rb):rubrosSel.delete(rb); actualizarRubroBtn(); render(); }
function rubroAll(){ rubrosSel.clear(); document.querySelectorAll('#rubroDrop input').forEach(c=>c.checked=false); actualizarRubroBtn(); render(); }
document.addEventListener('click',e=>{ const w=document.getElementById('rubroWrap'); const d=document.getElementById('rubroDrop'); if(w&&d&&d.style.display!=='none'&&!w.contains(e.target)) d.style.display='none'; });
function matchClase(r,c){
  if(c==='A'||c==='B'||c==='C'||c==='F') return r.abc===c;
  if(c==='nuevo') return !!r.nuevo;
  if(c==='viejo') return !!r.viejo;
  if(c==='bootstrap') return !!r.bootstrap;
  return true;
}
function setFiltro(c){ filtroClase = (filtroClase===c) ? null : c; render(); }
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let rows = filas.filter(r=> !q || String(r.plu).includes(q) || (r.nombre||'').toLowerCase().includes(q));
  if(filtroClase) rows = rows.filter(r=> matchClase(r,filtroClase));
  if(rubrosSel.size) rows = rows.filter(r=> rubrosSel.has(r.rubro));
  rows.sort((a,b)=>{const va=valor(a,orden.col),vb=valor(b,orden.col);return (va<vb?-1:va>vb?1:0)*orden.dir;});
  document.getElementById('body').innerHTML = rows.slice(0,1500).map(r=>{
    const celdas = SUC.map(([k])=>{ const s=r.mins[k]; const d=(r.detalle||{})[k]||{};
      const boot = d.bootstrap===true;
      const mn=(r.trig||{})[k];
      const tip = d.mu!=null?`${boot?'~bootstrap~ ':''}S=${fmt(s)}  ·  min=${fmt(mn)}  ·  μ=${d.mu}  σ=${d.sigma}`:'';
      const sCell = (s>0 && boot) ? `<td class="s boot"><span title="${tip}">~${fmt(s)}</span></td>`
        : s>0 ? `<td class="s pos"><span title="${tip}">${fmt(s)}</span></td>` : `<td class="s">·</td>`;
      const rk = d.ranking;
      const rkCls = rk==null ? '' : rk>=0.8 ? 'hi' : rk>=0.5 ? 'mid' : 'lo';
      const rkCell = rk==null ? '<td class="s">·</td>' : `<td><span class="rank ${rkCls}">${rk.toFixed(2)}</span></td>`;
      return sCell + rkCell; }).join('');
    const badge = r.nuevo ? '<span style="margin-left:4px;background:#dcfce7;color:#166534;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px" title="Sin ventas; sin movimientos o sólo compras / reciente">NUEVO</span>'
      : r.viejo ? '<span style="margin-left:4px;background:#f3e8ff;color:#6b21a8;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px" title="Sin ventas con movimientos hace meses: stock muerto, no se stockea ni se empuja">VIEJO</span>' : '';
    const abcStyle = r.abc==='F' ? ' style="background:#f3e8ff;color:#6b21a8"' : '';
    const rg = r.rankGeneral;
    const rgCls = rg==null ? '' : rg>=0.8 ? 'hi' : rg>=0.5 ? 'mid' : 'lo';
    const rgCell = rg==null ? '<td class="s">·</td>' : `<td><span class="rank ${rgCls}" title="Percentil de facturación en TODO el catálogo (sin distinguir sucursal)">${rg.toFixed(2)}</span></td>`;
    return `<tr><td class="l plu">${r.plu}</td><td class="l nombre" title="${(r.nombre||'').replace(/"/g,'&quot;')}">${r.nombre||''}</td>`+
      `<td><span class="abc ${r.abc}"${abcStyle}>${r.abc}</span>${badge}</td>${rgCell}${celdas}<td style="font-weight:700;color:var(--verde-dark)">${fmt(sumS(r))}</td></tr>`;
  }).join('');
  const nA=filas.filter(r=>r.abc==='A').length, nB=filas.filter(r=>r.abc==='B').length, nC=filas.filter(r=>r.abc==='C').length, nF=filas.filter(r=>r.abc==='F').length;
  const act = c => filtroClase===c ? 'outline:2px solid currentColor;outline-offset:1px;' : '';
  const chip = (c,label,cnt,extra='') => `<span class="stat" title="Filtrar ${label}" style="cursor:pointer;${extra}${act(c)}" onclick="setFiltro('${c}')">${label} <b>${cnt}</b></span>`;
  document.getElementById('resumen').innerHTML =
    `<span class="stat">${rows.length} productos${filtroClase?` · <span style="color:var(--primary,#2563eb)">filtro ${filtroClase}</span> <a onclick="setFiltro('${filtroClase}')" style="cursor:pointer;text-decoration:underline">✕</a>`:''}</span>`+
    chip('A','A',nA)+chip('B','B',nB)+chip('C','C',nC)+chip('F','F',nF,'background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8;')+
    ((cache.nuevos||[]).length ? chip('nuevo','NUEVO',(cache.nuevos||[]).length,'background:#dcfce7;border-color:#86efac;color:#166534;') : '')+
    ((cache.viejos||[]).length ? chip('viejo','VIEJO/F',(cache.viejos||[]).length,'background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8;') : '')+
    ((cache.bootstrapped||[]).length ? chip('bootstrap','~ bootstrap',(cache.bootstrapped||[]).length,'background:var(--amarillo-cont);border-color:var(--amarillo);color:var(--amarillo-on);') : '')+
    `<span class="div"></span><span class="ts">ventana ${cache.ventanaMeses}m · ${cache.timestamp? new Date(cache.timestamp).toLocaleString('es-AR'):'—'} ${rows.length>1500?'· mostrando 1500':''}</span>`;
}
async function cargar(){
  const r = await fetch('/api/distribucion/a8020'); cache = await r.json();
  if(cache.vacio || !cache.mins){ document.getElementById('stmsg').innerHTML='Sin caché. Tocá <b>Recalcular desde Siga</b>.'; document.querySelector('.spinner').style.display='none'; return; }
  // mins de la tabla = S (order-up-to, el nivel objetivo); trig = min (punto de pedido) para el tooltip.
  const nuevosSet = new Set((cache.nuevos||[]).map(Number));
  const viejosSet = new Set((cache.viejos||[]).map(Number));
  const bootSet = new Set((cache.bootstrapped||[]).map(Number));
  filas = Object.keys(cache.mins).map(plu=>({ plu:Number(plu), nombre:(cache.nombres||{})[plu]||'', abc:(cache.abc||{})[plu]||'C', rubro:(cache.rubros||{})[plu]||'', mins:(cache.sLevels||{})[plu]||cache.mins[plu]||{}, trig:(cache.mins||{})[plu]||{}, detalle:(cache.detalle||{})[plu]||{}, rankGeneral:(cache.rankingGeneral||{})[plu], nuevo:nuevosSet.has(Number(plu)), viejo:viejosSet.has(Number(plu)), bootstrap:bootSet.has(Number(plu)) }));
  construirRubroFiltro();
  construir(); render(); renderAnomalias();
  document.getElementById('state').style.display='none'; document.getElementById('tabla').style.display='';
}
// ── Detección de anomalías ────────────────────────────────────────────────────
// Umbral: si una sucursal tiene < 15% del consumo mediano de las demás (y hay ≥3 con datos), es anómala.
const ANOM_RATIO   = 0.15;
const ANOM_MIN_POS = 3;    // mínimo de sucursales con datos positivos para comparar
const ANOM_MIN_MED = 1.0;  // mediana < 1 → ruido, ignorar

function detectarAnomalias() {
  const alertas = [];
  for (const r of filas) {
    const vals = SUC.map(([k, n]) => ({ k, n, v: r.mins[k] || 0 }));
    const positivas = vals.filter(x => x.v > 0);
    if (positivas.length < ANOM_MIN_POS) continue;
    const sorted = positivas.map(x => x.v).sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)];
    if (med < ANOM_MIN_MED) continue;
    for (const { k, n, v } of vals) {
      if (v > 0 && v / med >= ANOM_RATIO) continue;
      alertas.push({ plu: r.plu, nombre: r.nombre, abc: r.abc, sucKey: k, sucNombre: n, val: v, mediana: med, ratio: v / med });
    }
  }
  return alertas.sort((a, b) => a.ratio - b.ratio);
}

let anomAbierto = false;
function toggleAnom() {
  anomAbierto = !anomAbierto;
  document.getElementById('anom-body').style.display = anomAbierto ? '' : 'none';
  document.getElementById('anom-chevron').textContent = anomAbierto ? '▲ cerrar' : '▼ ver';
}
function filtrarPorPlu(plu) {
  document.getElementById('q').value = String(plu);
  render();
  document.getElementById('tabla').scrollIntoView({ behavior:'smooth' });
}
function renderAnomalias() {
  const alertas = detectarAnomalias();
  const panel = document.getElementById('anom-panel');
  if (!alertas.length) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  document.getElementById('anom-badge').textContent = alertas.length;
  document.getElementById('anom-rows').innerHTML = alertas.map(a => {
    const pct = Math.round(a.ratio * 100);
    const col = a.val === 0 ? 'var(--error)' : pct < 5 ? '#c2410c' : '#92400e';
    const barW = Math.max(Math.round(a.ratio * 80), 1);
    return `<tr onclick="filtrarPorPlu(${a.plu})">
      <td class="l plu">${a.plu}</td>
      <td class="l nombre" title="${(a.nombre||'').replace(/"/g,'&quot;')}">${a.nombre}</td>
      <td><span class="abc ${a.abc}">${a.abc}</span></td>
      <td class="l">${a.sucNombre}</td>
      <td style="color:${col};font-weight:700">${a.val===0?'—':fmt(a.val)}</td>
      <td>${fmt(a.mediana)}</td>
      <td>
        <span style="color:${col};font-weight:700;font-variant-numeric:tabular-nums">${a.val===0?'0%':pct+'%'}</span>
        <span style="display:inline-block;width:${barW}px;height:4px;background:${col};border-radius:2px;margin-left:5px;vertical-align:middle;opacity:.7"></span>
      </td>
    </tr>`;
  }).join('');
}

document.getElementById('q').oninput = render;
document.getElementById('recalc').onclick = async (e)=>{
  const b=e.target; b.disabled=true; const txt=b.textContent; b.textContent='Calculando… (puede tardar)';
  document.getElementById('tabla').style.display='none';
  const st=document.getElementById('state'); st.style.display='flex'; document.querySelector('.spinner').style.display='';
  document.getElementById('stmsg').textContent='Recalculando desde Siga…';
  try{ const r=await fetch('/api/distribucion/a8020/recalcular'); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status)); await cargar(); }
  catch(err){ document.getElementById('stmsg').textContent='Error: '+err.message; }
  b.disabled=false; b.textContent=txt;
};
cargar();
</script>
