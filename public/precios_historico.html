<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precios Históricos — Apidelta</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Tema resuelto ANTES de pintar el body: evita el flash de tema claro.
   Misma clave de localStorage que el resto de los módulos. */
(function(){
  try{
    var t = localStorage.getItem('apidelta-tema');
    if (t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
  /* ── Identidad Apidelta (invariante en los dos temas) ─────────────────────── */
  :root{
    --green:#405936; --green-dark:#2E4027; --green-mid:#4E6B43; --green-light:#E8F0E4;
    --yellow:#FFCC00; --gold:#C98A00; --red:#b3261e;

    --radius:14px; --radius-sm:10px; --radius-pill:999px;
    /* Curvas Fluent: entrada suave y larga, salida corta y decidida. */
    --ease-entrada:cubic-bezier(.1,.9,.2,1);
    --ease-salida:cubic-bezier(.4,0,.9,.2);
    --t-rapido:.12s; --t-medio:.22s; --t-lento:.4s;
    --h-header:56px;
  }

  /* ── Tema claro ───────────────────────────────────────────────────────────── */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#EDF0EA;
    --glow-1:rgba(64,89,54,.10); --glow-2:rgba(255,204,0,.09);
    --surface:#FFFFFF; --surface-2:#FFFFFF; --sunken:#F6F8F4;
    --acrylic:rgba(46,64,39,.86);
    --border:rgba(46,64,39,.13); --border-strong:rgba(46,64,39,.24);
    --text:#1A1E15; --muted:#5B6353; --brand:#2E4027; --kpi-val:#22301C;
    --accent:var(--yellow); --accent-ink:#2E4027; --accent-text:#7A5400; --bar-alerta:#B87E00;
    --btn-bg:var(--green); --btn-bg-hover:var(--green-dark); --btn-ink:#FFFFFF;
    --btn-ghost-bg:#FFFFFF; --btn-ghost-ink:#2E4027; --btn-ghost-hover:var(--green-light);
    --field-bg:#FFFFFF; --th-bg:#FFFFFF; --row-hover:rgba(64,89,54,.055);
    --err-bg:#FDECEA; --err-text:#8C1D18; --err-border:#F0BDB8;
    --mora-bg:#FFF6D6; --mora-text:#6B4A00; --mora-border:#DDAF39;
    --chip-bg:var(--green-light); --chip-text:#2E4027; --chip-border:#9FBA92;
    --tab-ink:#5B6353; --tab-on-bg:var(--green-light); --tab-on-ink:#2E4027;
    --reveal-border:rgba(64,89,54,.55); --reveal-fill:rgba(64,89,54,.07);
    --focus:#405936;
    --skel-a:#E7EAE4; --skel-b:#F4F6F2;
    --neg-bg:#DCEBD3; --neg-ink:#1F4A16;
    --sombra-1:0 1px 2px rgba(22,30,18,.09), 0 6px 16px -8px rgba(22,30,18,.14);
    --sombra-2:0 2px 4px rgba(22,30,18,.10), 0 18px 36px -14px rgba(22,30,18,.22);
    --sombra-3:0 3px 6px rgba(22,30,18,.14), 0 28px 56px -18px rgba(22,30,18,.30);
  }

  /* ── Tema oscuro: diseñado, no invertido. Cada nivel de elevación es más claro. ── */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F1210;
    --glow-1:rgba(78,107,67,.20); --glow-2:rgba(233,195,74,.07);
    --surface:#191E17; --surface-2:#222820; --sunken:#141813;
    --acrylic:rgba(25,30,23,.82);
    --border:rgba(232,240,228,.10); --border-strong:rgba(232,240,228,.20);
    --text:#E7ECE3; --muted:#A6B09E; --brand:#A9C99B; --kpi-val:#DCE7D4;
    --accent:#E9C34A; --accent-ink:#141813; --accent-text:#EFC86B; --bar-alerta:#E9C34A;
    --btn-bg:#4E6B43; --btn-bg-hover:#5E7F51; --btn-ink:#FFFFFF;
    --btn-ghost-bg:rgba(232,240,228,.05); --btn-ghost-ink:#BBD8AC; --btn-ghost-hover:rgba(169,201,155,.16);
    --field-bg:#141813; --th-bg:#191E17; --row-hover:rgba(232,240,228,.055);
    --err-bg:#2A1614; --err-text:#F2B8B5; --err-border:#5C2A26;
    --mora-bg:rgba(233,195,74,.12); --mora-text:#EFC86B; --mora-border:rgba(233,195,74,.42);
    --chip-bg:rgba(78,107,67,.28); --chip-text:#BBD8AC; --chip-border:rgba(169,201,155,.38);
    --tab-ink:#A6B09E; --tab-on-bg:rgba(78,107,67,.30); --tab-on-ink:#C9E0BC;
    --reveal-border:rgba(232,240,228,.42); --reveal-fill:rgba(255,255,255,.05);
    --focus:#FFD84D;
    --skel-a:#20261E; --skel-b:#2A3128;
    --neg-bg:rgba(140,200,120,.16); --neg-ink:#BBD8AC;
    --sombra-1:0 1px 2px rgba(0,0,0,.55), 0 6px 16px -8px rgba(0,0,0,.60);
    --sombra-2:0 2px 4px rgba(0,0,0,.55), 0 18px 36px -14px rgba(0,0,0,.70);
    --sombra-3:0 3px 6px rgba(0,0,0,.60), 0 28px 56px -18px rgba(0,0,0,.80);
  }

  *{box-sizing:border-box}
  html{scrollbar-gutter:stable}
  body{
    margin:0;color:var(--text);font-family:'Barlow',system-ui,sans-serif;font-weight:400;
    background:var(--bg);
    /* Textura de fondo: dos focos de luz muy tenues, la base sobre la que apoya el acrílico. */
    background-image:
      radial-gradient(900px 520px at 8% -10%, var(--glow-1), transparent 70%),
      radial-gradient(760px 460px at 100% 0%, var(--glow-2), transparent 70%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  /* ── Header acrílico (Mica/Acrylic de Fluent) ─────────────────────────────── */
  header{
    position:sticky;top:0;z-index:60;
    display:flex;align-items:center;gap:14px;padding:0 20px;height:var(--h-header);
    background:var(--acrylic);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,.10);
    box-shadow:var(--sombra-1);color:#fff;
  }
  header .logo{
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:23px;letter-spacing:.6px;
    line-height:1;color:#fff;
  }
  header .logo b{color:var(--yellow)}
  header .sep{width:1px;height:20px;background:rgba(255,255,255,.28)}
  header .mod{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;letter-spacing:.9px;
    text-transform:uppercase;color:rgba(255,255,255,.92);
  }
  header .acciones{margin-left:auto;display:flex;align-items:center;gap:8px}
  header a{
    color:#fff;text-decoration:none;font-size:14px;font-weight:500;padding:7px 12px;
    border-radius:var(--radius-sm);transition:background var(--t-rapido) var(--ease-salida);
  }
  header a:hover{background:rgba(255,255,255,.14)}

  .tema{
    display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;
    border-radius:var(--radius-sm);cursor:pointer;padding:0;
    transition:background var(--t-rapido) var(--ease-salida), transform var(--t-rapido) var(--ease-salida);
  }
  .tema:hover{background:rgba(255,255,255,.18)}
  .tema:active{transform:scale(.94)}
  .tema svg{width:17px;height:17px;display:block}
  :root[data-theme="light"] .tema .i-luna{display:none}
  :root[data-theme="dark"]  .tema .i-sol{display:none}

  .wrap{max-width:1400px;margin:0 auto;padding:18px 20px 40px}

  /* ── Reveal highlight: borde + halo que siguen al puntero ─────────────────── */
  .reveal{position:relative;isolation:isolate}
  .reveal::before,.reveal::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    opacity:0;transition:opacity var(--t-medio) var(--ease-salida);z-index:2;
  }
  .reveal::before{
    background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%), var(--reveal-fill), transparent 65%);
  }
  .reveal::after{
    padding:1px;
    background:radial-gradient(140px circle at var(--mx,50%) var(--my,50%), var(--reveal-border), transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  .reveal:hover::before,.reveal:hover::after{opacity:1}
  .reveal:focus-visible::after{opacity:1}

  :where(button,input,select,a,[tabindex]):focus-visible{
    outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--radius-sm);
  }

  /* ── Superficies ──────────────────────────────────────────────────────────── */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-top:16px;box-shadow:var(--sombra-1);
  }
  .card h3{margin:0 0 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:var(--brand)}
  .card h3 .sub{font-family:'Barlow',sans-serif;font-weight:500;font-size:12.5px;color:var(--muted);margin-left:8px;letter-spacing:0}

  /* ── Controles ────────────────────────────────────────────────────────────── */
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
  .controls label{
    display:block;font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    color:var(--muted);margin-bottom:5px;
  }
  input,select{
    padding:9px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    font-family:'Barlow',system-ui,sans-serif;font-size:14px;background:var(--field-bg);color:var(--text);
    transition:border-color var(--t-rapido) var(--ease-salida), box-shadow var(--t-rapido) var(--ease-salida);
  }
  input::placeholder{color:var(--muted);opacity:.8}
  input:hover,select:hover{border-color:var(--green-mid)}
  input:focus,select:focus{outline:none;border-color:var(--green-mid);box-shadow:0 0 0 3px var(--reveal-fill)}
  input:disabled{opacity:.5;cursor:not-allowed}

  .btn{
    background:var(--btn-bg);color:var(--btn-ink);border:1px solid transparent;padding:9px 18px;
    border-radius:var(--radius-sm);font-weight:600;font-size:14px;letter-spacing:.2px;cursor:pointer;
    font-family:'Barlow',system-ui,sans-serif;box-shadow:var(--sombra-1);
    transition:background var(--t-rapido) var(--ease-salida), transform var(--t-rapido) var(--ease-salida);
  }
  .btn:hover{background:var(--btn-bg-hover)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn:disabled:hover{background:var(--btn-bg)}
  .btn-outline{background:var(--btn-ghost-bg);color:var(--btn-ghost-ink);border-color:var(--border-strong)}
  .btn-outline:hover{background:var(--btn-ghost-hover)}
  .btn-outline:disabled:hover{background:var(--btn-ghost-bg)}
  .sp{margin-left:auto}

  /* Botón de descarga: es la salida del módulo, así que va sólido y con la flecha
     que baja al pasar el mouse. El anillo aparece sólo cuando hay algo para bajar. */
  /* ── Tablas ───────────────────────────────────────────────────────────────── */
  .tbl-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{
    color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
    cursor:pointer;user-select:none;position:sticky;top:0;background:var(--th-bg);z-index:1;
    border-bottom:1px solid var(--border-strong);
    transition:color var(--t-rapido) var(--ease-salida);
  }
  th:hover{color:var(--brand)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.money{font-weight:600;color:var(--text)}
  tbody tr{transition:background var(--t-rapido) var(--ease-salida)}
  tbody tr:hover{background:var(--row-hover)}
  tr.clic{cursor:pointer}
  tr.clic td:first-child{box-shadow:inset 3px 0 0 var(--green-mid)}
  tr.clic:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  /* La sucursal "Sin identificar" es la que hay que resolver: se lee en tono de alerta. */
  tr.sin-id td{background:var(--mora-bg);color:var(--mora-text)}
  tr.sin-id td.money{color:var(--mora-text)}
  tr.sin-id:hover td{background:var(--mora-bg)}
  tr.detalle td{background:var(--sunken);white-space:normal;padding:0}
  .desglose{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px}
  .desglose .plat{
    border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);
    padding:9px 14px;font-size:13px;min-width:190px;
  }
  .desglose .plat b{
    display:block;font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.4px;
    color:var(--brand);margin-bottom:4px;
  }
  .desglose .plat span{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
  .expandir{display:inline-block;width:12px;color:var(--muted);font-size:11px}
  tfoot td{
    font-weight:700;color:var(--brand);border-top:2px solid var(--green-mid);border-bottom:0;
    background:var(--sunken);
  }
  tfoot td.money{color:var(--brand)}

  /* ── Estados ──────────────────────────────────────────────────────────────── */
  .info{color:var(--muted);font-size:12.5px}
  .info + .info{margin-top:4px}
  .nota{color:var(--muted);font-size:12.5px;margin-top:10px}
  .error{
    background:var(--err-bg);color:var(--err-text);border:1px solid var(--err-border);
    padding:14px 16px;border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--sombra-1);
    animation:entrar .24s var(--ease-entrada) both;
  }
  .aviso{
    background:var(--mora-bg);color:var(--mora-text);border:1px solid var(--mora-border);
    padding:14px 16px;border-radius:var(--radius);margin-top:16px;box-shadow:var(--sombra-1);
    animation:entrar .24s var(--ease-entrada) both;
  }
  .aviso h4{margin:0 0 8px;font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.4px}
  .aviso table{font-size:13px}
  .aviso th,.aviso td{border-bottom:1px solid var(--mora-border);color:inherit}
  .aviso th{background:transparent;position:static;color:inherit;cursor:default}
  .loading{color:var(--muted);padding:28px;text-align:center;font-size:14px}
  .empty{color:var(--muted);padding:28px;text-align:center;font-size:14px}

  @media(max-width:820px){
    .controls input,.controls select{width:100%}
    .controls>div{flex:1 1 100%}
    .controls .sp{margin-left:0}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  }

  /* ── Propio del módulo ────────────────────────────────────────────────────── */
  @keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .btn-descarga{display:inline-flex;align-items:center;gap:9px}
  .btn-descarga svg{width:17px;height:17px;flex:0 0 auto;transition:transform var(--t-medio) var(--ease-entrada)}
  .btn-descarga:not(:disabled):hover svg{transform:translateY(2px)}

  /* La planilla es ancha (hasta 31 columnas): PLU y producto quedan clavados a la
     izquierda, si no se scrollea a la derecha y ya no se sabe qué fila se está mirando.
     El fondo va como background-image sobre background-color para que el resaltado de
     fila translúcido no deje ver las celdas que pasan por debajo. */
  .tbl-scroll{max-height:70vh;overflow:auto}
  td.fija,th.fija{position:sticky;background-color:var(--surface);z-index:2}
  th.fija{background-color:var(--th-bg);z-index:3}
  .col-plu{left:0;min-width:72px}
  .col-nom{left:72px;min-width:230px;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover td.fija{background-image:linear-gradient(var(--row-hover),var(--row-hover))}
  /* Día en el que el precio cambió: es lo que se viene a buscar acá. */
  td.cambio{font-weight:700;color:var(--brand);background-image:linear-gradient(var(--reveal-fill),var(--reveal-fill))}
  /* Precio 0 (o día sin precio asignado): se muestra igual que cualquier otro, apenas
     apagado para que no compita con los precios reales. */
  td.cero{color:var(--muted)}
  th.dia{text-align:right;cursor:default}
  th.dia small{display:block;font-size:9.5px;letter-spacing:.4px;color:var(--muted);font-weight:600}
</style></head><body>
<header id="appHeader">
  <span class="logo">API<b>DELTA</b></span>
  <span class="sep"></span>
  <span class="mod">Precios Históricos</span>
  <span class="acciones">
    <button class="tema" id="temaToggle" type="button" title="Cambiar tema" aria-label="Cambiar tema">
      <svg class="i-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.2v2.4M12 19.4v2.4M4.2 12H1.8M22.2 12h-2.4M5.6 5.6 3.9 3.9M20.1 20.1l-1.7-1.7M18.4 5.6l1.7-1.7M3.9 20.1l1.7-1.7"></path>
      </svg>
      <svg class="i-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8Z"></path>
      </svg>
    </button>
    <a href="/">← Inicio</a>
  </span>
</header>

<div class="wrap">
  <div id="msg"></div>

  <div class="card reveal">
    <h3>Período
      <span class="sub">El precio de un día es el del último cambio vigente a esa fecha · precio de venta, lista SUCURSALES</span>
    </h3>
    <div class="controls">
      <div>
        <label for="selMes">Mes</label>
        <select id="selMes"></select>
      </div>
      <div>
        <label for="selAnio">Año</label>
        <select id="selAnio"></select>
      </div>
      <div>
        <button class="btn reveal" id="btnConsultar" type="button">Consultar</button>
      </div>
      <div class="sp">
        <button class="btn btn-outline btn-descarga reveal" id="btnXlsx" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M4 20h16"></path>
          </svg>
          Descargar xlsx
        </button>
      </div>
    </div>
  </div>

  <div class="card reveal">
    <h3>Planilla <span class="sub" id="subPlanilla">Elegí mes y año</span></h3>
    <div class="controls">
      <div style="flex:1 1 320px">
        <label for="inpBuscar">Buscar por producto o PLU</label>
        <input id="inpBuscar" type="search" placeholder="miel, 2570…" style="width:100%" disabled>
      </div>
    </div>
    <div class="tbl-scroll" id="cont">
      <div class="empty">Elegí mes y año, y tocá <b>Consultar</b>.</div>
    </div>
    <div class="nota" id="nota"></div>
  </div>
</div>

<script>
'use strict';

// Preferencia de tema: misma clave que el resto de los módulos.
const TEMA_KEY = 'apidelta-tema';
// La planilla entera puede pasar las 5.000 filas: el DOM no aguanta pintarlas todas.
// En pantalla van las primeras TOPE_FILAS del filtro; el detalle completo sale por el xlsx.
const TOPE_FILAS = 300;
const ANIO_MIN = 2021;   // HistorialPrecios arranca en marzo de 2021 (mismo tope que el backend).
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
               'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let GRILLA = null;        // última respuesta de /api/precios-historico
let consultando = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));
const nfPrecio = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPrecio = n => nfPrecio.format(Number(n) || 0);
// Los días llegan en ISO; se corta el string en vez de usar new Date() para que el
// huso horario no corra el día un lugar para atrás.
const diaCorto = iso => `${iso.slice(8,10)}/${iso.slice(5,7)}`;
const DIA_SEMANA = ['Do','Lu','Ma','Mi','Ju','Vi','Sá'];
// Mediodía a propósito: con T00:00 el huso local puede caer en el día anterior.
const nombreDia = iso => DIA_SEMANA[new Date(`${iso}T12:00:00`).getDay()];

// ── Tema ────────────────────────────────────────────────────────────────────
// El tema ya quedó resuelto por el script del <head> (evita el flash); acá sólo se
// mantiene sincronizado el botón y se escucha el cambio del sistema mientras no haya
// override manual guardado.
function temaGuardado(){
  try {
    const t = localStorage.getItem(TEMA_KEY);
    return (t === 'light' || t === 'dark') ? t : null;
  } catch { return null; }
}
function aplicarTema(tema){
  document.documentElement.setAttribute('data-theme', tema);
  const b = $('temaToggle');
  const rotulo = tema === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
  b.setAttribute('aria-label', rotulo);
  b.setAttribute('title', rotulo);
  b.setAttribute('aria-pressed', String(tema === 'dark'));
}
$('temaToggle').addEventListener('click', () => {
  const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(TEMA_KEY, nuevo); } catch {}
  aplicarTema(nuevo);
});
if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!temaGuardado()) aplicarTema(e.matches ? 'dark' : 'light');
  });
}
aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

// ── Reveal highlight (Fluent) ───────────────────────────────────────────────
// Un único listener delegado actualiza la posición del puntero en variables CSS;
// el gradiente lo dibuja el pseudo-elemento. Con rAF para no escribir estilos en
// cada evento de pointermove.
let revealPend = false;
let revealUlt = null;
document.addEventListener('pointermove', e => {
  const el = e.target instanceof Element ? e.target.closest('.reveal') : null;
  if (!el) return;
  revealUlt = { el, x: e.clientX, y: e.clientY };
  if (revealPend) return;
  revealPend = true;
  requestAnimationFrame(() => {
    revealPend = false;
    if (!revealUlt) return;
    const { el: t, x, y } = revealUlt;
    const r = t.getBoundingClientRect();
    t.style.setProperty('--mx', `${x - r.left}px`);
    t.style.setProperty('--my', `${y - r.top}px`);
  });
}, { passive: true });

// ── Mensajes ────────────────────────────────────────────────────────────────
function mostrarError(texto){
  $('msg').innerHTML = `<div class="error"><b>No se pudo traer la planilla.</b><br>${esc(texto)}</div>`;
}
function limpiarError(){ $('msg').innerHTML = ''; }

// ── Período ─────────────────────────────────────────────────────────────────
function llenarSelects(){
  const hoy = new Date();
  $('selMes').innerHTML = MESES.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  const anios = [];
  for (let a = hoy.getFullYear(); a >= ANIO_MIN; a--) anios.push(a);
  $('selAnio').innerHTML = anios.map(a => `<option value="${a}">${a}</option>`).join('');
  $('selMes').value = String(hoy.getMonth() + 1);
  $('selAnio').value = String(hoy.getFullYear());
}

// ── Consulta ────────────────────────────────────────────────────────────────
async function consultar(){
  if (consultando) return;
  consultando = true;
  limpiarError();
  $('btnConsultar').disabled = true;
  $('btnXlsx').disabled = true;
  $('cont').innerHTML = '<div class="loading">Buscando los cambios de precio del mes…</div>';
  const anio = $('selAnio').value;
  const mes = $('selMes').value;
  try {
    const r = await fetch(`/api/precios-historico?anio=${encodeURIComponent(anio)}&mes=${encodeURIComponent(mes)}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data && data.error ? data.error : `Error ${r.status}`);
    GRILLA = data;
    $('inpBuscar').disabled = false;
    $('btnXlsx').disabled = !(data.filas || []).length;
    render();
  } catch (err) {
    GRILLA = null;
    $('cont').innerHTML = '<div class="empty">Sin datos.</div>';
    $('subPlanilla').textContent = 'Elegí mes y año';
    $('nota').textContent = '';
    mostrarError(err.message);
  } finally {
    consultando = false;
    $('btnConsultar').disabled = false;
  }
}

// ── Render ──────────────────────────────────────────────────────────────────
function filasFiltradas(){
  const q = $('inpBuscar').value.trim().toLowerCase();
  const filas = (GRILLA && GRILLA.filas) || [];
  if (!q) return filas;
  return filas.filter(f => f.nombre.toLowerCase().includes(q) || f.plu.toLowerCase().includes(q));
}

// Sin precio asignado y precio 0 se muestran igual: 0. Son lo mismo para quien mira
// la planilla, y un guion en el medio de la fila se lee como dato faltante.
function celda(fila, i){
  const v = Number(fila.precios[i]) || 0;
  const cambio = i > 0 && (Number(fila.precios[i - 1]) || 0) !== v;
  return `<td class="num${cambio ? ' cambio' : ''}${v ? '' : ' cero'}">${fmtPrecio(v)}</td>`;
}

function render(){
  if (!GRILLA) return;
  const dias = GRILLA.dias || [];
  const todas = filasFiltradas();
  const visibles = todas.slice(0, TOPE_FILAS);
  const total = (GRILLA.filas || []).length;

  $('subPlanilla').textContent =
    `${GRILLA.periodo} · ${total.toLocaleString('es-AR')} productos · ${dias.length} días`;

  if (!visibles.length){
    $('cont').innerHTML = '<div class="empty">Ningún producto coincide con la búsqueda.</div>';
    $('nota').textContent = '';
    return;
  }

  const encabezado = `<tr>
      <th class="fija col-plu">PLU</th>
      <th class="fija col-nom">Producto</th>
      ${dias.map(d => `<th class="dia num">${diaCorto(d)}<small>${nombreDia(d)}</small></th>`).join('')}
    </tr>`;
  const cuerpo = visibles.map(f => `<tr>
      <td class="fija col-plu">${esc(f.plu)}</td>
      <td class="fija col-nom" title="${esc(f.nombre)}">${esc(f.nombre)}</td>
      ${dias.map((_, i) => celda(f, i)).join('')}
    </tr>`).join('');

  $('cont').innerHTML = `<table><thead>${encabezado}</thead><tbody>${cuerpo}</tbody></table>`;
  $('nota').textContent = todas.length > visibles.length
    ? `En pantalla van ${visibles.length} de ${todas.length.toLocaleString('es-AR')} productos: buscá para acotar, o descargá el xlsx con la planilla completa.`
    : 'Resaltado: el día en que cambió el precio. 0: el producto no tenía precio asignado ese día (o su precio era 0).';
}

// ── Descarga ────────────────────────────────────────────────────────────────
// El xlsx lo arma el servidor con la misma consulta: no se re-arma en el browser
// para que la planilla descargada sea exactamente la que se está viendo.
$('btnXlsx').addEventListener('click', () => {
  if (!GRILLA) return;
  window.location.href =
    `/api/precios-historico/xlsx?anio=${encodeURIComponent(GRILLA.anio)}&mes=${encodeURIComponent(GRILLA.mes)}`;
});

$('btnConsultar').addEventListener('click', consultar);
$('inpBuscar').addEventListener('input', render);
llenarSelects();
</script>
</body></html>
