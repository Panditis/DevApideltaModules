<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A8020 calculado · Apidelta</title>
<link rel="icon" href="/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/css/apidelta-theme.js"></script>
<link rel="stylesheet" href="/css/apidelta-theme.css">
<style>
  :root{
    /* Verde/amarillo/bg/card/text/border/error repuntados a los tokens del theme compartido
       (apidelta-theme.js) — el resto (verde-dark, *-cont, surfaces, muted, line) son matices
       propios de este módulo sin token 1:1, se dejan como estaban. */
    --verde:#405936;--verde-dark:#2e4027;--verde-hover:#4f6e42;--verde-cont:#cfe0c2;--verde-on-cont:#0c1f06;
    --amarillo:#FFCC00;--amarillo-on:#3a2f00;--amarillo-cont:#fff1bf;
    --bg:#eef1ea;--card:#fff;--surface1:#f1f5ec;--surface2:#eaf0e4;--surface3:#e3ebdb;
    --text:#242423;--muted:#434840;--faint:#5c5f52;--border:rgba(26,28,24,.16);--line:#dfe5d8;--error:#a4262c;
    --disp:'system-ui','Segoe UI',sans-serif;--body:'system-ui','Segoe UI',sans-serif;
    --shadow:0 1.6px 3.6px rgba(26,28,24,.13),0 0.3px 0.9px rgba(26,28,24,.1);--shadow-lg:0 6px 18px rgba(26,28,24,.22);
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh}
  header{padding:11px 22px;z-index:30}
  header.acrylic .brand{color:#fff}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.3px}
  .brand b{color:var(--amarillo)}
  .brand .sub{font-weight:500;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-left:10px}
  .sp{flex:1}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 22px;background:var(--card);border-bottom:1px solid var(--border);min-height:46px}
  input[type=search]{font-family:var(--body);background:var(--surface1);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;width:240px;font-size:13px;outline:none}
  input[type=search]:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(64,89,54,.15)}
  button{font-family:var(--body);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500}
  button.primary{background:var(--verde);color:#fff;border:0;box-shadow:var(--shadow)}
  button.primary:hover{background:var(--verde-hover)}
  button:disabled{opacity:.5;cursor:default}
  .stat{font-size:11.5px;background:var(--surface1);border:1px solid var(--line);border-radius:7px;padding:4px 10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .stat b{color:var(--text);font-weight:700}
  .div{width:1px;height:18px;background:var(--border);margin:0 3px}
  main{flex:1;overflow:auto;position:relative}
  main::-webkit-scrollbar{width:12px;height:12px}main::-webkit-scrollbar-thumb{background:var(--border);border:3px solid var(--bg);border-radius:8px}
  table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;background:var(--card)}
  thead th{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:9px 8px;text-align:right;white-space:nowrap;font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--verde-dark);cursor:pointer}
  thead th:hover{background:var(--verde-hover)}
  thead th.l{text-align:left}thead th.suc,thead th.suc-rank,thead th.suc-cons{color:var(--amarillo)}
  thead th small{display:block;font-family:var(--body);font-size:9.5px;font-weight:400;color:rgba(255,255,255,.6);text-transform:none;letter-spacing:0}
  tbody td{padding:0 8px;height:31px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-size:12.5px}
  tbody td.l{text-align:left}
  tbody td.nombre{max-width:320px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  tbody tr:nth-child(even){background:var(--surface1)}
  tbody tr:hover{background:var(--verde-cont)}
  .plu{color:var(--faint)}
  td.s.pos span{background:var(--verde-cont);color:var(--verde-on-cont);font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block;min-width:24px;cursor:help}
  td.s.boot span{background:var(--amarillo-cont);color:var(--amarillo-on);font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block;min-width:24px;cursor:help;font-style:italic}
  td.s{color:var(--faint)}
  .abc{font-weight:700;font-size:11px;padding:2px 8px;border-radius:5px;display:inline-block;width:22px;text-align:center}
  .abc.A{background:var(--verde);color:#fff}.abc.B{background:var(--amarillo-cont);color:var(--amarillo-on)}.abc.C{background:var(--surface3);color:var(--faint)}
  .rank{font-weight:700;font-size:10.5px;padding:2px 6px;border-radius:5px;display:inline-block;min-width:30px;text-align:center}
  .rank.hi{background:var(--verde);color:#fff}.rank.mid{background:var(--amarillo-cont);color:var(--amarillo-on)}.rank.lo{background:var(--surface3);color:var(--faint)}
  td.cons{color:var(--muted);font-variant-numeric:tabular-nums}
  td.cons span{cursor:help}
  td.cons.via-bulto span{color:var(--verde-dark);font-weight:600}
  td.cons.via-frac span{color:var(--amarillo-on);font-weight:600}
  .state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:14px;color:var(--muted)}
  .spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--verde);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ts{font-size:11px;color:var(--faint)}
  /* ── Panel anomalías ── */
  #anom-panel{background:var(--amarillo-cont);border-bottom:2px solid var(--amarillo);display:none}
  .anom-hdr{display:flex;align-items:center;gap:10px;padding:9px 22px;cursor:pointer;user-select:none;color:var(--amarillo-on);font-size:12.5px;font-weight:600}
  .anom-hdr:hover{background:rgba(255,204,0,.18)}
  .anom-badge{background:var(--error);color:#fff;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700}
  #anom-body{max-height:340px;overflow:auto;border-top:1px solid rgba(255,204,0,.35)}
  #anom-tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--amarillo-cont)}
  #anom-tbl thead th{background:rgba(255,204,0,.25);color:var(--amarillo-on);padding:7px 8px;text-align:right;font-family:var(--disp);font-size:12px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0}
  #anom-tbl thead th.l{text-align:left}
  #anom-tbl tbody td{padding:0 8px;height:29px;text-align:right;border-bottom:1px solid rgba(255,204,0,.3);white-space:nowrap;font-size:12px}
  #anom-tbl tbody td.l{text-align:left}
  #anom-tbl tbody tr:hover td{background:rgba(255,204,0,.22);cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="acrylic border-b border-borde shadow-fluent sticky top-0">
    <div class="top">
      <span class="brand">api<b>delta</b><span class="sub">A8020 calculado</span></span>
      <span class="sp"></span>
      <a href="/distribucion" style="font-family:var(--body);font-size:12px;font-weight:500;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:7px 14px;border-radius:8px;text-decoration:none">← Distribución</a>
    </div>
  </header>
  <div class="meta">
    <input type="search" id="q" placeholder="Buscar PLU o producto…">
    <div id="rubroWrap" style="position:relative;display:inline-block">
      <button id="rubroBtn" onclick="toggleRubroDrop()" style="font-family:var(--body);font-size:13px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface1);color:var(--text);cursor:pointer">Rubros ▾</button>
      <div id="rubroDrop" style="display:none;position:absolute;z-index:50;top:calc(100% + 4px);left:0;min-width:220px;max-height:340px;overflow:auto;background:var(--surface1,#fff);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px"></div>
    </div>
    <button class="primary" id="recalc">↻ Recalcular desde Siga</button>
    <button id="btnFijos" onclick="abrirPanelFijos()" title="Ver y editar los valores fijados a mano">📌 Fijos</button>
    <span class="div"></span>
    <span id="resumen" class="ts">cargando…</span>
  </div>
  <div id="anom-panel">
    <div class="anom-hdr" onclick="toggleAnom()">
      <span>⚠</span>
      <span>consumo anómalo por sucursal</span>
      <span class="anom-badge" id="anom-badge">0</span>
      <span style="flex:1"></span>
      <span id="anom-chevron">▼ ver</span>
    </div>
    <div id="anom-body" style="display:none">
      <table id="anom-tbl">
        <thead><tr>
          <th class="l">PLU</th><th class="l">Producto</th><th>ABC</th>
          <th class="l">Sucursal baja</th><th>Min suc</th><th>Mediana otras</th><th>%</th>
        </tr></thead>
        <tbody id="anom-rows"></tbody>
      </table>
    </div>
  </div>
  <main>
    <div class="state" id="state"><div class="spinner"></div><div id="stmsg">Cargando A8020…</div></div>
    <table id="tabla" style="display:none"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  </main>
</div>
<!-- Modal: fijar S/min de una celda (plu × sucursal) -->
<div class="modal-bg" id="mFijo" onclick="if(event.target===this)cerrarFijo()">
  <div class="modal">
    <h3><span id="mf-titulo">Ajuste manual</span><span class="sp"></span><button onclick="cerrarFijo()">✕</button></h3>
    <div class="cuerpo">
      <dl class="kv" id="mf-info"></dl>
      <div class="campos">
        <label class="campo">S (objetivo / order-up-to)<input type="number" id="mf-S" step="0.1" min="0"></label>
        <label class="campo">min (punto de pedido)<input type="number" id="mf-min" step="0.1" min="0"></label>
      </div>
      <label class="campo" style="margin-bottom:10px">Nota (opcional)<input type="text" id="mf-nota" maxlength="200" placeholder="Por qué se fija este valor"></label>
      <div class="err" id="mf-err"></div>
    </div>
    <div class="pie">
      <button class="primary" onclick="guardarFijo()">Guardar fijo</button>
      <button id="mf-quitar" onclick="quitarFijo()" style="display:none">Quitar fijo</button>
      <span class="sp" style="flex:1"></span>
      <button onclick="cerrarFijo()">Cancelar</button>
    </div>
  </div>
</div>
<!-- Modal genérico: confirmación / aviso (reemplaza confirm() y alert()) -->
<div class="modal-bg" id="mAviso" onclick="if(event.target===this)cerrarAviso()">
  <div class="modal" style="width:min(430px,92vw)">
    <h3><span id="ma-titulo">Confirmar</span><span class="sp"></span><button onclick="cerrarAviso()">✕</button></h3>
    <div class="cuerpo"><p id="ma-msg" style="margin:0;font-size:13.5px;line-height:1.5"></p></div>
    <div class="pie">
      <button class="primary" id="ma-ok" onclick="aceptarAviso()">Aceptar</button>
      <span style="flex:1"></span>
      <button id="ma-cancelar" onclick="cerrarAviso()">Cancelar</button>
    </div>
  </div>
</div>
<!-- Modal: listado de todos los ajustes manuales -->
<div class="modal-bg" id="mLista" onclick="if(event.target===this)cerrarPanelFijos()">
  <div class="modal" style="width:min(860px,96vw)">
    <h3>📌 Valores fijados a mano<span class="sp"></span><button onclick="cerrarPanelFijos()">✕</button></h3>
    <div class="cuerpo" id="ml-body">cargando…</div>
  </div>
</div>
<style>
#rubroDrop .rubro-opt{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:13px;cursor:pointer}
#rubroDrop .rubro-opt:hover{background:var(--surface2,#f1f1f1)}
#rubroDrop .rubro-opt-clear{padding:5px 8px;font-size:12px;color:var(--verde);cursor:pointer;border-bottom:1px solid var(--border);margin-bottom:4px}
/* ── Ajustes manuales (S/min fijos) ── */
td.s{cursor:pointer}
td.s.fijo span{box-shadow:inset 0 0 0 2px #7c3aed}
td.s.fijo::after{content:'📌';font-size:9px;margin-left:3px;vertical-align:top}
.modal-bg{position:fixed;inset:0;background:rgba(20,26,18,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
#mAviso{z-index:120}   /* confirmación/aviso siempre por encima del panel de fijos */
.modal{background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,94vw);max-height:88vh;overflow:auto}
.modal h3{font-family:var(--disp);font-size:19px;margin:0;padding:14px 18px;background:var(--verde);color:#fff;border-radius:14px 14px 0 0;display:flex;align-items:center;gap:10px}
.modal h3 .sp{flex:1}
.modal h3 button{background:rgba(255,255,255,.18);border:0;color:#fff;padding:4px 10px;border-radius:7px}
.modal .cuerpo{padding:16px 18px}
.modal .pie{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:0 0 14px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.campo input{font-family:var(--body);font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface1);color:var(--text);outline:none}
.campo input:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(64,89,54,.15)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.err{color:var(--error);font-size:12px;font-weight:500}
#fijos-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
#fijos-tbl th{position:sticky;top:0;z-index:2;text-align:left;font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--verde);padding:8px 6px;border-bottom:2px solid var(--verde-dark);white-space:nowrap}
#fijos-tbl th.num{text-align:right}
#fijos-tbl td{padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#fijos-tbl td.num{text-align:right}
#fijos-tbl tbody tr:nth-child(even){background:var(--surface1)}
#fijos-tbl button{padding:3px 8px;font-size:11px}
#ml-scroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
#ml-barra{display:flex;gap:8px;align-items:center;margin-bottom:10px}
#ml-q{flex:1}
</style>
<script>
const SUC = [['riv','Rivadavia'],['urq','Urquiza'],['nacion','Nación'],['chaca','Chacabuco'],['pergamino','Pergamino'],['sanpedro','San Pedro'],['ramallo','Villa Ramallo']];
const SUC_ID = {riv:5,urq:2,nacion:3,chaca:4,pergamino:10,sanpedro:7,ramallo:9};
let cache = {}, filas = [], orden = {col:'tot',dir:-1};
const fmt = (n)=> (n==null||n===0)?'·':(Math.round(n*100)/100).toLocaleString('es-AR');
const sumS = (r)=> SUC.reduce((s,[k])=> s+(r.mins[k]||0),0);
const RANK_SUFFIX = '_r';
const rankCol = (k)=> k+RANK_SUFFIX;
const sucOfRankCol = (c)=> c.slice(0,-RANK_SUFFIX.length);
// Consumo real de la ventana: ventas ya imputadas al producto que sale del stock
// (bulto → sus componentes, fraccionado → kg del granel). Informativo: no altera S ni min.
// Rubro mayorista: se excluye del listado (su demanda vive en los componentes de su fórmula).
const RUBRO_BULTO = 'Almacen Bultos/Cajas';
const CONS_SUFFIX = '_c';
const consCol = (k)=> k+CONS_SUFFIX;
const sucOfConsCol = (c)=> c.slice(0,-CONS_SUFFIX.length);

function construir(){
  const opsTxt = (k)=>{ const id=SUC_ID[k]; const n=(cache.opsDays||{})[id]; return n?`<small>${n}d op.</small>`:''; };
  const cols = [['plu','PLU','l'],['nombre','Producto','l'],['abc','ABC',''],['rankGeneral','Gral','']]
    .concat(SUC.flatMap(([k,n])=>[[k,n,'suc'],[rankCol(k),'R','suc-rank'],[consCol(k),'Cons','suc-cons']]))
    .concat([['tot','Σ S','']]);
  document.getElementById('head').innerHTML = cols.map(([k,n,cls])=>{
    const ar = orden.col===k ? (orden.dir<0?' ▼':' ▲') : '';
    const sub = cls==='suc' ? opsTxt(k) : cls==='suc-rank' ? `<small>${sucOfRankCol(k)}</small>`
              : cls==='suc-cons' ? `<small>${sucOfConsCol(k)}</small>` : '';
    return `<th class="${cls||''}" data-col="${k}">${n}${ar}${sub}</th>`;
  }).join('');
  document.querySelectorAll('#head th').forEach(th=> th.onclick = ()=>{
    const c=th.dataset.col;
    if(orden.col===c) orden.dir*=-1; else {orden.col=c; orden.dir=(c==='plu'||c==='nombre'||c==='abc')?1:-1;}
    render();
  });
}
function valor(r,c){
  if(c==='tot') return sumS(r);
  if(c==='rankGeneral') return r.rankGeneral??-1;
  if(c.endsWith(CONS_SUFFIX)) return (r.consumo||{})[sucOfConsCol(c)]||0;
  if(c.endsWith(RANK_SUFFIX)){ const k=sucOfRankCol(c); const d=(r.detalle||{})[k]||{}; return d.ranking??-1; }
  if(SUC.some(([k])=>k===c)) return r.mins[c]||0;
  if(c==='nombre') return (r.nombre||'').toLowerCase();
  if(c==='abc') return ({A:0,B:1,C:2})[r.abc] ?? 3;
  return r[c]??0;
}
let filtroClase=null;
let rubrosSel=new Set();   // vacío = todos
function construirRubroFiltro(){
  const set=new Set(filas.map(r=>r.rubro).filter(Boolean));
  const rubros=[...set].sort((a,b)=>a.localeCompare(b));
  const drop=document.getElementById('rubroDrop');
  drop.innerHTML=`<div class="rubro-opt-clear" onclick="rubroAll()">Mostrar todos</div>`+
    rubros.map(rb=>`<label class="rubro-opt"><input type="checkbox" ${rubrosSel.has(rb)?'checked':''} onchange="toggleRubro(this,'${rb.replace(/'/g,"\\'")}')"><span>${rb}</span></label>`).join('');
  actualizarRubroBtn();
}
function actualizarRubroBtn(){ const b=document.getElementById('rubroBtn'); if(b) b.textContent=(rubrosSel.size?`Rubros (${rubrosSel.size})`:'Rubros')+' ▾'; }
function toggleRubroDrop(){ const d=document.getElementById('rubroDrop'); d.style.display=d.style.display==='none'?'':'none'; }
function toggleRubro(chk,rb){ chk.checked?rubrosSel.add(rb):rubrosSel.delete(rb); actualizarRubroBtn(); render(); }
function rubroAll(){ rubrosSel.clear(); document.querySelectorAll('#rubroDrop input').forEach(c=>c.checked=false); actualizarRubroBtn(); render(); }
document.addEventListener('click',e=>{ const w=document.getElementById('rubroWrap'); const d=document.getElementById('rubroDrop'); if(w&&d&&d.style.display!=='none'&&!w.contains(e.target)) d.style.display='none'; });
function matchClase(r,c){
  if(c==='A'||c==='B'||c==='C'||c==='F') return r.abc===c;
  if(c==='nuevo') return !!r.nuevo;
  if(c==='viejo') return !!r.viejo;
  if(c==='bootstrap') return !!r.bootstrap;
  return true;
}
function setFiltro(c){ filtroClase = (filtroClase===c) ? null : c; render(); }
// Celda de consumo real de la ventana para (producto, sucursal). El tooltip abre el desglose:
// propio = ventas del PLU · bulto = ventas de bultos que lo llevan en la fórmula ·
// fraccionado = ventas de fraccionados que salen de este granel (en kg).
function consCell(r,k){
  const v=(r.consumo||{})[k];
  if(!(v>0)) return '<td class="cons">·</td>';
  const o=(r.consumoOrigen||{})[k]||{};
  const partes=[];
  if(o.propio>0) partes.push(`propio ${fmt(o.propio)}`);
  if(o.bulto>0) partes.push(`vía bultos ${fmt(o.bulto)}`);
  if(o.fraccionado>0) partes.push(`vía fraccionado ${fmt(o.fraccionado)}`);
  const cls = o.fraccionado>0 ? ' via-frac' : o.bulto>0 ? ' via-bulto' : '';
  const tip = `Consumo real ventana ${cache.ventanaMeses}m: ${fmt(v)}`+(partes.length?`\n${partes.join('  ·  ')}`:'');
  return `<td class="cons${cls}"><span title="${tip.replace(/"/g,'&quot;')}">${fmt(v)}</span></td>`;
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let rows = filas.filter(r=> !q || String(r.plu).includes(q) || (r.nombre||'').toLowerCase().includes(q));
  if(filtroClase) rows = rows.filter(r=> matchClase(r,filtroClase));
  if(rubrosSel.size) rows = rows.filter(r=> rubrosSel.has(r.rubro));
  rows.sort((a,b)=>{const va=valor(a,orden.col),vb=valor(b,orden.col);return (va<vb?-1:va>vb?1:0)*orden.dir;});
  document.getElementById('body').innerHTML = rows.slice(0,1500).map(r=>{
    const celdas = SUC.map(([k])=>{ const s=r.mins[k]; const d=(r.detalle||{})[k]||{};
      const boot = d.bootstrap===true;
      const mn=(r.trig||{})[k];
      const fijo = d.manual===true;
      const tip = (d.mu!=null?`${boot?'~bootstrap~ ':''}S=${fmt(s)}  ·  min=${fmt(mn)}  ·  μ=${d.mu}  σ=${d.sigma}`:'')
        + (fijo?`\nFIJADO A MANO (calculado: S=${fmt(d.S)} · min=${fmt(d.min)})`:'') + '\nClick para ajustar';
      const cls = `s${fijo?' fijo':''}`;
      const click = ` onclick="abrirFijo(${r.plu},'${k}')"`;
      const sCell = (s>0 && boot) ? `<td class="${cls} boot"${click}><span title="${tip}">~${fmt(s)}</span></td>`
        : s>0 ? `<td class="${cls} pos"${click}><span title="${tip}">${fmt(s)}</span></td>`
        : `<td class="${cls}"${click} title="Click para ajustar">·</td>`;
      const rk = d.ranking;
      const rkCls = rk==null ? '' : rk>=0.8 ? 'hi' : rk>=0.5 ? 'mid' : 'lo';
      const rkCell = rk==null ? '<td class="s">·</td>' : `<td><span class="rank ${rkCls}">${rk.toFixed(2)}</span></td>`;
      return sCell + rkCell + consCell(r,k); }).join('');
    const badge = r.nuevo ? '<span style="margin-left:4px;background:var(--verde-cont);color:var(--verde-on-cont);font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px" title="Primera compra reciente (ventana nuevo.dias). Recibe el piso de reposición de producto nuevo.">NUEVO</span>'
      : r.viejo ? '<span style="margin-left:4px;background:#f3e8ff;color:#6b21a8;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px" title="Sin ventas con movimientos hace meses: stock muerto, no se stockea ni se empuja">VIEJO</span>' : '';
    const abcStyle = r.abc==='F' ? ' style="background:#f3e8ff;color:#6b21a8"' : '';
    const rg = r.rankGeneral;
    const rgCls = rg==null ? '' : rg>=0.8 ? 'hi' : rg>=0.5 ? 'mid' : 'lo';
    const rgCell = rg==null ? '<td class="s">·</td>' : `<td><span class="rank ${rgCls}" title="Percentil de facturación en TODO el catálogo (sin distinguir sucursal)">${rg.toFixed(2)}</span></td>`;
    return `<tr><td class="l plu">${r.plu}</td><td class="l nombre" title="${(r.nombre||'').replace(/"/g,'&quot;')}">${r.nombre||''}</td>`+
      `<td><span class="abc ${r.abc}"${abcStyle}>${r.abc}</span>${badge}</td>${rgCell}${celdas}<td style="font-weight:700;color:var(--verde-dark)">${fmt(sumS(r))}</td></tr>`;
  }).join('');
  const nA=filas.filter(r=>r.abc==='A').length, nB=filas.filter(r=>r.abc==='B').length, nC=filas.filter(r=>r.abc==='C').length, nF=filas.filter(r=>r.abc==='F').length;
  const act = c => filtroClase===c ? 'outline:2px solid currentColor;outline-offset:1px;' : '';
  const chip = (c,label,cnt,extra='') => `<span class="stat" title="Filtrar ${label}" style="cursor:pointer;${extra}${act(c)}" onclick="setFiltro('${c}')">${label} <b>${cnt}</b></span>`;
  document.getElementById('resumen').innerHTML =
    `<span class="stat">${rows.length} productos${filtroClase?` · <span style="color:var(--verde)">filtro ${filtroClase}</span> <a onclick="setFiltro('${filtroClase}')" style="cursor:pointer;text-decoration:underline">✕</a>`:''}</span>`+
    chip('A','A',nA)+chip('B','B',nB)+chip('C','C',nC)+chip('F','F',nF,'background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8;')+
    ((cache.nuevos||[]).length ? chip('nuevo','NUEVO',(cache.nuevos||[]).length,'background:var(--verde-cont);border-color:var(--verde);color:var(--verde-on-cont);') : '')+
    ((cache.viejos||[]).length ? chip('viejo','VIEJO/F',(cache.viejos||[]).length,'background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8;') : '')+
    ((cache.bootstrapped||[]).length ? chip('bootstrap','~ bootstrap',(cache.bootstrapped||[]).length,'background:var(--amarillo-cont);border-color:var(--amarillo);color:var(--amarillo-on);') : '')+
    `<span class="div"></span><span class="ts">ventana ${cache.ventanaMeses}m · ${cache.timestamp? new Date(cache.timestamp).toLocaleString('es-AR'):'—'} ${rows.length>1500?'· mostrando 1500':''}</span>`;
}
async function cargar(){
  const r = await fetch('/api/distribucion/a8020'); cache = await r.json();
  if(cache.vacio || !cache.mins){ document.getElementById('stmsg').innerHTML='Sin caché. Tocá <b>Recalcular desde Siga</b>.'; document.querySelector('.spinner').style.display='none'; return; }
  // mins de la tabla = S (order-up-to, el nivel objetivo); trig = min (punto de pedido) para el tooltip.
  const nuevosSet = new Set((cache.nuevos||[]).map(Number));
  const viejosSet = new Set((cache.viejos||[]).map(Number));
  const bootSet = new Set((cache.bootstrapped||[]).map(Number));
  // Un granel puede tener consumo sin niveles propios (no se vende suelto): igual lleva fila,
  // con las columnas S en '·' y el consumo cargado.
  // Los bultos/cajas nunca son fila propia: su venta ya se imputó como consumo a los
  // componentes de su fórmula, así que mostrarlos duplicaría la demanda en pantalla.
  const plus = [...new Set([...Object.keys(cache.mins), ...Object.keys(cache.consumo||{})])]
    .filter(plu => ((cache.rubros||{})[plu]||'') !== RUBRO_BULTO);
  filas = plus.map(plu=>({ plu:Number(plu), nombre:(cache.nombres||{})[plu]||'', abc:(cache.abc||{})[plu]||'C', rubro:(cache.rubros||{})[plu]||'', mins:(cache.sLevels||{})[plu]||cache.mins[plu]||{}, trig:(cache.mins||{})[plu]||{}, detalle:(cache.detalle||{})[plu]||{}, rankGeneral:(cache.rankingGeneral||{})[plu],
    consumo:(cache.consumo||{})[plu]||{}, consumoOrigen:(cache.consumoOrigen||{})[plu]||{}, nuevo:nuevosSet.has(Number(plu)), viejo:viejosSet.has(Number(plu)), bootstrap:bootSet.has(Number(plu)) }));
  construirRubroFiltro();
  construir(); render(); renderAnomalias(); actualizarBotonFijos();
  document.getElementById('state').style.display='none'; document.getElementById('tabla').style.display='';
}
// ── Detección de anomalías ────────────────────────────────────────────────────
// Umbral: si una sucursal tiene < 15% del consumo mediano de las demás (y hay ≥3 con datos), es anómala.
const ANOM_RATIO   = 0.15;
const ANOM_MIN_POS = 3;    // mínimo de sucursales con datos positivos para comparar
const ANOM_MIN_MED = 1.0;  // mediana < 1 → ruido, ignorar

function detectarAnomalias() {
  const alertas = [];
  for (const r of filas) {
    const vals = SUC.map(([k, n]) => ({ k, n, v: r.mins[k] || 0 }));
    const positivas = vals.filter(x => x.v > 0);
    if (positivas.length < ANOM_MIN_POS) continue;
    const sorted = positivas.map(x => x.v).sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)];
    if (med < ANOM_MIN_MED) continue;
    for (const { k, n, v } of vals) {
      if (v > 0 && v / med >= ANOM_RATIO) continue;
      alertas.push({ plu: r.plu, nombre: r.nombre, abc: r.abc, sucKey: k, sucNombre: n, val: v, mediana: med, ratio: v / med });
    }
  }
  return alertas.sort((a, b) => a.ratio - b.ratio);
}

let anomAbierto = false;
function toggleAnom() {
  anomAbierto = !anomAbierto;
  document.getElementById('anom-body').style.display = anomAbierto ? '' : 'none';
  document.getElementById('anom-chevron').textContent = anomAbierto ? '▲ cerrar' : '▼ ver';
}
function filtrarPorPlu(plu) {
  document.getElementById('q').value = String(plu);
  render();
  document.getElementById('tabla').scrollIntoView({ behavior:'smooth' });
}
function renderAnomalias() {
  const alertas = detectarAnomalias();
  const panel = document.getElementById('anom-panel');
  if (!alertas.length) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  document.getElementById('anom-badge').textContent = alertas.length;
  document.getElementById('anom-rows').innerHTML = alertas.map(a => {
    const pct = Math.round(a.ratio * 100);
    const col = a.val === 0 ? 'var(--error)' : pct < 5 ? '#c2410c' : '#92400e';
    const barW = Math.max(Math.round(a.ratio * 80), 1);
    return `<tr onclick="filtrarPorPlu(${a.plu})">
      <td class="l plu">${a.plu}</td>
      <td class="l nombre" title="${(a.nombre||'').replace(/"/g,'&quot;')}">${a.nombre}</td>
      <td><span class="abc ${a.abc}">${a.abc}</span></td>
      <td class="l">${a.sucNombre}</td>
      <td style="color:${col};font-weight:700">${a.val===0?'—':fmt(a.val)}</td>
      <td>${fmt(a.mediana)}</td>
      <td>
        <span style="color:${col};font-weight:700;font-variant-numeric:tabular-nums">${a.val===0?'0%':pct+'%'}</span>
        <span style="display:inline-block;width:${barW}px;height:4px;background:${col};border-radius:2px;margin-left:5px;vertical-align:middle;opacity:.7"></span>
      </td>
    </tr>`;
  }).join('');
}

// ── Ajustes manuales de S/min por (plu, sucursal) ─────────────────────────────
// El backend guarda data/a8020_manual.json y lo reaplica sobre el caché: el recálculo
// desde Siga nunca pisa estos valores (el calculado queda visible en detalle.S/.min).
const NOMBRE_SUC = Object.fromEntries(SUC);
let fijoActual = null;   // { plu, suc }

function actualizarBotonFijos(){
  let n=0;
  for(const porSuc of Object.values(cache.detalle||{})) for(const d of Object.values(porSuc)) if(d.manual===true) n++;
  const b=document.getElementById('btnFijos');
  if(b) b.textContent = n ? `📌 Fijos (${n})` : '📌 Fijos';
}
function abrirFijo(plu, suc){
  fijoActual = { plu:String(plu), suc };
  const d = ((cache.detalle||{})[plu]||{})[suc] || {};
  const nombre = (cache.nombres||{})[plu] || '';
  const efS = ((cache.sLevels||{})[plu]||{})[suc];
  const efMin = ((cache.mins||{})[plu]||{})[suc];
  const fijo = d.manual===true;
  document.getElementById('mf-titulo').textContent = `${nombre||'PLU '+plu} · ${NOMBRE_SUC[suc]||suc}`;
  const orig = [
    ['PLU', plu],
    ['Producto', nombre||'—'],
    ['Sucursal', NOMBRE_SUC[suc]||suc],
    ['Clase ABC', (cache.abc||{})[plu]||'—'],
    ['S calculado', fmt(d.S)],
    ['min calculado', fmt(d.min)],
    ['μ / σ diarios', d.mu!=null?`${fmt(d.mu)} / ${fmt(d.sigma)}`:'—'],
    ['Vigente hoy', `S=${fmt(efS)} · min=${fmt(efMin)}${fijo?' (fijado a mano)':''}`],
  ];
  if(fijo){
    orig.push(['Observación', (d.manualNota||'—').replace(/</g,'&lt;')]);
    if(d.manualTs) orig.push(['Fijado el', new Date(d.manualTs).toLocaleString('es-AR')]);
  }
  document.getElementById('mf-info').innerHTML = orig.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.getElementById('mf-S').value   = efS!=null ? efS : '';
  document.getElementById('mf-min').value = efMin!=null ? efMin : '';
  document.getElementById('mf-nota').value = fijo ? (d.manualNota || '') : '';
  document.getElementById('mf-err').textContent = '';
  document.getElementById('mf-quitar').style.display = fijo ? '' : 'none';
  document.getElementById('mFijo').classList.add('open');
  document.getElementById('mf-S').focus();
}
function cerrarFijo(){ document.getElementById('mFijo').classList.remove('open'); fijoActual=null; }
async function guardarFijo(){
  if(!fijoActual) return;
  const err = document.getElementById('mf-err');
  const S = document.getElementById('mf-S').value.trim();
  const min = document.getElementById('mf-min').value.trim();
  if(S==='' && min===''){ err.textContent='Indicá al menos S o min.'; return; }
  if(S!=='' && min!=='' && Number(min)>=Number(S)){ err.textContent='El S tiene que ser mayor que el min.'; return; }
  err.textContent='';
  try{
    const r = await fetch('/api/distribucion/a8020/manual', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ plu:fijoActual.plu, sucursal:fijoActual.suc, S:S===''?null:S, min:min===''?null:min,
        nota: document.getElementById('mf-nota').value.trim() }) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    cerrarFijo(); await cargar();
  }catch(e){ err.textContent='Error: '+e.message; }
}
// Modal genérico en lugar de confirm()/alert(): confirmar() resuelve true/false, avisar() sólo informa.
let avisoResolve = null;
function abrirAviso({ titulo, msg, ok='Aceptar', conCancelar=true }){
  document.getElementById('ma-titulo').textContent = titulo;
  document.getElementById('ma-msg').textContent = msg;
  document.getElementById('ma-ok').textContent = ok;
  document.getElementById('ma-cancelar').style.display = conCancelar ? '' : 'none';
  document.getElementById('mAviso').classList.add('open');
  document.getElementById('ma-ok').focus();
  return new Promise(res => { avisoResolve = res; });
}
function cerrarAviso(){
  document.getElementById('mAviso').classList.remove('open');
  if(avisoResolve){ const r=avisoResolve; avisoResolve=null; r(false); }
}
function aceptarAviso(){
  document.getElementById('mAviso').classList.remove('open');
  if(avisoResolve){ const r=avisoResolve; avisoResolve=null; r(true); }
}
const confirmar = (msg, titulo='Confirmar', ok='Aceptar') => abrirAviso({ titulo, msg, ok });
const avisar = (msg, titulo='Aviso') => abrirAviso({ titulo, msg, ok:'Entendido', conCancelar:false });

async function quitarFijo(plu, suc){
  const p = plu!=null ? String(plu) : (fijoActual&&fijoActual.plu);
  const s = suc || (fijoActual&&fijoActual.suc);
  if(!p||!s) return;
  const listaAbierta = document.getElementById('mLista').classList.contains('open');
  const ok = await confirmar(`¿Quitar el valor fijo del PLU ${p} en ${NOMBRE_SUC[s]||s}? Vuelve al valor calculado.`,
    'Quitar fijo', 'Quitar fijo');
  if(!ok) return;
  const r = await fetch(`/api/distribucion/a8020/manual/${encodeURIComponent(p)}/${encodeURIComponent(s)}`, { method:'DELETE' });
  if(!r.ok){ await avisar('No se pudo quitar el fijo. Probá de nuevo.', 'Error'); return; }
  cerrarFijo(); await cargar();
  if(listaAbierta) abrirPanelFijos();
}
function cerrarPanelFijos(){ document.getElementById('mLista').classList.remove('open'); }
let fijosItems = [];
function renderFijos(){
  const q = (document.getElementById('ml-q')?.value || '').trim().toLowerCase();
  const rows = fijosItems.filter(it => !q
    || String(it.plu).includes(q)
    || (it.nombre||'').toLowerCase().includes(q)
    || (NOMBRE_SUC[it.sucursal]||it.sucursal).toLowerCase().includes(q)
    || (it.nota||'').toLowerCase().includes(q));
  document.getElementById('ml-cont').innerHTML = rows.length ? `<div id="ml-scroll"><table id="fijos-tbl"><thead><tr>
      <th>PLU</th><th>Producto</th><th>Sucursal</th><th class="num">S fijo</th><th class="num">min fijo</th>
      <th class="num">S calc</th><th class="num">min calc</th><th>Nota</th><th></th></tr></thead><tbody>`+
      rows.map(it=>`<tr>
        <td>${it.plu}</td>
        <td>${(it.nombre||'').replace(/</g,'&lt;')}</td>
        <td>${NOMBRE_SUC[it.sucursal]||it.sucursal}</td>
        <td class="num"><b>${it.S!=null?fmt(it.S):'—'}</b></td>
        <td class="num"><b>${it.min!=null?fmt(it.min):'—'}</b></td>
        <td class="num" style="color:var(--faint)">${fmt(it.calcS)}</td>
        <td class="num" style="color:var(--faint)">${fmt(it.calcMin)}</td>
        <td style="color:var(--faint)">${(it.nota||'').replace(/</g,'&lt;')}</td>
        <td style="white-space:nowrap">
          <button onclick="cerrarPanelFijos();abrirFijo(${it.plu},'${it.sucursal}')">Editar</button>
          <button onclick="quitarFijo(${it.plu},'${it.sucursal}')">Quitar</button>
        </td></tr>`).join('')+`</tbody></table></div>`
    : '<p style="color:var(--faint)">Ningún fijo coincide con la búsqueda.</p>';
  document.getElementById('ml-cnt').textContent = `${rows.length} de ${fijosItems.length}`;
}
async function abrirPanelFijos(){
  const cont = document.getElementById('ml-body');
  document.getElementById('mLista').classList.add('open');
  cont.textContent = 'cargando…';
  try{
    const r = await fetch('/api/distribucion/a8020/manual');
    const { items } = await r.json();
    fijosItems = items;
    if(!items.length){ cont.innerHTML='<p style="color:var(--faint)">No hay valores fijados a mano. Hacé click en cualquier celda de sucursal para fijar uno.</p>'; return; }
    cont.innerHTML = `<div id="ml-barra">
        <input type="search" id="ml-q" placeholder="Buscar PLU, producto, sucursal o nota…">
        <span class="stat" id="ml-cnt"></span>
      </div><div id="ml-cont"></div>`;
    const inp = document.getElementById('ml-q');
    inp.oninput = renderFijos;
    renderFijos();
    inp.focus();
  }catch(e){ cont.textContent = 'Error: '+e.message; }
}
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  // Escape cierra sólo el modal de más arriba: el aviso no debe arrastrar a los de abajo.
  if(document.getElementById('mAviso').classList.contains('open')) return cerrarAviso();
  cerrarFijo(); cerrarPanelFijos();
});

document.getElementById('q').oninput = render;
document.getElementById('recalc').onclick = async (e)=>{
  const b=e.target; b.disabled=true; const txt=b.textContent; b.textContent='Calculando… (puede tardar)';
  document.getElementById('tabla').style.display='none';
  const st=document.getElementById('state'); st.style.display='flex'; document.querySelector('.spinner').style.display='';
  document.getElementById('stmsg').textContent='Recalculando desde Siga…';
  try{ const r=await fetch('/api/distribucion/a8020/recalcular'); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status)); await cargar(); }
  catch(err){ document.getElementById('stmsg').textContent='Error: '+err.message; }
  b.disabled=false; b.textContent=txt;
};
cargar();
</script>
