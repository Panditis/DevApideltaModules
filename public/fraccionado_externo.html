<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraccionado Externo — Apidelta</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/css/apidelta-theme.js"></script>
<link rel="stylesheet" href="/css/apidelta-theme.css">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.js"></script>
<style>
  .tab-btn.active { border-color: #405936; color: #405936; font-weight: 600; }
  .tab-btn { border-bottom: 2px solid transparent; color: #5c5f52; }
</style>
</head>
<body class="text-ink font-body">
<div id="modalOverlay" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 hidden" style="z-index:50">
  <div class="bg-white rounded-lg shadow-lg max-w-sm w-full p-5">
    <p id="modalMensaje" class="text-sm text-ink mb-4"></p>
    <div class="flex justify-end gap-2">
      <button id="modalCancelar" type="button" class="hidden text-sm px-3 py-1.5 rounded border border-borde text-ink hover:bg-white">Cancelar</button>
      <button id="modalAceptar" type="button" class="text-sm px-3 py-1.5 rounded bg-verde text-white hover:bg-verdeHover">Aceptar</button>
    </div>
  </div>
</div>
<header class="acrylic sticky top-0 z-20 border-b border-borde shadow-fluent">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
    <h1 class="font-disp text-xl font-bold">Fraccionado Externo</h1>
    <a href="/" class="ml-auto text-sm">← Inicio</a>
  </div>
</header>
<div class="max-w-5xl mx-auto p-4 sm:p-6">

  <p class="text-sm text-ink/60 mb-4">Armá pedidos de fraccionado para tercerizar, con el costo de mano de obra calculado desde el historial real.</p>

  <div class="flex gap-4 border-b border-borde mb-4">
    <button class="tab-btn active py-2 px-1" data-tab="armado">Armar pedido</button>
    <button class="tab-btn py-2 px-1" data-tab="guardados">Pedidos guardados</button>
  </div>

  <section id="tab-armado">
    <div class="bg-white border border-borde rounded-lg p-4 mb-4 flex flex-wrap gap-4 items-end">
      <div>
        <label class="block text-xs text-ink/60 mb-1">Valor hora ($)</label>
        <input id="valorHora" type="number" step="1" min="1" value="8100" class="border border-borde rounded px-2 py-1 w-32">
      </div>
      <div>
        <label class="block text-xs text-ink/60 mb-1">Tercero</label>
        <input id="tercero" type="text" placeholder="Nombre del fraccionador" class="border border-borde rounded px-2 py-1 w-64">
      </div>
    </div>

    <div class="bg-white border border-borde rounded-lg p-4 mb-4">
      <label class="block text-xs text-ink/60 mb-1">Buscar producto</label>
      <input id="buscarProducto" type="text" placeholder="Escribí para buscar..." class="border border-borde rounded px-2 py-1 w-full mb-2">
      <div id="resultados" class="max-h-56 overflow-y-auto divide-y divide-borde text-sm"></div>
    </div>

    <div class="bg-white border border-borde rounded-lg p-4 mb-4 overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-ink/60 uppercase">
            <th class="py-2 pr-2">Producto</th>
            <th class="py-2 pr-2">Presentación</th>
            <th class="py-2 pr-2">Min./paquete</th>
            <th class="py-2 pr-2 text-right">Kilos</th>
            <th class="py-2 pr-2 text-right">Paquetes</th>
            <th class="py-2 pr-2 text-right">Factor</th>
            <th class="py-2 pr-2 text-right">Costo unit.</th>
            <th class="py-2 pr-2 text-right">Costo total</th>
            <th class="py-2"></th>
          </tr>
        </thead>
        <tbody id="carrito"></tbody>
      </table>
      <p id="carritoVacio" class="text-sm text-ink/50 py-4">Todavía no agregaste productos.</p>
      <div class="flex justify-between items-center mt-3 pt-3 border-t border-borde">
        <span class="font-semibold">Total: <span id="totalPedido">$0</span></span>
        <button id="btnGenerar" class="bg-verde text-white text-sm rounded px-4 py-2 disabled:opacity-40" disabled>Generar pedido</button>
      </div>
    </div>
  </section>

  <section id="tab-guardados" class="hidden">
    <div class="bg-white border border-borde rounded-lg p-4 overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-ink/60 uppercase">
            <th class="py-2 pr-2">Número</th>
            <th class="py-2 pr-2">Fecha</th>
            <th class="py-2 pr-2">Tercero</th>
            <th class="py-2 pr-2 text-right">Total</th>
            <th class="py-2 pr-2">Estado</th>
            <th class="py-2"></th>
          </tr>
        </thead>
        <tbody id="listaPedidos"></tbody>
      </table>
    </div>
  </section>

</div>
<script>
  const carrito = []; // { plu, nombre, presentacion, minPorPaquete, origenTiempo, paquetes, factorComplejidad }

  function escAttr(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  // Modal propio en vez de alert()/confirm() nativos del navegador — mismo resultado
  // (Promise que resuelve al cerrar), pero sin bloquear el hilo ni verse "de sistema".
  function mostrarModal(mensaje, { conCancelar = false } = {}) {
    return new Promise(resolve => {
      const overlay = document.getElementById('modalOverlay');
      document.getElementById('modalMensaje').textContent = mensaje;
      const btnCancelar = document.getElementById('modalCancelar');
      const btnAceptar = document.getElementById('modalAceptar');
      btnCancelar.classList.toggle('hidden', !conCancelar);
      btnAceptar.textContent = conCancelar ? 'Confirmar' : 'Aceptar';
      overlay.classList.remove('hidden');
      function cerrar(resultado) {
        overlay.classList.add('hidden');
        btnAceptar.removeEventListener('click', onAceptar);
        btnCancelar.removeEventListener('click', onCancelar);
        resolve(resultado);
      }
      function onAceptar() { cerrar(true); }
      function onCancelar() { cerrar(false); }
      btnAceptar.addEventListener('click', onAceptar);
      btnCancelar.addEventListener('click', onCancelar);
    });
  }
  function mostrarAviso(mensaje) { return mostrarModal(mensaje, { conCancelar: false }); }
  function confirmarAccion(mensaje) { return mostrarModal(mensaje, { conCancelar: true }); }

  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-armado').classList.toggle('hidden', btn.dataset.tab !== 'armado');
    document.getElementById('tab-guardados').classList.toggle('hidden', btn.dataset.tab !== 'guardados');
    if (btn.dataset.tab === 'guardados') cargarPedidos();
  }));

  const buscarInput = document.getElementById('buscarProducto');
  let buscarTimeout = null;
  buscarInput.addEventListener('input', () => {
    clearTimeout(buscarTimeout);
    buscarTimeout = setTimeout(buscarProductos, 250);
  });

  async function buscarProductos() {
    const q = buscarInput.value.trim();
    const contenedor = document.getElementById('resultados');
    if (!q) { contenedor.innerHTML = ''; return; }
    let productos;
    try {
      const r = await fetch('/api/fraccionado-externo/productos?buscar=' + encodeURIComponent(q));
      const data = await r.json();
      if (!r.ok) { await mostrarAviso(data.error || 'No se pudieron buscar productos'); return; }
      productos = data.productos;
    } catch (e) {
      await mostrarAviso('No se pudo conectar con el servidor');
      return;
    }
    contenedor.innerHTML = productos.slice(0, 30).map(p => `
      <button type="button" class="w-full text-left py-2 px-1 hover:bg-bg flex justify-between items-center" data-agregar='${JSON.stringify(p).replace(/'/g, "&#39;")}'>
        <span>${escAttr(p.nombre)} <span class="text-ink/50">(${escAttr(p.presentacion || 'sin presentación')})</span></span>
        <span class="text-xs ${p.tieneHistorial ? 'text-ok' : 'text-warn'}">${p.tieneHistorial ? p.minPorPaquete + ' min/paq' : 'sin historial'}</span>
      </button>
    `).join('');
    contenedor.querySelectorAll('[data-agregar]').forEach(btn => btn.addEventListener('click', () => {
      agregarProducto(JSON.parse(btn.dataset.agregar));
    }));
  }

  function agregarProducto(p) {
    if (carrito.some(it => it.plu === p.plu)) return;
    carrito.push({
      plu: p.plu, nombre: p.nombre, presentacion: p.presentacion,
      minPorPaquete: p.tieneHistorial ? p.minPorPaquete : null,
      origenTiempo: p.tieneHistorial ? 'historial' : 'manual',
      kilos: 1, factorComplejidad: 1.00,
    });
    renderCarrito();
  }

  function quitarProducto(plu) {
    const idx = carrito.findIndex(it => it.plu === plu);
    if (idx >= 0) carrito.splice(idx, 1);
    renderCarrito();
  }

  function valorHora() { return Number(document.getElementById('valorHora').value) || 0; }

  // Mismo regex/criterio que pesoPresentacionKg en lib/productividad.js: la presentación es un
  // token limpio tipo "500G"/"1Kg", no el nombre completo del producto.
  function pesoPresentacionKg(presentacion) {
    const m = /^(\d+(?:[.,]\d+)?)\s*(KG|GR?|ML|L)$/i.exec(String(presentacion || '').trim());
    if (!m) return null;
    const v = parseFloat(m[1].replace(',', '.'));
    const u = m[2].toUpperCase();
    return (u === 'KG' || u === 'L') ? v : v / 1000;
  }

  // La cantidad que carga el usuario es en kilos (lo que le va a entregar al tercero), no en
  // paquetes — el paquete sale solo de kilos / peso de la presentación.
  function paquetesDe(it) {
    const peso = pesoPresentacionKg(it.presentacion);
    const kilos = Number(it.kilos) || 0;
    return peso ? kilos / peso : 0;
  }

  function costoItem(it) {
    const min = Number(it.minPorPaquete) || 0;
    const paq = paquetesDe(it);
    const factor = Number(it.factorComplejidad) || 0;
    // Mismo orden que calcularCostoItem en lib/fraccionado_externo.js: redondear el unitario
    // primero y derivar el total de ahí, para que el preview del carrito coincida siempre con
    // lo que termina guardado y en el PDF.
    const unitario = Math.round((valorHora() / 60) * min * factor);
    return { unitario, total: unitario * paq, paquetes: paq };
  }

  function renderCarrito() {
    const tbody = document.getElementById('carrito');
    document.getElementById('carritoVacio').classList.toggle('hidden', carrito.length > 0);
    document.getElementById('btnGenerar').disabled = carrito.length === 0;
    tbody.innerHTML = carrito.map((it, i) => {
      const { unitario, total, paquetes } = costoItem(it);
      return `
        <tr class="border-t border-borde">
          <td class="py-2 pr-2">${escAttr(it.nombre)}</td>
          <td class="py-2 pr-2">
            <input type="text" value="${escAttr(it.presentacion || '')}" placeholder="ej. 500G"
              class="border border-borde rounded px-1 py-0.5 w-20" data-campo="presentacion" data-i="${i}">
          </td>
          <td class="py-2 pr-2">
            <input type="number" step="0.01" min="0.001" value="${it.minPorPaquete ?? ''}" placeholder="manual"
              class="border border-borde rounded px-1 py-0.5 w-20 ${it.origenTiempo === 'manual' ? 'bg-amarillo/10' : ''}"
              data-campo="minPorPaquete" data-i="${i}">
          </td>
          <td class="py-2 pr-2 text-right"><input type="number" step="0.1" min="0.01" value="${it.kilos}" class="border border-borde rounded px-1 py-0.5 w-20 text-right" data-campo="kilos" data-i="${i}"></td>
          <td class="py-2 pr-2 text-right text-ink/60" data-paquetes="${i}">${paquetes ? paquetes.toFixed(1) : '—'}</td>
          <td class="py-2 pr-2 text-right"><input type="number" step="0.05" min="0.1" value="${it.factorComplejidad}" class="border border-borde rounded px-1 py-0.5 w-20 text-right" data-campo="factorComplejidad" data-i="${i}"></td>
          <td class="py-2 pr-2 text-right" data-costo-unitario="${i}">$${unitario}</td>
          <td class="py-2 pr-2 text-right font-medium" data-costo-total="${i}">$${total}</td>
          <td class="py-2 text-right"><button type="button" class="text-red-500 text-xs" data-quitar="${escAttr(it.plu)}">quitar</button></td>
        </tr>`;
    }).join('');
    tbody.querySelectorAll('[data-campo]').forEach(inp => inp.addEventListener('input', () => {
      const i = Number(inp.dataset.i);
      carrito[i][inp.dataset.campo] = inp.value;
      if (inp.dataset.campo === 'minPorPaquete') carrito[i].origenTiempo = 'manual';
      actualizarCostosFila(i);
    }));
    tbody.querySelectorAll('[data-quitar]').forEach(btn => btn.addEventListener('click', () => quitarProducto(btn.dataset.quitar)));
    actualizarTotalGeneral();
  }

  function actualizarCostosFila(i) {
    const { unitario, total, paquetes } = costoItem(carrito[i]);
    const tbody = document.getElementById('carrito');
    tbody.querySelector(`[data-paquetes="${i}"]`).textContent = paquetes ? paquetes.toFixed(1) : '—';
    tbody.querySelector(`[data-costo-unitario="${i}"]`).textContent = '$' + unitario;
    tbody.querySelector(`[data-costo-total="${i}"]`).textContent = '$' + total;
    actualizarTotalGeneral();
  }

  function actualizarTotalGeneral() {
    const totalGeneral = carrito.reduce((s, it) => s + costoItem(it).total, 0);
    document.getElementById('totalPedido').textContent = '$' + totalGeneral;
  }

  document.getElementById('valorHora').addEventListener('input', renderCarrito);

  document.getElementById('btnGenerar').addEventListener('click', generarPedido);
  async function generarPedido() {
    const tercero = document.getElementById('tercero').value.trim();
    if (!tercero) { await mostrarAviso('Falta el nombre del tercero'); return; }
    if (carrito.some(it => !Number(it.minPorPaquete) || Number(it.minPorPaquete) <= 0)) {
      await mostrarAviso('Hay productos sin minutos por paquete cargados'); return;
    }
    if (carrito.some(it => !paquetesDe(it))) {
      await mostrarAviso('Hay productos sin kilos o con una presentación inválida (ej. "500G", "1Kg")'); return;
    }
    const items = carrito.map(it => ({
      plu: it.plu, nombre: it.nombre, presentacion: it.presentacion,
      minPorPaquete: Number(it.minPorPaquete), origenTiempo: it.origenTiempo,
      kilos: Number(it.kilos), paquetes: paquetesDe(it), factorComplejidad: Number(it.factorComplejidad),
    }));
    let r, data;
    try {
      r = await fetch('/api/fraccionado-externo/pedidos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tercero, valorHora: valorHora(), items }),
      });
      data = await r.json();
    } catch (e) {
      await mostrarAviso('No se pudo conectar con el servidor');
      return;
    }
    if (!r.ok) { await mostrarAviso(data.error || 'No se pudo generar el pedido'); return; }
    imprimirPedido(data.pedido);
    carrito.length = 0;
    document.getElementById('tercero').value = '';
    renderCarrito();
  }

  function imprimirPedido(pedido) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    doc.setFont('helvetica', 'bold').setFontSize(12).text('Pedido de fraccionado externo', 14, 18);
    doc.setFont('helvetica', 'normal').setFontSize(10);
    doc.text(`Pedido ${pedido.numero} — ${pedido.fecha}`, 14, 26);
    doc.text(`Tercero: ${pedido.tercero}`, 14, 32);
    doc.autoTable({
      startY: 40,
      head: [['Producto', 'Presentación', 'Kilos', 'Paquetes', 'Costo unit.', 'Costo total']],
      body: pedido.items.map(it => [
        it.nombre, it.presentacion, it.kilos ?? '', it.paquetes,
        '$' + it.costoUnitario, '$' + it.costoTotal,
      ]),
      foot: [['', '', '', 'Total', '$' + pedido.total]],
      styles: { fontSize: 9 },
    });
    doc.save(`pedido-fraccionado-${pedido.numero}.pdf`);
  }

  async function cargarPedidos() {
    let pedidos;
    try {
      const r = await fetch('/api/fraccionado-externo/pedidos');
      const data = await r.json();
      if (!r.ok) { await mostrarAviso(data.error || 'No se pudieron cargar los pedidos'); return; }
      // Un pedido anulado desaparece de la lista — el registro sigue existiendo del lado del
      // servidor (con su historial), pero no tiene sentido seguir mostrándolo acá.
      pedidos = data.pedidos.filter(p => p.estado !== 'ANULADO');
    } catch (e) {
      await mostrarAviso('No se pudo conectar con el servidor');
      return;
    }
    document.getElementById('listaPedidos').innerHTML = pedidos.slice().reverse().map(p => `
      <tr class="border-t border-borde">
        <td class="py-2 pr-2">${escAttr(p.numero)}</td>
        <td class="py-2 pr-2">${escAttr(p.fecha)}</td>
        <td class="py-2 pr-2">${escAttr(p.tercero)}</td>
        <td class="py-2 pr-2 text-right">$${p.total}</td>
        <td class="py-2 pr-2">${escAttr(p.estado)}</td>
        <td class="py-2 text-right space-x-2">
          <button type="button" class="text-xs text-ink/60" data-reimprimir="${escAttr(p.numero)}">PDF</button>
          ${p.estado === 'PENDIENTE' ? `<button type="button" class="text-xs text-red-500" data-anular="${escAttr(p.numero)}">anular</button>` : ''}
        </td>
      </tr>`).join('');
    document.querySelectorAll('[data-reimprimir]').forEach(btn => btn.addEventListener('click', () => {
      imprimirPedido(pedidos.find(p => p.numero === btn.dataset.reimprimir));
    }));
    document.querySelectorAll('[data-anular]').forEach(btn => btn.addEventListener('click', async () => {
      if (!(await confirmarAccion('¿Anular el pedido ' + btn.dataset.anular + '?'))) return;
      try {
        const r = await fetch(`/api/fraccionado-externo/pedidos/${btn.dataset.anular}/anular`, { method: 'POST' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { await mostrarAviso(data.error || 'No se pudo anular el pedido'); return; }
      } catch (e) {
        await mostrarAviso('No se pudo conectar con el servidor');
        return;
      }
      cargarPedidos();
    }));
  }

  renderCarrito();
</script>
</body>
</html>
