<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraccionado Externo — Apidelta</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.js"></script>
<style>
  .tab-btn.active { border-color: #8b9083; color: #3f4238; font-weight: 600; }
  .tab-btn { border-bottom: 2px solid transparent; color: #8b9083; }
</style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">
<div class="max-w-5xl mx-auto p-4 sm:p-6">

  <h1 class="text-xl font-bold mb-1">Fraccionado Externo</h1>
  <p class="text-sm text-stone-500 mb-4">Armá pedidos de fraccionado para tercerizar, con el costo de mano de obra calculado desde el historial real.</p>

  <div class="flex gap-4 border-b border-stone-200 mb-4">
    <button class="tab-btn active py-2 px-1" data-tab="armado">Armar pedido</button>
    <button class="tab-btn py-2 px-1" data-tab="guardados">Pedidos guardados</button>
  </div>

  <section id="tab-armado">
    <div class="bg-white border border-stone-200 rounded-lg p-4 mb-4 flex flex-wrap gap-4 items-end">
      <div>
        <label class="block text-xs text-stone-500 mb-1">Valor hora ($)</label>
        <input id="valorHora" type="number" step="1" min="1" value="8100" class="border border-stone-300 rounded px-2 py-1 w-32">
      </div>
      <div>
        <label class="block text-xs text-stone-500 mb-1">Tercero</label>
        <input id="tercero" type="text" placeholder="Nombre del fraccionador" class="border border-stone-300 rounded px-2 py-1 w-64">
      </div>
    </div>

    <div class="bg-white border border-stone-200 rounded-lg p-4 mb-4">
      <label class="block text-xs text-stone-500 mb-1">Buscar producto</label>
      <input id="buscarProducto" type="text" placeholder="Escribí para buscar..." class="border border-stone-300 rounded px-2 py-1 w-full mb-2">
      <div id="resultados" class="max-h-56 overflow-y-auto divide-y divide-stone-100 text-sm"></div>
    </div>

    <div class="bg-white border border-stone-200 rounded-lg p-4 mb-4 overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-stone-500 uppercase">
            <th class="py-2 pr-2">Producto</th>
            <th class="py-2 pr-2">Min./paquete</th>
            <th class="py-2 pr-2 text-right">Paquetes</th>
            <th class="py-2 pr-2 text-right">Factor</th>
            <th class="py-2 pr-2 text-right">Costo unit.</th>
            <th class="py-2 pr-2 text-right">Costo total</th>
            <th class="py-2"></th>
          </tr>
        </thead>
        <tbody id="carrito"></tbody>
      </table>
      <p id="carritoVacio" class="text-sm text-stone-400 py-4">Todavía no agregaste productos.</p>
      <div class="flex justify-between items-center mt-3 pt-3 border-t border-stone-200">
        <span class="font-semibold">Total: <span id="totalPedido">$0</span></span>
        <button id="btnGenerar" class="bg-stone-800 text-white text-sm rounded px-4 py-2 disabled:opacity-40" disabled>Generar pedido</button>
      </div>
    </div>
  </section>

  <section id="tab-guardados" class="hidden">
    <div class="bg-white border border-stone-200 rounded-lg p-4 overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-stone-500 uppercase">
            <th class="py-2 pr-2">Número</th>
            <th class="py-2 pr-2">Fecha</th>
            <th class="py-2 pr-2">Tercero</th>
            <th class="py-2 pr-2 text-right">Total</th>
            <th class="py-2 pr-2">Estado</th>
            <th class="py-2"></th>
          </tr>
        </thead>
        <tbody id="listaPedidos"></tbody>
      </table>
    </div>
  </section>

</div>
<script>
  const carrito = []; // { plu, nombre, presentacion, minPorPaquete, origenTiempo, paquetes, factorComplejidad }

  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-armado').classList.toggle('hidden', btn.dataset.tab !== 'armado');
    document.getElementById('tab-guardados').classList.toggle('hidden', btn.dataset.tab !== 'guardados');
    if (btn.dataset.tab === 'guardados') cargarPedidos();
  }));

  const buscarInput = document.getElementById('buscarProducto');
  let buscarTimeout = null;
  buscarInput.addEventListener('input', () => {
    clearTimeout(buscarTimeout);
    buscarTimeout = setTimeout(buscarProductos, 250);
  });

  async function buscarProductos() {
    const q = buscarInput.value.trim();
    const contenedor = document.getElementById('resultados');
    if (!q) { contenedor.innerHTML = ''; return; }
    const r = await fetch('/api/fraccionado-externo/productos?buscar=' + encodeURIComponent(q));
    const { productos } = await r.json();
    contenedor.innerHTML = productos.slice(0, 30).map(p => `
      <button type="button" class="w-full text-left py-2 px-1 hover:bg-stone-50 flex justify-between items-center" data-agregar='${JSON.stringify(p).replace(/'/g, "&#39;")}'>
        <span>${p.nombre} <span class="text-stone-400">(${p.presentacion || 'sin presentación'})</span></span>
        <span class="text-xs ${p.tieneHistorial ? 'text-emerald-600' : 'text-amber-600'}">${p.tieneHistorial ? p.minPorPaquete + ' min/paq' : 'sin historial'}</span>
      </button>
    `).join('');
    contenedor.querySelectorAll('[data-agregar]').forEach(btn => btn.addEventListener('click', () => {
      agregarProducto(JSON.parse(btn.dataset.agregar));
    }));
  }

  function agregarProducto(p) {
    if (carrito.some(it => it.plu === p.plu)) return;
    carrito.push({
      plu: p.plu, nombre: p.nombre, presentacion: p.presentacion,
      minPorPaquete: p.tieneHistorial ? p.minPorPaquete : null,
      origenTiempo: p.tieneHistorial ? 'historial' : 'manual',
      paquetes: 1, factorComplejidad: 1.00,
    });
    renderCarrito();
  }

  function quitarProducto(plu) {
    const idx = carrito.findIndex(it => it.plu === plu);
    if (idx >= 0) carrito.splice(idx, 1);
    renderCarrito();
  }

  function valorHora() { return Number(document.getElementById('valorHora').value) || 0; }

  function costoItem(it) {
    const min = Number(it.minPorPaquete) || 0;
    const paq = Number(it.paquetes) || 0;
    const factor = Number(it.factorComplejidad) || 0;
    const unitario = (valorHora() / 60) * min * factor;
    return { unitario, total: unitario * paq };
  }

  function renderCarrito() {
    const tbody = document.getElementById('carrito');
    document.getElementById('carritoVacio').classList.toggle('hidden', carrito.length > 0);
    document.getElementById('btnGenerar').disabled = carrito.length === 0;
    tbody.innerHTML = carrito.map((it, i) => {
      const { unitario, total } = costoItem(it);
      return `
        <tr class="border-t border-stone-100">
          <td class="py-2 pr-2">${it.nombre}<div class="text-xs text-stone-400">${it.presentacion || ''}</div></td>
          <td class="py-2 pr-2">
            <input type="number" step="0.01" min="0.001" value="${it.minPorPaquete ?? ''}" placeholder="manual"
              class="border border-stone-300 rounded px-1 py-0.5 w-20 ${it.origenTiempo === 'manual' ? 'bg-amber-50' : ''}"
              data-campo="minPorPaquete" data-i="${i}">
          </td>
          <td class="py-2 pr-2 text-right"><input type="number" step="1" min="1" value="${it.paquetes}" class="border border-stone-300 rounded px-1 py-0.5 w-20 text-right" data-campo="paquetes" data-i="${i}"></td>
          <td class="py-2 pr-2 text-right"><input type="number" step="0.05" min="0.1" value="${it.factorComplejidad}" class="border border-stone-300 rounded px-1 py-0.5 w-20 text-right" data-campo="factorComplejidad" data-i="${i}"></td>
          <td class="py-2 pr-2 text-right">$${Math.round(unitario)}</td>
          <td class="py-2 pr-2 text-right font-medium">$${Math.round(total)}</td>
          <td class="py-2 text-right"><button type="button" class="text-red-500 text-xs" data-quitar="${it.plu}">quitar</button></td>
        </tr>`;
    }).join('');
    tbody.querySelectorAll('[data-campo]').forEach(inp => inp.addEventListener('input', () => {
      carrito[Number(inp.dataset.i)][inp.dataset.campo] = inp.value;
      if (inp.dataset.campo === 'minPorPaquete') carrito[Number(inp.dataset.i)].origenTiempo = 'manual';
      renderCarrito();
    }));
    tbody.querySelectorAll('[data-quitar]').forEach(btn => btn.addEventListener('click', () => quitarProducto(btn.dataset.quitar)));
    const totalGeneral = carrito.reduce((s, it) => s + costoItem(it).total, 0);
    document.getElementById('totalPedido').textContent = '$' + Math.round(totalGeneral);
  }

  document.getElementById('valorHora').addEventListener('input', renderCarrito);

  document.getElementById('btnGenerar').addEventListener('click', generarPedido);
  async function generarPedido() {
    const tercero = document.getElementById('tercero').value.trim();
    if (!tercero) { alert('Falta el nombre del tercero'); return; }
    if (carrito.some(it => !Number(it.minPorPaquete) || Number(it.minPorPaquete) <= 0)) {
      alert('Hay productos sin minutos por paquete cargados'); return;
    }
    const items = carrito.map(it => ({
      plu: it.plu, nombre: it.nombre, presentacion: it.presentacion,
      minPorPaquete: Number(it.minPorPaquete), origenTiempo: it.origenTiempo,
      paquetes: Number(it.paquetes), factorComplejidad: Number(it.factorComplejidad),
    }));
    const r = await fetch('/api/fraccionado-externo/pedidos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tercero, valorHora: valorHora(), items }),
    });
    const data = await r.json();
    if (!r.ok) { alert(data.error || 'No se pudo generar el pedido'); return; }
    imprimirPedido(data.pedido);
    carrito.length = 0;
    document.getElementById('tercero').value = '';
    renderCarrito();
  }

  function imprimirPedido(pedido) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    doc.setFont('helvetica', 'bold').setFontSize(12).text('Pedido de fraccionado externo', 14, 18);
    doc.setFont('helvetica', 'normal').setFontSize(10);
    doc.text(`Pedido ${pedido.numero} — ${pedido.fecha}`, 14, 26);
    doc.text(`Tercero: ${pedido.tercero}`, 14, 32);
    doc.text(`Valor hora: $${pedido.valorHora}`, 14, 38);
    doc.autoTable({
      startY: 44,
      head: [['Producto', 'Presentación', 'Min/paq', 'Paquetes', 'Factor', 'Costo unit.', 'Costo total']],
      body: pedido.items.map(it => [
        it.nombre, it.presentacion, it.minPorPaquete, it.paquetes, it.factorComplejidad,
        '$' + it.costoUnitario, '$' + it.costoTotal,
      ]),
      foot: [['', '', '', '', '', 'Total', '$' + pedido.total]],
      styles: { fontSize: 9 },
    });
    doc.save(`pedido-fraccionado-${pedido.numero}.pdf`);
  }

  async function cargarPedidos() {
    const r = await fetch('/api/fraccionado-externo/pedidos');
    const { pedidos } = await r.json();
    document.getElementById('listaPedidos').innerHTML = pedidos.slice().reverse().map(p => `
      <tr class="border-t border-stone-100">
        <td class="py-2 pr-2">${p.numero}</td>
        <td class="py-2 pr-2">${p.fecha}</td>
        <td class="py-2 pr-2">${p.tercero}</td>
        <td class="py-2 pr-2 text-right">$${p.total}</td>
        <td class="py-2 pr-2">${p.estado}</td>
        <td class="py-2 text-right space-x-2">
          <button type="button" class="text-xs text-stone-600" data-reimprimir="${p.numero}">PDF</button>
          ${p.estado === 'PENDIENTE' ? `<button type="button" class="text-xs text-red-500" data-anular="${p.numero}">anular</button>` : ''}
        </td>
      </tr>`).join('');
    document.querySelectorAll('[data-reimprimir]').forEach(btn => btn.addEventListener('click', () => {
      imprimirPedido(pedidos.find(p => p.numero === btn.dataset.reimprimir));
    }));
    document.querySelectorAll('[data-anular]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Anular el pedido ' + btn.dataset.anular + '?')) return;
      await fetch(`/api/fraccionado-externo/pedidos/${btn.dataset.anular}/anular`, { method: 'POST' });
      cargarPedidos();
    }));
  }

  renderCarrito();
</script>
</body>
</html>
