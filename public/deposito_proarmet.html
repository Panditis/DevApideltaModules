<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depósito Proarmet · Apidelta</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/css/apidelta-theme.js"></script>
<link rel="stylesheet" href="/css/apidelta-theme.css">
<style>
.hidden{display:none!important}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl{border:1px solid rgba(26,28,24,.16);border-radius:8px;padding:7px 10px;font-size:14px;color:#242423;background:#fff;transition:border-color 140ms ease,box-shadow 140ms ease}
.ctl:hover{border-color:rgba(26,28,24,.28)}
.ctl:focus{outline:none;border-color:#405936;box-shadow:0 0 0 3px rgba(64,89,54,.16)}
.ctl[aria-invalid=true]{border-color:#a4262c;box-shadow:0 0 0 3px rgba(164,38,44,.12)}
.ctl:disabled{background:#f4f5f1;color:#5c5f52;cursor:not-allowed}
.lbl{display:block;font-size:12px;font-weight:600;color:#5c5f52;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600;border:1px solid rgba(26,28,24,.16);background:#fff;color:#242423;cursor:pointer;transition:background-color 140ms ease}
.btn:hover{background:#f5f8f1}
.btn-primario{background:#405936;border-color:#405936;color:#fff}
.btn-primario:hover{background:#4f6e42}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:none;color:#5c5f52;cursor:pointer}
.btn-ico:hover{background:rgba(26,28,24,.06);color:#242423}
:where(button,a,select,input,textarea):focus-visible{outline:2px solid #405936;outline-offset:2px}
.buscar{position:relative}
.buscar .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#5c5f52;pointer-events:none}
.buscar input{padding-left:32px;width:300px}
#panel-ingreso .buscar input,#panel-devolver .buscar input{width:100%;max-width:520px}
.res{list-style:none;margin:6px 0 0;padding:4px;border:1px solid rgba(26,28,24,.16);border-radius:10px;background:#fff;max-height:340px;overflow-y:auto;box-shadow:0 12px 28px -12px rgba(26,28,24,.25)}
.res-it{display:flex;align-items:center;gap:14px;padding:7px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.res-it.act{background:#eef3e8;box-shadow:inset 3px 0 0 #405936}
.res-it[aria-disabled=true]{color:#5c5f52;cursor:default}
.res-it .num{width:70px;text-align:right;font-variant-numeric:tabular-nums;color:#5c5f52}
.res-it .grow{flex:1;min-width:0}
.res-it .st{font-size:12px;color:#5c5f52;white-space:nowrap;font-variant-numeric:tabular-nums}
.res-it .st b{color:#242423}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{color:#5c5f52;font-weight:600;font-size:12px;text-align:left;padding:10px 12px;border-bottom:1px solid rgba(26,28,24,.09);background:#fafbf8;text-transform:uppercase}
.tabla td{padding:8px 12px;border-bottom:1px solid rgba(26,28,24,.09);vertical-align:middle}
.tabla tbody tr:hover{background:#f5f8f1}
.tabla tbody tr.sel{background:#eef3e8}
.tabla td.num,.tabla th.num{text-align:right;font-variant-numeric:tabular-nums}
.tabla input[type=checkbox]{width:16px;height:16px;accent-color:#405936}
.qty{width:96px;text-align:right;font-variant-numeric:tabular-nums;padding:5px 8px}
.vacio{display:flex;flex-direction:column;align-items:center;gap:6px;padding:48px 16px;color:#5c5f52;text-align:center;font-size:14px}
.vacio b{color:#242423;font-size:15px}
.error{display:flex;gap:10px;align-items:flex-start;background:#fdf3f4;color:#a4262c;border:1px solid #f3cdd0;padding:10px 14px;border-radius:10px;font-size:14px}
.sk{height:36px;margin:8px 12px;border-radius:8px;background:linear-gradient(90deg,#fff 0%,#f3f5ef 50%,#fff 100%);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid rgba(26,28,24,.09)}
.tab{font-family:inherit;font-size:14px;font-weight:700;color:#5c5f52;background:none;border:none;border-bottom:3px solid transparent;padding:9px 16px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:#242423}
.tab[aria-selected=true]{color:#242423;border-bottom-color:#405936}
.scroll-tabla{overflow-y:auto;max-height:52vh;border:1px solid rgba(26,28,24,.09);border-radius:10px}
.scroll-tabla thead th{position:sticky;top:0;z-index:1}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef1ea;color:#5c5f52}
.b-ing{background:#e4efdc;color:#2f4a26}.b-sal{background:#fff3c4;color:#6b5400}
.b-rev{background:#fdf3f4;color:#a4262c;border:1px solid #f3cdd0}.b-fail{background:#a4262c;color:#fff}
.tabla tr.hist{cursor:pointer}
.tabla tr.det td{background:#fafbf8;padding:6px 12px 12px 44px}
#toasts{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:440px}
.tst{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;background:#242423;color:#fff;font-size:14px;line-height:1.35;box-shadow:0 24px 48px -12px rgba(26,28,24,.28);animation:toast 220ms ease}
.tst-ok{box-shadow:0 24px 48px -12px rgba(26,28,24,.28),inset 4px 0 0 #FFCC00}
.tst-err{background:#7a1d22}
@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn-rem{padding:3px 10px;font-size:13px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#remito{display:none}
@page{size:A4 portrait;margin:14mm}
@media print{
body.imprimiendo{background:#fff!important}
body.imprimiendo>*:not(#remito){display:none!important}
body.imprimiendo #remito{display:block;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11pt}
#remito h1{font-size:16pt;text-align:center;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid #000;letter-spacing:.5px}
#remito table{width:100%;border-collapse:collapse}
.rm-datos{margin-bottom:14px}
.rm-datos th{text-align:left;width:19%;font-size:9pt;text-transform:uppercase;color:#333;padding:4px 6px;border:1px solid #888;background:#f0f0f0}
.rm-datos td{padding:4px 6px;border:1px solid #888}
.rm-items thead{display:table-header-group}
.rm-items th{text-align:left;font-size:9pt;text-transform:uppercase;padding:5px 6px;border:1px solid #000;background:#e8e8e8}
.rm-items td{padding:5px 6px;border:1px solid #888}
.rm-items tr{break-inside:avoid;page-break-inside:avoid}
#remito .num{text-align:right}
.rm-total{text-align:right;font-weight:700;margin:8px 0 0}
.rm-cierre{break-inside:avoid;page-break-inside:avoid}
.rm-firmas{display:grid;grid-template-columns:1fr 1fr;gap:16mm;margin-top:14mm}
.rm-firma{flex:1}
.rm-firma h3{margin:0 0 4px;font-size:11pt;text-transform:uppercase}
.rm-caja{height:38mm;border:1.5px solid #000;position:relative}
.rm-caja span{position:absolute;left:6px;top:4px;font-size:8pt;color:#555}
.rm-linea{border-bottom:1px solid #000;height:9mm;margin-top:3mm;font-size:10pt;display:flex;align-items:flex-end;gap:6px}
.rm-linea span{font-size:8pt;color:#555;text-transform:uppercase}
}
@media (prefers-reduced-motion:reduce){.tst,.sk{animation:none}}
</style>
</head>
<body class="font-body text-ink">

<header class="acrylic filo-amarillo sticky top-0 z-20 shadow-fluent">
  <div class="max-w-[1200px] mx-auto px-6 py-3 flex items-center gap-3">
    <h1 id="titulo" class="font-disp text-2xl font-bold">DEPÓSITO PROARMET</h1>
    <span id="bajada" class="text-sm"></span>
    <div class="ml-auto flex items-center gap-4">
      <button id="btnRecargar" type="button" class="px-3 py-1.5 rounded-lg border text-sm">Recargar</button>
      <a href="/" class="text-sm">← Inicio</a>
    </div>
  </div>
</header>

<main class="max-w-[1200px] mx-auto px-6 py-5">
  <div id="aviso" class="hidden mb-4" role="alert"></div>

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div class="flex items-center gap-2">
      <label class="text-sm font-semibold text-gris" for="selControlado">Depósito a controlar</label>
      <select id="selControlado" class="ctl" disabled><option value="">Cargando…</option></select>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Funciones del depósito">
    <button class="tab" type="button" role="tab" id="tab-stock" data-tab="stock" aria-controls="panel-stock" aria-selected="true">Stock</button>
    <button class="tab" type="button" role="tab" id="tab-ingreso" data-tab="ingreso" aria-controls="panel-ingreso" aria-selected="false" tabindex="-1">Ingresar mercadería</button>
    <button class="tab" type="button" role="tab" id="tab-devolver" data-tab="devolver" aria-controls="panel-devolver" aria-selected="false" tabindex="-1">Devolver a central</button>
    <button class="tab" type="button" role="tab" id="tab-historial" data-tab="historial" aria-controls="panel-historial" aria-selected="false" tabindex="-1">Historial</button>
  </div>

  <section id="panel-stock" role="tabpanel" aria-labelledby="tab-stock">
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <div class="buscar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="flBuscar" type="search" class="ctl" placeholder="Buscar por código o descripción" aria-label="Buscar en el stock del depósito">
      </div>
      <span id="conteo" class="text-sm text-gris tabular-nums"></span>
    </div>
    <div class="rounded-xl border border-borde shadow-fluent bg-card overflow-hidden">
      <table class="tabla">
        <thead><tr>
          <th scope="col" class="num" style="width:110px">Código</th>
          <th scope="col">Descripción</th>
          <th scope="col" class="num" style="width:130px">Stock</th>
        </tr></thead>
        <tbody id="cuerpo"></tbody>
      </table>
    </div>
  </section>

  <section id="panel-ingreso" class="hidden" role="tabpanel" aria-labelledby="tab-ingreso"></section>
  <section id="panel-devolver" class="hidden" role="tabpanel" aria-labelledby="tab-devolver"></section>

  <section id="panel-historial" class="hidden" role="tabpanel" aria-labelledby="tab-historial">
    <div class="flex items-center gap-3 mb-3">
      <button id="btnHist" type="button" class="btn">Recargar historial</button>
      <span id="histConteo" class="text-sm text-gris tabular-nums"></span>
    </div>
    <div class="rounded-xl border border-borde shadow-fluent bg-card overflow-hidden">
      <table class="tabla">
        <thead><tr>
          <th scope="col" style="width:150px">Fecha</th><th scope="col" style="width:90px">Tipo</th>
          <th scope="col" class="num" style="width:90px">Nº mov.</th><th scope="col">Origen → Destino</th>
          <th scope="col" style="width:110px">Usuario</th><th scope="col">Descripción</th><th scope="col" style="width:110px">Estado</th><th scope="col" style="width:90px"><span class="sr-only">Remito</span></th>
        </tr></thead>
        <tbody id="histCuerpo"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="remito" aria-hidden="true"></div>

<div id="toasts" role="status" aria-live="polite"></div>

<script src="/js/deposito_proarmet.js"></script>
<script src="/js/deposito_proarmet_mov.js"></script>
</body>
</html>
