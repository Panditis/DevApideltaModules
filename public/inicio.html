<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apidelta — Centro de operaciones</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/css/apidelta-theme.js"></script>
<link rel="stylesheet" href="/css/apidelta-theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   APIDELTA · Hub / Centro de operaciones
   Paleta: theme compartido (apidelta-theme.js/.css) — verde/amarillo + tokens.
   Los acentos por módulo (ESTILOS, más abajo en el <script>) quedan con su
   propio hex: son la identidad visual de cada tarjeta, no "paleta vieja".
   ═══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-size:14px;line-height:1.55}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}

/* App bar: el fondo/verde+amarillo vive en header.acrylic (theme compartido). Acá solo layout. */
.app-bar-logo{height:34px;width:34px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.app-bar-title{font-size:1.02rem;font-weight:700;letter-spacing:.01em;line-height:1.1}
.app-bar-sub{font-size:.72rem;opacity:.72;font-weight:500}
.dev-offset{margin-top:26px}
@media (max-width:640px){
  #dev-banner{font-size:.66rem;letter-spacing:.04em;padding:4px 8px}
  .dev-offset{margin-top:42px}
}

/* Chip de estado del servidor */
.status-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.72rem;font-weight:600;letter-spacing:.02em}
.status-dot{width:8px;height:8px;border-radius:50%;background:#cbd08a;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.status-dot.ok{background:#9bd24a;box-shadow:0 0 0 3px rgba(155,210,74,.18)}
.status-dot.err{background:#ff7a5c;box-shadow:0 0 0 3px rgba(255,122,92,.18)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
.status-dot.loading{animation:blip 1.1s ease-in-out infinite}

/* Tarjeta de módulo */
.tile{
  position:relative;display:flex;flex-direction:column;gap:14px;
  background:#fff;border:1px solid rgba(26,28,24,.16);border-radius:18px;
  padding:22px;text-decoration:none;color:inherit;overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s ease,border-color .18s ease;
}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,#405936);opacity:0;transition:opacity .18s ease}
.tile:hover{transform:translateY(-4px);box-shadow:0 1.6px 3.6px rgba(26,28,24,.13),0 0.3px 0.9px rgba(26,28,24,.1);border-color:#405936}
.tile:hover::before{opacity:1}
.tile:focus-visible{outline:none;border-color:#FFCC00;box-shadow:0 0 0 3px rgba(255,204,0,.35)}
.tile-icon{
  width:52px;height:52px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;
  background:var(--accent-soft,#e7e8db);color:var(--accent-ink,#2f3122);
}
.tile-icon svg{width:26px;height:26px}
.tile-title{font-size:1.12rem;font-weight:700;color:#242423;line-height:1.2}
.tile-desc{font-size:.86rem;color:#5c5f52;line-height:1.5}
.tile-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.tile-route{font-family:ui-monospace,monospace;font-size:.74rem;font-weight:600;color:#8a8c78;background:#f4f4ee;border:1px solid #e8e8e0;padding:3px 8px;border-radius:7px}
.tile-arrow{color:#b9bba2;transition:transform .18s ease,color .18s ease}
/* Chips de submódulos: un módulo contenedor (ej. RRHH) muestra qué hay adentro.
   Son spans, no links: la tarjeta entera ya es un <a> y no se pueden anidar. */
.tile-subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tile-sub{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:600;color:#5b5e4d;background:var(--accent-soft,#f4f4ee);border:1px solid rgba(0,0,0,.06);padding:3px 9px;border-radius:999px}
.tile-sub svg{width:12px;height:12px;opacity:.75}
.tile:hover .tile-arrow{transform:translateX(3px);color:#405936}

/* Grupo de módulos (ej. Precios): una tarjeta con varios accesos adentro. */
.tile-group{cursor:default}
.tile-group:hover{transform:none;border-color:rgba(26,28,24,.16)}
.group-links{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.group-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid rgba(26,28,24,.12);background:var(--accent-soft,#f4f4ee);color:var(--accent-ink,#242423);text-decoration:none;font-size:.88rem;font-weight:600;transition:border-color .15s ease,background .15s ease}
.group-link:hover{border-color:var(--accent,#405936);background:#fff}
.group-link:focus-visible{outline:none;border-color:#FFCC00;box-shadow:0 0 0 3px rgba(255,204,0,.35)}
.group-link svg{width:16px;height:16px;flex-shrink:0}
.group-link .tile-arrow{margin-left:auto;color:inherit;opacity:.5}

/* Tarjeta "próximamente" — no interactiva */
.tile-soon{
  border-style:dashed;border-color:#d3d3cb;background:#fbfbf8;cursor:default;
  box-shadow:none;min-height:170px;
}
.tile-soon:hover{transform:none;box-shadow:none;border-color:#cfcfc6}
.tile-soon .tile-icon{background:#eeeee7;color:#9a9c86}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.badge-live{background:#e3f0d2;color:#3f5e1f}
.badge-soon{background:#f0f0ea;color:#8a8c78}
.badge-lock{background:#f0e6d0;color:#7a5a12}
.badge-public{background:#d5e8f5;color:#1c4b6e}
.tile-locked{opacity:.62;cursor:not-allowed;background:#fbfbf8;border-style:dashed;border-color:#d8d3c4}
.tile-locked:hover{transform:none;box-shadow:none;border-color:#d8d3c4}
.tile-locked:hover::before{opacity:0}
.tile-locked .tile-icon{filter:grayscale(.4)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
/* Diálogo de contraseña: el preflight de Tailwind pisa el margin:auto del navegador,
   así que el centrado se fija acá en vez de confiar en el estilo por defecto. */
#dlg-password{position:fixed;inset:0;margin:auto;border:none;border-radius:16px;padding:0;
  width:92vw;max-width:380px;height:fit-content;max-height:90vh;
  box-shadow:0 20px 50px rgba(0,0,0,.25)}
#dlg-password::backdrop{background:rgba(23,23,18,.45)}
</style>
</head>
<body class="font-body text-ink">

<!-- Banner de ambiente de pruebas (consistente con el resto del sistema dev) -->


<header class="acrylic sticky top-0 z-20 border-b border-borde shadow-fluent">
  <div class="max-w-6xl mx-auto px-5 sm:px-8 py-3 flex items-center gap-3 flex-wrap">
  <svg class="app-bar-logo" viewBox="0 0 32 32" role="img" aria-label="Apidelta">
    <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="#405936"/>
    <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="none" stroke="#FFCC00" stroke-width="1.4" opacity=".9"/>
    <text x="16" y="23" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="18" text-anchor="middle" fill="#FFCC00">A</text>
  </svg>
  <div>
    <div class="app-bar-title text-white">Apidelta</div>
    <div class="app-bar-sub text-white/75">Centro de operaciones</div>
  </div>
  <div class="ml-auto flex items-center gap-3">
    <span id="reloj" class="hidden sm:block text-xs font-mono text-white/80" aria-hidden="true"></span>
    <span class="status-chip" role="status" aria-live="polite">
      <span id="status-dot" class="status-dot loading"></span>
      <span id="status-text">Conectando…</span>
    </span>
    <a id="admin-link" href="/admin" class="status-chip hidden" style="text-decoration:none" title="Centro de control">
      <i data-lucide="shield" style="width:14px;height:14px"></i><span class="hidden sm:inline">Centro de control</span>
    </a>
    <a id="login-link" href="/login" class="status-chip hidden" style="text-decoration:none" title="Iniciar sesión">
      <i data-lucide="log-in" style="width:14px;height:14px"></i><span class="hidden sm:inline">Iniciar sesión</span>
    </a>
    <span id="user-chip" class="status-chip hidden" title="Usuario conectado">
      <i data-lucide="user" style="width:14px;height:14px"></i><span id="user-name">…</span>
    </span>
    <button id="btn-password" type="button" class="status-chip hidden" style="border:none;cursor:pointer;font:inherit" title="Cambiar mi contraseña">
      <i data-lucide="key-round" style="width:14px;height:14px"></i><span class="hidden sm:inline">Contraseña</span>
    </button>
    <button id="btn-logout" type="button" class="status-chip hidden" style="border:none;cursor:pointer;font:inherit" title="Cerrar sesión">
      <i data-lucide="log-out" style="width:14px;height:14px"></i><span class="hidden sm:inline">Salir</span>
    </button>
  </div>
  </div>
</header>

<!-- Cambio de contraseña del propio usuario. <dialog> nativo: no hace falta librería de modales. -->
<dialog id="dlg-password">
  <form id="form-password" method="dialog" style="padding:22px 24px 20px;display:flex;flex-direction:column;gap:12px">
    <h2 class="font-disp" style="font-size:1.05rem;font-weight:800;color:#242423;margin:0">Cambiar mi contraseña</h2>
    <label style="font-size:.8rem;color:#5c5f52">Contraseña actual
      <input id="pw-actual" type="password" required autocomplete="current-password"
             style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid rgba(26,28,24,.16);border-radius:9px;font:inherit">
    </label>
    <label style="font-size:.8rem;color:#5c5f52">Nueva contraseña (mínimo 8 caracteres)
      <input id="pw-nueva" type="password" required minlength="8" autocomplete="new-password"
             style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid rgba(26,28,24,.16);border-radius:9px;font:inherit">
    </label>
    <label style="font-size:.8rem;color:#5c5f52">Repetir la nueva
      <input id="pw-repetir" type="password" required minlength="8" autocomplete="new-password"
             style="width:100%;margin-top:4px;padding:8px 10px;border:1px solid rgba(26,28,24,.16);border-radius:9px;font:inherit">
    </label>
    <p id="pw-msg" role="alert" style="margin:0;font-size:.8rem;min-height:1em"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:2px">
      <button type="button" id="pw-cancelar" class="status-chip" style="border:none;cursor:pointer;font:inherit">Cancelar</button>
      <button type="submit" id="pw-guardar" class="status-chip" style="border:none;cursor:pointer;font:inherit;background:#405936;color:#FFCC00">Guardar</button>
    </div>
  </form>
</dialog>

<main class="max-w-6xl mx-auto px-5 sm:px-8 py-8 sm:py-12">

  <div class="fade-up mb-8 sm:mb-10">
    <h1 class="font-disp text-2xl sm:text-3xl font-extrabold text-ink tracking-tight">
      Seleccioná un módulo
    </h1>
    <p class="mt-1.5 text-gris text-sm sm:text-[15px] max-w-2xl">
      Acceso directo a los sistemas de Apidelta. Pedidos, planificación, producción y todo lo que vayamos sumando.
    </p>
  </div>

  <section aria-label="Módulos disponibles">
    <ul id="grid" role="list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></ul>
  </section>

  <footer class="mt-12 pt-6 border-t border-borde flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs text-gris">
    <span>Apidelta · Subsistema local · <span id="footer-host">dev</span></span>
    <span class="font-mono">v1.0</span>
  </footer>
</main>

<script>
// ── Estilos de módulo (color + descripción). El QUÉ mostrar (título, icono, href,
//    y si el usuario tiene permiso) lo decide el servidor vía /api/modulos; acá
//    solo vive la presentación por ref. Para un módulo nuevo, sumá su ref al
//    CATALOGO_MODULOS de auth.js y, opcionalmente, un estilo acá. ───────────────
const ESTILOS = {
  'a8020':               { desc:'Análisis ABC 80/20 de productos por sucursal: clasificación, mínimos y días de operación.', accent:'#1e6e5c', soft:'#cceee7', ink:'#0a2e27' },
  'pedidos':             { desc:'Pedidos pendientes de Siga: clientes, productos y resumen por localidad.', accent:'#FFCC00', soft:'#FFF3B0', ink:'#1a1200' },
  'planificacion':       { desc:'Planificación de producción a partir de demanda, stock y sugerencias.', accent:'#65684C', soft:'#e7e8db', ink:'#2f3122' },
  'produccion':          { desc:'Producción del día: órdenes, granel y seguimiento de fabricación.', accent:'#3f7d4e', soft:'#dcefe0', ink:'#22432b' },
  'productividad':       { desc:'Productividad de la sala: órdenes planificadas contra lo producido, y ritmo por persona en producción y fraccionado.', accent:'#4E6B43', soft:'#e0ecda', ink:'#25361d' },
  'compras':             { desc:'Pedidos a proveedores: qué se le compró en dos años, stock y cobertura en central y sucursales, seguimiento de la entrega y dashboard OTIF.', accent:'#405936', soft:'#dfe8d6', ink:'#22331b' },
  'consumo':             { desc:'Consumo vs stock de insumos del proveedor Carlos: cobertura, urgencias y reposición.', accent:'#7d6a2a', soft:'#efe7c8', ink:'#3a3110' },
  'insumos':             { desc:'Control de los productos "Insumo …" y "Etiqueta …" en Casa Central: stock, consumo estimado por mes según los movimientos de stock y cuánto dura lo que hay.', accent:'#6b4e2a', soft:'#efe3d0', ink:'#33240f' },
  'distribucion':        { desc:'Distribución a sucursales: almacén, pesables, envasado y registro de producción fraccionada.', accent:'#2a6db5', soft:'#cfe1f5', ink:'#122d4c' },
  'ventas-hora':         { desc:'Dashboard de horas pico por sucursal con filtro de rango de fechas.', accent:'#5c3d8f', soft:'#ece4f7', ink:'#2e1a50' },
  'precios-proveedores': { desc:'Comparación de listas de proveedores contra costos SIGA: carga por PDF, URL o manual.', accent:'#2f855a', soft:'#d9f2e5', ink:'#1c3f2e' },
  'analisis-ventas':     { desc:'Rendimiento por sucursal: ticket promedio, días y horas pico, top productos y comparativa entre sucursales por rango de fechas.', accent:'#8f5c3d', soft:'#f3e2d6', ink:'#4c2e1a' },
  'analisis-central':    { desc:'Rendimiento de casa central: ticket promedio, días y horas pico, top productos y familias de producto por rango de fechas.', accent:'#3d5c8f', soft:'#d9e2f5', ink:'#1c2e4e' },
  'cruce-terminales':    { desc:'Cruce de las bajadas de Payway y QR contra el mapa de terminales: cada comprobante a su sucursal, aprobados separados del resto y resumen descargable en xlsx.', accent:'#2f6f7d', soft:'#d6ecf1', ink:'#123540' },
  'cruce-bancario':      { desc:'Cruce de la bajada del banco (xls) contra los tickets de SIGA por importe y hora: cada movimiento con su sucursal y su ticket, descargable en xlsx.', accent:'#2a7d6b', soft:'#d5efe8', ink:'#123f35' },
  'deposito-proarmet':   { desc:'Control del depósito Proarmet: productos con stock ahí y movimientos internos desde y hacia casa central.', accent:'#5c6f2f', soft:'#e6ecd3', ink:'#2b3514' },
  'cuentas-corrientes':  { desc:'Deuda viva de clientes: saldo por cliente, antigüedad y detalle de comprobantes con su saldo pendiente.', accent:'#a03d5c', soft:'#f7dde5', ink:'#4e1a2b' },
  'precios-historico':   { desc:'Qué precio tenía cada producto cada día de un mes: se elige mes y año, sale la planilla por PLU y se descarga en xlsx.', accent:'#7d5c2f', soft:'#f2e6d3', ink:'#3f2e14' },
  'ml-precios':          { desc:'Control de precios de Mercado Libre: se sube la bajada de publicaciones y se compara cada precio contra el esperado según la lista de SIGA, los márgenes y los gastos de ML.', accent:'#b59a1f', soft:'#f6efc6', ink:'#443a0c' },
  'tn-precios':          { desc:'Control de precios de Tienda Nube: se sube la bajada CSV de productos, se compara cada precio contra el esperado según la carta de SIGA y se exporta un CSV reimportable con los precios corregidos.', accent:'#2a6f9e', soft:'#d5e8f4', ink:'#0f3350' },
  'precios':             { desc:'Armado de precios de venta: costos, márgenes, precio final y simulador por producto, con el costeo del fraccionado incluido.', accent:'#a0492a', soft:'#f6dfd5', ink:'#4a1d0d' },
  'cotizador-mayorista': { desc:'Arma y publica la lista de precios mayoristas del cotizador web a partir de los precios decididos: importa desde Excel, muestra vista previa de cambios e historial de versiones.', accent:'#b5772a', soft:'#f8e8d0', ink:'#4d300e' },
  'tickets':             { desc:'Pedidos de cambios al sistema: cualquier usuario carga y comenta tickets, y se les hace seguimiento por estado en tablero o lista.', accent:'#4b6cb7', soft:'#dde5f6', ink:'#1c2c52' },
  'fraccionado-externo': { desc:'Pedidos de fraccionado para tercerizar: costo de mano de obra por paquete según velocidad y dificultad, tareas específicas y pedido en PDF.', accent:'#8a7a1f', soft:'#f0ecc8', ink:'#3a3410' },
  'rrhh':                { desc:'Área de Recursos Humanos: relevamiento de ropa de trabajo y lo que vayamos sumando del equipo.', accent:'#4a4f7d', soft:'#e2e4f3', ink:'#22254a' },
  'sucursales':          { desc:'Gestión de las sucursales: pedidos de mantenimiento, carteles de precio y lo que vayamos sumando.', accent:'#7d5a2f', soft:'#f1e5d3', ink:'#3d2b12' },
};
const ESTILO_DEFAULT = { desc:'', accent:'#65684C', soft:'#e7e8db', ink:'#2f3122' };

// Módulos contenedores: qué hay dentro. La tarjeta lleva al sub-hub del módulo
// (m.href) y estos chips anticipan el contenido sin abrirlo. Para sumar uno,
// agregá su ruta al catálogo de auth.js y su nombre acá.
const SUBMODULOS = {
  'rrhh': [{ titulo:'Relevamiento de Ropa', icon:'shirt' }, { titulo:'Analizador de CV', icon:'file-search' }],
  'sucursales': [{ titulo:'Mantenimiento', icon:'wrench' }, { titulo:'Carteles Pesables', icon:'tag' }],
};

function tileHTML(m, logueado){
  const bloqueado = m.requiereAuth && !m.permitido;
  // Bloqueado + logueado: sin acceso (no clickeable). Bloqueado + anónimo: lleva al login.
  const sinAcceso = bloqueado && logueado;
  const cuerpo = `
      <div class="flex items-start justify-between gap-3">
        <span class="tile-icon" aria-hidden="true"><i data-lucide="${m.icon}"></i></span>
        ${bloqueado
          ? `<span class="badge badge-lock"><i data-lucide="lock" style="width:11px;height:11px"></i>${sinAcceso ? 'Sin acceso' : 'Requiere login'}</span>`
          : (m.requiereAuth === false
            ? `<span class="badge badge-public"><i data-lucide="globe" style="width:11px;height:11px"></i>Público</span>`
            : `<span class="badge badge-live"><span class="status-dot ok" style="box-shadow:none"></span>Activo</span>`)}
      </div>
      <div>
        <h2 class="tile-title">${m.titulo}</h2>
        <p class="tile-desc mt-1">${m.desc}</p>
        ${(SUBMODULOS[m.ref] || []).length
          ? `<div class="tile-subs">${SUBMODULOS[m.ref].map(sm => `<span class="tile-sub"><i data-lucide="${sm.icon}"></i>${sm.titulo}</span>`).join('')}</div>`
          : ''}
      </div>
      <div class="tile-foot">
        <span class="tile-route">${m.href}</span>
        ${sinAcceso
          ? `<span class="tile-arrow" aria-hidden="true"><i data-lucide="lock"></i></span>`
          : `<span class="tile-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>`}
      </div>`;
  if (sinAcceso){
    return `
  <li role="listitem">
    <div class="tile tile-locked h-full" title="Tu usuario no tiene acceso a este módulo"
         style="--accent:${m.accent};--accent-soft:${m.soft};--accent-ink:${m.ink}"
         aria-label="${m.titulo} — sin acceso">${cuerpo}
    </div>
  </li>`;
  }
  const href = bloqueado ? ('/login?next=' + encodeURIComponent(m.href)) : m.href;
  return `
  <li role="listitem">
    <a class="tile fade-up h-full" href="${href}"
       style="--accent:${m.accent};--accent-soft:${m.soft};--accent-ink:${m.ink}"
       aria-label="Abrir ${m.titulo}">${cuerpo}
    </a>
  </li>`;
}

// Grupos: varios módulos del catálogo bajo una sola tarjeta. Cada acceso respeta
// sus permisos; un módulo que no existe en el catálogo simplemente no aparece.
const GRUPOS = [
  { ref:'grupo-precios', titulo:'Precios', icon:'tags', desc:'Armado de precios, cotizador mayorista y control de precios de Tienda Nube y Mercado Libre.',
    accent:'#a0492a', soft:'#f6dfd5', ink:'#4a1d0d',
    miembros:['precios', 'cotizador-mayorista', 'tn-precios', 'ml-precios'] },
];
const esAccesible = m => !(m.requiereAuth && !m.permitido);

function groupHTML(g, items, logueado){
  // Logueado: solo los accesos permitidos (si no hay ninguno, no hay grupo).
  // Anónimo: todos, llevan al login como el resto de las tarjetas.
  const visibles = logueado ? items.filter(esAccesible) : items;
  if (!visibles.length) return '';
  const links = visibles.map(m => {
    const href = esAccesible(m) ? m.href : ('/login?next=' + encodeURIComponent(m.href));
    return `<a class="group-link" href="${href}"><i data-lucide="${m.icon}" aria-hidden="true"></i><span>${m.titulo}</span><span class="tile-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span></a>`;
  }).join('');
  return `
  <li role="listitem">
    <section class="tile tile-group fade-up h-full" aria-label="${g.titulo}"
       style="--accent:${g.accent};--accent-soft:${g.soft};--accent-ink:${g.ink}">
      <div class="flex items-start justify-between gap-3">
        <span class="tile-icon" aria-hidden="true"><i data-lucide="${g.icon}"></i></span>
        <span class="badge badge-live"><span class="status-dot ok" style="box-shadow:none"></span>${visibles.length} módulos</span>
      </div>
      <div>
        <h2 class="tile-title">${g.titulo}</h2>
        <p class="tile-desc mt-1">${g.desc}</p>
      </div>
      <div class="group-links">${links}</div>
    </section>
  </li>`;
}

function tilesHTML(tiles, logueado){
  const grupoDe = new Map(GRUPOS.flatMap(g => g.miembros.map(r => [r, g])));
  const emitidos = new Set();
  return tiles.map(m => {
    const g = grupoDe.get(m.ref);
    if (!g) return tileHTML(m, logueado);
    if (emitidos.has(g.ref)) return '';
    emitidos.add(g.ref); // el grupo ocupa el lugar de su primer miembro
    return groupHTML(g, g.miembros.map(r => tiles.find(t => t.ref === r)).filter(Boolean), logueado);
  }).join('');
}

const soonHTML = `
  <li role="listitem">
    <div class="tile tile-soon h-full" aria-label="Próximo módulo">
      <span class="tile-icon" aria-hidden="true"><i data-lucide="plus"></i></span>
      <div>
        <h2 class="tile-title text-[#7a7c68]">Próximamente</h2>
        <p class="tile-desc mt-1">Nuevos módulos a medida que los vayamos creando.</p>
      </div>
      <span class="badge badge-soon mt-1">En camino</span>
    </div>
  </li>`;

const grid = document.getElementById('grid');

// Cierre de sesión
document.getElementById('btn-logout')?.addEventListener('click', async () => {
  try { await fetch('/api/logout', { method:'POST' }); } catch(e){}
  location.href = '/login';
});

// ── Cambio de contraseña propio ──────────────────────────────────────────────
const dlgPw = document.getElementById('dlg-password');
const formPw = document.getElementById('form-password');
const msgPw = document.getElementById('pw-msg');
function pwMensaje(texto, ok){
  msgPw.textContent = texto || '';
  msgPw.style.color = ok ? '#0e700e' : '#a4262c';
}
document.getElementById('btn-password')?.addEventListener('click', () => {
  formPw.reset(); pwMensaje('');
  dlgPw.showModal();
});
document.getElementById('pw-cancelar')?.addEventListener('click', () => dlgPw.close());
formPw?.addEventListener('submit', async (ev) => {
  ev.preventDefault(); // el envío lo hace fetch: el diálogo se cierra solo si salió bien
  const actual = document.getElementById('pw-actual').value;
  const nueva = document.getElementById('pw-nueva').value;
  const repetir = document.getElementById('pw-repetir').value;
  if (nueva !== repetir) return pwMensaje('Las dos contraseñas nuevas no coinciden.');
  const btn = document.getElementById('pw-guardar');
  btn.disabled = true; pwMensaje('Guardando…');
  try {
    const r = await fetch('/api/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ actual, nueva }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'No se pudo cambiar la contraseña.');
    pwMensaje('Contraseña actualizada.', true);
    setTimeout(() => dlgPw.close(), 900);
  } catch (e) {
    pwMensaje(e.message);
  } finally {
    btn.disabled = false;
  }
});

async function initHub(){
  // 1) Sesión: el hub es público. Si no hay usuario, se muestra igual con los
  //    módulos abiertos; el login se ofrece pero no se fuerza.
  let user = null;
  try { const s = await (await fetch('/api/session')).json(); user = s && s.user; }
  catch(e){ user = null; }

  // 2) Barra: alterna entre "Iniciar sesión" (anónimo) y usuario+salir (logueado).
  const loginLink = document.getElementById('login-link');
  const userChip  = document.getElementById('user-chip');
  const logoutBtn = document.getElementById('btn-logout');
  const adminLink = document.getElementById('admin-link');
  if (user){
    const nameEl = document.getElementById('user-name');
    if (nameEl) nameEl.textContent = user.nombre || user.usuario;
    userChip?.classList.remove('hidden');
    logoutBtn?.classList.remove('hidden');
    document.getElementById('btn-password')?.classList.remove('hidden');
    if (user.esAdmin) adminLink?.classList.remove('hidden');
  } else {
    loginLink?.classList.remove('hidden');
  }

  // 3) Aviso si volvimos por falta de permiso a un módulo.
  const params = new URLSearchParams(location.search);
  if (params.get('error') === 'permiso'){
    const b = document.createElement('div');
    b.className = 'fade-up mb-6';
    b.setAttribute('role', 'alert');
    b.innerHTML = '<div style="background:#fdecec;border:1px solid #f3c0bb;color:#a4262c;border-radius:12px;padding:12px 16px;font-size:.9rem;display:flex;align-items:center;gap:10px">'
      + '<i data-lucide="alert-triangle" style="width:18px;height:18px;flex-shrink:0"></i>'
      + '<span>Tu usuario no tiene permiso para ese módulo. Estos son los módulos disponibles para vos.</span></div>';
    grid.closest('section')?.insertAdjacentElement('beforebegin', b);
    history.replaceState({}, '', location.pathname);
  }

  // 4) Módulos: se listan TODOS los activos; los bloqueados se muestran igual.
  let mods = [];
  try { const r = await fetch('/api/modulos'); if (r.ok) mods = await r.json(); } catch(e){ mods = []; }
  const tiles = (Array.isArray(mods) ? mods : []).map(m => ({ ...(ESTILOS[m.ref] || ESTILO_DEFAULT), ...m }));
  grid.innerHTML = tilesHTML(tiles, !!user) + soonHTML;
  [...grid.querySelectorAll('.fade-up')].forEach((el,i)=>{ el.style.animationDelay = (i*55)+'ms'; });
  if (window.lucide) lucide.createIcons();
}

initHub();

// ── Reloj ────────────────────────────────────────────────────────────────────
const reloj = document.getElementById('reloj');
function tick(){
  try{ reloj.textContent = new Date().toLocaleString('es-AR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){}
}
tick(); setInterval(tick, 30000);

// ── Estado del servidor / DB ─────────────────────────────────────────────────
const dot = document.getElementById('status-dot');
const txt = document.getElementById('status-text');
async function chequearSalud(){
  try{
    const r = await fetch('/api/health',{cache:'no-store'});
    if(!r.ok) throw new Error('http '+r.status);
    const h = await r.json();
    dot.className = 'status-dot ok';
    txt.textContent = h.db ? 'Conectado · DB ok' : 'Conectado';
  }catch(e){
    dot.className = 'status-dot err';
    txt.textContent = 'Sin conexión';
  }
}
chequearSalud(); setInterval(chequearSalud, 60000);

// ── Hostname desde config ────────────────────────────────────────────────────
fetch('/api/config',{cache:'no-store'})
  .then(r=>r.ok?r.json():null)
  .then(c=>{ if(c&&c.hostname) document.getElementById('footer-host').textContent = c.hostname + (c.puerto?(':'+c.puerto):''); })
  .catch(()=>{});
</script>
