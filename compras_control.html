<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Compras · Apidelta</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#405936; --green-dark:#2E4027; --green-mid:#4E6B43; --green-light:#E8F0E4;
  --yellow:#FFCC00; --gold:#C98A00;
  --bg:#F5F5F5; --surface:#FFFFFF; --text:#1C1B1F; --muted:#6B6B6B; --border:#E6E6E6;
  --radius:12px; --radius-sm:8px;
  /* Semáforo del cruce: un color por estado de línea, sin repetir. */
  --ok:#388E3C; --falta:#D32F2F; --exceso:#E65100; --extra:#7B1FA2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif}
header{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header .logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.5px}
header .logo b{color:var(--yellow)}
header .sub{font-size:14px;opacity:.85}
header a{color:#fff;text-decoration:none;opacity:.85;font-size:14px;margin-left:auto}
.wrap{max-width:1500px;margin:0 auto;padding:20px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:var(--green-dark);
  margin:0 0 12px;text-transform:uppercase;letter-spacing:.3px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
select,input{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--text);width:100%}
button{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.3px;
  text-transform:uppercase;padding:8px 16px;border:0;border-radius:var(--radius-sm);
  background:var(--green);color:#fff;cursor:pointer}
button:hover{background:var(--green-dark)}
button:disabled{background:var(--muted);cursor:default}
button.sec{background:var(--surface);color:var(--green-dark);border:1px solid var(--border)}
button.sec:hover{background:var(--green-light)}

/* ── Lista de pedidos ────────────────────────────────────────────────────── */
.pedidos{max-height:70vh;overflow:auto;margin:0 -6px}
.pedido{width:100%;text-align:left;background:none;color:var(--text);text-transform:none;letter-spacing:0;
  font-family:inherit;font-weight:400;border:1px solid transparent;border-radius:var(--radius-sm);
  padding:8px 10px;cursor:pointer;display:block}
.pedido:hover{background:var(--green-light)}
.pedido.on{background:var(--green-light);border-color:var(--green-mid)}
.pedido .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--green-dark)}
.pedido .p{font-size:13px}
.pedido .m{font-size:11px;color:var(--muted)}

/* ── KPIs ────────────────────────────────────────────────────────────────── */
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.kpi{flex:1 1 150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;line-height:1;color:var(--green-dark)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

/* ── Tablas ──────────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  font-size:13px;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);padding:8px 6px;white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--border)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#FAFBF8}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.faltante,.pill.sin_cargar{color:var(--falta);border-color:var(--falta)}
.pill.excedente{color:var(--exceso);border-color:var(--exceso)}
.pill.no_pedido{color:var(--extra);border-color:var(--extra)}
.dif{font-weight:600}
.dif.menos{color:var(--falta)}
.dif.mas{color:var(--exceso)}

/* ── Comprobantes candidatos ─────────────────────────────────────────────── */
.comp{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:14px}
.comp input{width:auto}
.comp .et{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--green-dark)}
.comp .m{color:var(--muted);font-size:12px}
.comp .sug{color:var(--green-mid);font-size:11px;text-transform:uppercase;letter-spacing:.04em}

.aviso{background:var(--green-light);border:1px solid var(--green-mid);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:13px;margin-bottom:12px}
.error{background:#FDECEA;border:1px solid var(--falta);color:#8B1A12;border-radius:var(--radius-sm);
  padding:10px 12px;font-size:13px;margin-bottom:12px}
.vacio{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
.fila-controles{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0}
.chk input{width:auto}
</style>
</head>
<body>
<header>
  <span class="logo">API<b>DELTA</b></span>
  <span class="sub">Control de compras · pedido vs. carga en sistema</span>
  <a href="/inicio">← Inicio</a>
</header>

<div class="wrap">
  <div id="error" class="error" style="display:none"></div>

  <div class="cols">
    <!-- ── Pedidos ─────────────────────────────────────────────────────── -->
    <div class="card">
      <h2>Pedidos</h2>
      <div style="margin-bottom:10px">
        <label for="fEstado">Estado</label>
        <select id="fEstado">
          <option value="">Todos</option>
          <option value="CERRADO" selected>Cerrados</option>
          <option value="PENDIENTE">Pendientes</option>
          <option value="ANULADO">Anulados</option>
        </select>
      </div>
      <div id="listaPedidos" class="pedidos"><div class="vacio">Cargando…</div></div>
    </div>

    <!-- ── Detalle ─────────────────────────────────────────────────────── -->
    <div>
      <div id="detalle" class="card"><div class="vacio">Elegí un pedido de la izquierda.</div></div>
    </div>
  </div>
</div>

<script>
'use strict';
// Pantalla de control: se elige un pedido, se confirma contra qué comprobantes de
// SIGA se lo compara y se muestra el cruce línea por línea. El cálculo vive en el
// servidor (compras_control.js); acá sólo hay pintado y el guardado del vínculo.

const $ = id => document.getElementById(id);
const fmt = (n, d = 2) => n == null ? '—' : Number(n).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pesos = n => n == null ? '—' : '$ ' + fmt(n, 2);
const cant = n => n == null ? '—' : fmt(n, 3).replace(/,000$/, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ETIQUETA_ESTADO = {
  ok: 'ok', faltante: 'faltante', excedente: 'de más', sin_cargar: 'sin cargar', no_pedido: 'no pedido',
};

let seleccionado = null;
let candidatos = [];

function mostrarError(msg) {
  const box = $('error');
  if (!msg) { box.style.display = 'none'; return; }
  box.textContent = msg;
  box.style.display = 'block';
}

async function pedir(url, opciones) {
  const r = await fetch(url, opciones);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
  return data;
}

// ── Lista de pedidos ────────────────────────────────────────────────────────
async function cargarPedidos() {
  mostrarError('');
  const cont = $('listaPedidos');
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    const pedidos = await pedir('/api/compras/control/pedidos?estado=' + encodeURIComponent($('fEstado').value));
    if (!pedidos.length) { cont.innerHTML = '<div class="vacio">No hay pedidos con ese estado.</div>'; return; }
    cont.innerHTML = pedidos.map(p => `
      <button class="pedido${p.numero === seleccionado ? ' on' : ''}" data-numero="${esc(p.numero)}">
        <span class="n">${esc(p.numero)}</span>
        <div class="p">${esc(p.proveedor || '—')}</div>
        <div class="m">${esc(p.fecha || '')} · ${p.lineas} ítems · ${p.vinculados
          ? p.vinculados + ' comprob.' : '<span style="color:var(--gold)">sin vincular</span>'}</div>
      </button>`).join('');
    cont.querySelectorAll('.pedido').forEach(b => b.onclick = () => abrirPedido(b.dataset.numero));
  } catch (err) {
    cont.innerHTML = '<div class="vacio">—</div>';
    mostrarError('No se pudieron leer los pedidos: ' + err.message);
  }
}

// ── Detalle ─────────────────────────────────────────────────────────────────
async function abrirPedido(numero) {
  seleccionado = numero;
  document.querySelectorAll('.pedido').forEach(b => b.classList.toggle('on', b.dataset.numero === numero));
  $('detalle').innerHTML = '<div class="vacio">Buscando comprobantes en el sistema…</div>';
  mostrarError('');
  try {
    const data = await pedir('/api/compras/control/pedidos/' + encodeURIComponent(numero));
    candidatos = data.candidatos || [];
    pintarDetalle(data);
  } catch (err) {
    $('detalle').innerHTML = '<div class="vacio">—</div>';
    mostrarError('No se pudo armar la comparación: ' + err.message);
  }
}

function kpis(r) {
  return `
    <div class="kpis">
      <div class="kpi"><div class="v">${r.cumplimientoPct == null ? '—' : fmt(r.cumplimientoPct, 1) + '%'}</div><div class="l">Cumplimiento</div></div>
      <div class="kpi"><div class="v">${r.lineasConDiferencia}</div><div class="l">Líneas con diferencia</div></div>
      <div class="kpi"><div class="v">${r.lineasOk}/${r.lineas}</div><div class="l">Líneas ok</div></div>
      <div class="kpi"><div class="v">${pesos(r.importeCargado)}</div><div class="l">Importe cargado</div></div>
      <div class="kpi"><div class="v" style="color:var(--falta)">${pesos(r.importeFaltante)}</div><div class="l">Faltante valuado</div></div>
    </div>`;
}

function filaHTML(f) {
  const dif = f.difCargadoPedido;
  const clase = dif < 0 ? 'menos' : dif > 0 ? 'mas' : '';
  return `<tr>
    <td>${esc(f.plu)}</td>
    <td>${esc(f.nombre)}${f.obs ? ` <span style="color:var(--muted)">· ${esc(f.obs)}</span>` : ''}</td>
    <td>${esc(f.unidad)}</td>
    <td class="num">${f.enPedido ? cant(f.pedido) : '—'}</td>
    <td class="num">${f.entregado == null ? '—' : cant(f.entregado)}</td>
    <td class="num">${cant(f.cargado)}</td>
    <td class="num dif ${clase}">${dif === 0 ? '—' : (dif > 0 ? '+' : '') + cant(dif)}</td>
    <td class="num">${f.precioUnitario == null ? '—' : pesos(f.precioUnitario)}</td>
    <td class="num">${pesos(f.importe)}</td>
    <td class="num">${f.importeFaltante == null ? '—' : pesos(f.importeFaltante)}</td>
    <td><span class="pill ${f.estado}">${ETIQUETA_ESTADO[f.estado] || f.estado}</span></td>
  </tr>`;
}

function comprobantesHTML(vinculadas, vinculado) {
  if (!candidatos.length) {
    return '<div class="vacio">No hay comprobantes de este proveedor en la ventana de fechas del pedido.</div>';
  }
  // Sin vínculo guardado la pantalla propone los sugeridos; una vez guardado manda
  // lo que eligió el usuario, incluso si eligió ninguno.
  const marcada = c => vinculado ? vinculadas.includes(c.clave) : c.sugerido;
  return candidatos.map(c => `
    <label class="comp">
      <input type="checkbox" value="${esc(c.clave)}"${marcada(c) ? ' checked' : ''}>
      <span class="et">${esc(c.etiqueta)}</span>
      <span class="m">${esc(c.fecha || '')} · ${c.lineas} ítems · ${pesos(c.importeTotal)}</span>
      ${c.sugerido ? `<span class="sug">${c.pluCoincidentes}/${c.pluPedido} plu del pedido</span>` : ''}
    </label>`).join('');
}

function pintarDetalle(data) {
  const c = data.comparacion;
  const vinculadas = data.vinculadas || [];
  const vinculado = Boolean(data.vinculado);
  const sinConfirmar = !vinculado && candidatos.some(x => x.sugerido);
  $('detalle').innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h2>${esc(c.numero)} · ${esc(c.proveedor || '')}</h2>
      <div style="color:var(--muted);font-size:13px;margin-bottom:12px">
        Pedido ${esc(c.fecha || '—')} · Retiro ${esc(c.fechaRetiro || '—')} · Estado ${esc(c.estado || '—')}
      </div>
      ${sinConfirmar ? '<div class="aviso">Vínculo propuesto por el sistema: revisá los comprobantes tildados y guardá para dejarlo fijo.</div>' : ''}
      <div id="comps">${comprobantesHTML(vinculadas, vinculado)}</div>
      <div class="fila-controles" style="margin-top:12px">
        <button id="btnGuardar"${candidatos.length ? '' : ' disabled'}>Guardar vínculo</button>
        <button id="btnRecalcular" class="sec">Recalcular</button>
        <span style="color:var(--muted);font-size:12px">${vinculado
          ? vinculadas.length + ' comprobante(s) vinculado(s)' : 'sin vínculo guardado'}</span>
      </div>
    </div>

    <div class="card">
      ${kpis(c.resumen)}
      <div class="fila-controles">
        <label class="chk"><input type="checkbox" id="soloDif"> Ver sólo las diferencias</label>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>PLU</th><th>Producto</th><th>UM</th>
            <th class="num">Pedido</th><th class="num">Entregado</th><th class="num">Cargado</th>
            <th class="num">Dif.</th><th class="num">Precio</th><th class="num">Importe</th>
            <th class="num">Faltante $</th><th>Estado</th>
          </tr></thead>
          <tbody id="filas">${c.filas.map(filaHTML).join('')}</tbody>
        </table>
      </div>
      ${c.filas.length ? '' : '<div class="vacio">El pedido no tiene ítems.</div>'}
    </div>`;

  $('btnGuardar').onclick = guardarVinculo;
  $('btnRecalcular').onclick = () => abrirPedido(c.numero);
  $('soloDif').onchange = e => {
    const filas = c.filas.filter(f => !e.target.checked || f.estado !== 'ok');
    $('filas').innerHTML = filas.map(filaHTML).join('');
  };
}

async function guardarVinculo() {
  const claves = [...document.querySelectorAll('#comps input:checked')].map(i => i.value);
  const btn = $('btnGuardar');
  btn.disabled = true;
  try {
    await pedir('/api/compras/control/pedidos/' + encodeURIComponent(seleccionado) + '/comprobantes', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ claves }),
    });
    await abrirPedido(seleccionado);
    cargarPedidos();
  } catch (err) {
    mostrarError('No se pudo guardar el vínculo: ' + err.message);
    btn.disabled = false;
  }
}

$('fEstado').onchange = cargarPedidos;
cargarPedidos();
</script>
</body>
</html>
