<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apidelta — Centro de operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
// ── Paleta oficial Apidelta ─────────────────────────────────────────────────
//   Negro #000000 · Oliva #65684C · Gris #BDBDB7 · Blanco #FFFFFF · Amarillo #FFCC00
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand:   { DEFAULT: '#FFCC00', dark: '#E6B800', soft: '#FFF3B0', ink: '#1a1200' },
        ink:     '#000000',
        olive:   { DEFAULT: '#65684C', soft: '#eae9e1' },
        line:    '#BDBDB7',
        surface: { DEFAULT:'#FFFFFF', alt:'#fafaf6', deep:'#f5f5f1' }
      },
      fontFamily: {
        sans:    ['Public Sans', 'system-ui', 'sans-serif'],
        display: ['Bricolage Grotesque', 'Public Sans', 'sans-serif'],
        mono:    ['Spline Sans Mono', 'ui-monospace', 'monospace']
      },
      boxShadow: {
        soft: '0 1px 2px rgba(15,17,21,.04), 0 2px 8px rgba(15,17,21,.04)',
        lift: '0 4px 12px rgba(15,17,21,.06), 0 12px 32px rgba(15,17,21,.06)'
      }
    }
  }
};
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   APIDELTA · Hub / Centro de operaciones
   Paleta oficial: #000 / #65684C / #BDBDB7 / #FFF / #FFCC00
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --p:#FFCC00; --p-dk:#E6B800; --on-surf:#1f2024; --on-svar:#6b6e55;
  --outline:#d8d8d2; --bg:#f6f6f3; --ok:#4a7026; --err:#b53d24;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--on-surf);font-size:14px;line-height:1.55}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}

/* App Bar — verde oliva con detalle ámbar (consistente con el resto del sistema) */
.app-bar{
  background:linear-gradient(180deg,#6e7152 0%,#5d6045 100%);
  color:#fff;min-height:60px;padding:0 24px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:30;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 28px -16px rgba(101,104,76,.4);
}
.app-bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent 0%,#FFCC00 30%,#FFCC00 70%,transparent 100%);opacity:.55}
.app-bar-logo{height:34px;width:34px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.app-bar-title{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:1.02rem;font-weight:700;letter-spacing:.01em;line-height:1.1}
.app-bar-sub{font-size:.72rem;opacity:.72;font-weight:500}
.dev-offset{margin-top:26px}
@media (max-width:640px){
  #dev-banner{font-size:.66rem;letter-spacing:.04em;padding:4px 8px}
  .dev-offset{margin-top:42px}
}

/* Chip de estado del servidor */
.status-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.72rem;font-weight:600;letter-spacing:.02em}
.status-dot{width:8px;height:8px;border-radius:50%;background:#cbd08a;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.status-dot.ok{background:#9bd24a;box-shadow:0 0 0 3px rgba(155,210,74,.18)}
.status-dot.err{background:#ff7a5c;box-shadow:0 0 0 3px rgba(255,122,92,.18)}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
.status-dot.loading{animation:blip 1.1s ease-in-out infinite}

/* Tarjeta de módulo */
.tile{
  position:relative;display:flex;flex-direction:column;gap:14px;
  background:#fff;border:1px solid var(--outline);border-radius:18px;
  padding:22px;text-decoration:none;color:inherit;overflow:hidden;
  box-shadow:0 1px 2px rgba(15,17,21,.04),0 2px 8px rgba(15,17,21,.04);
  transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s ease,border-color .18s ease;
}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,#FFCC00);opacity:0;transition:opacity .18s ease}
.tile:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(15,17,21,.07),0 18px 44px rgba(15,17,21,.07);border-color:#c9c9c0}
.tile:hover::before{opacity:1}
.tile:focus-visible{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(255,204,0,.35),0 8px 18px rgba(15,17,21,.08)}
.tile-icon{
  width:52px;height:52px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;
  background:var(--accent-soft,#FFF3B0);color:var(--accent-ink,#1a1200);
}
.tile-icon svg{width:26px;height:26px}
.tile-title{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:1.12rem;font-weight:700;color:#171712;line-height:1.2}
.tile-desc{font-size:.86rem;color:#5b5e4d;line-height:1.5}
.tile-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.tile-route{font-family:'Spline Sans Mono',ui-monospace,monospace;font-size:.74rem;font-weight:600;color:#8a8c78;background:#f4f4ee;border:1px solid #e8e8e0;padding:3px 8px;border-radius:7px}
.tile-arrow{color:#b9bba2;transition:transform .18s ease,color .18s ease}
.tile:hover .tile-arrow{transform:translateX(3px);color:#65684C}

/* Tarjeta "próximamente" — no interactiva */
.tile-soon{
  border-style:dashed;border-color:#d3d3cb;background:#fbfbf8;cursor:default;
  box-shadow:none;min-height:170px;
}
.tile-soon:hover{transform:none;box-shadow:none;border-color:#cfcfc6}
.tile-soon .tile-icon{background:#eeeee7;color:#9a9c86}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.badge-live{background:#e3f0d2;color:#3f5e1f}
.badge-soon{background:#f0f0ea;color:#8a8c78}
.badge-lock{background:#f0e6d0;color:#7a5a12}
.badge-public{background:#d5e8f5;color:#1c4b6e}
.tile-locked{opacity:.62;cursor:not-allowed;background:#fbfbf8;border-style:dashed;border-color:#d8d3c4}
.tile-locked:hover{transform:none;box-shadow:0 1px 2px rgba(15,17,21,.04),0 2px 8px rgba(15,17,21,.04);border-color:#d8d3c4}
.tile-locked:hover::before{opacity:0}
.tile-locked .tile-icon{filter:grayscale(.4)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- Banner de ambiente de pruebas (consistente con el resto del sistema dev) -->


<header class="app-bar">
  <svg class="app-bar-logo" viewBox="0 0 32 32" role="img" aria-label="Apidelta">
    <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="#405936"/>
    <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="none" stroke="#FFCC00" stroke-width="1.4" opacity=".9"/>
    <text x="16" y="23" font-family="'Bricolage Grotesque','Barlow Condensed',Arial,sans-serif" font-weight="800" font-size="18" text-anchor="middle" fill="#FFCC00">A</text>
  </svg>
  <div>
    <div class="app-bar-title">Apidelta</div>
    <div class="app-bar-sub">Centro de operaciones</div>
  </div>
  <div class="ml-auto flex items-center gap-3">
    <span id="reloj" class="hidden sm:block text-xs font-mono opacity-80" aria-hidden="true"></span>
    <span class="status-chip" role="status" aria-live="polite">
      <span id="status-dot" class="status-dot loading"></span>
      <span id="status-text">Conectando…</span>
    </span>
    <a id="admin-link" href="/admin" class="status-chip hidden" style="text-decoration:none" title="Centro de control">
      <i data-lucide="shield" style="width:14px;height:14px"></i><span class="hidden sm:inline">Centro de control</span>
    </a>
    <a id="login-link" href="/login" class="status-chip hidden" style="text-decoration:none" title="Iniciar sesión">
      <i data-lucide="log-in" style="width:14px;height:14px"></i><span class="hidden sm:inline">Iniciar sesión</span>
    </a>
    <span id="user-chip" class="status-chip hidden" title="Usuario conectado">
      <i data-lucide="user" style="width:14px;height:14px"></i><span id="user-name">…</span>
    </span>
    <button id="btn-logout" type="button" class="status-chip hidden" style="border:none;cursor:pointer;font:inherit" title="Cerrar sesión">
      <i data-lucide="log-out" style="width:14px;height:14px"></i><span class="hidden sm:inline">Salir</span>
    </button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-5 sm:px-8 py-8 sm:py-12">

  <div class="fade-up mb-8 sm:mb-10">
    <h1 class="font-display text-2xl sm:text-3xl font-extrabold text-[#171712] tracking-tight">
      Seleccioná un módulo
    </h1>
    <p class="mt-1.5 text-[#5b5e4d] text-sm sm:text-[15px] max-w-2xl">
      Acceso directo a los sistemas de Apidelta. Pedidos, planificación, producción y todo lo que vayamos sumando.
    </p>
  </div>

  <section aria-label="Módulos disponibles">
    <ul id="grid" role="list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></ul>
  </section>

  <footer class="mt-12 pt-6 border-t border-[#e6e6df] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs text-[#8a8c78]">
    <span>Apidelta · Subsistema local · <span id="footer-host">dev</span></span>
    <span class="font-mono">v1.0</span>
  </footer>
</main>

<script>
// ── Estilos de módulo (color + descripción). El QUÉ mostrar (título, icono, href,
//    y si el usuario tiene permiso) lo decide el servidor vía /api/modulos; acá
//    solo vive la presentación por ref. Para un módulo nuevo, sumá su ref al
//    CATALOGO_MODULOS de auth.js y, opcionalmente, un estilo acá. ───────────────
const ESTILOS = {
  'a8020':               { desc:'Análisis ABC 80/20 de productos por sucursal: clasificación, mínimos y días de operación.', accent:'#1e6e5c', soft:'#cceee7', ink:'#0a2e27' },
  'pedidos':             { desc:'Pedidos pendientes de Siga: clientes, productos y resumen por localidad.', accent:'#FFCC00', soft:'#FFF3B0', ink:'#1a1200' },
  'planificacion':       { desc:'Planificación de producción a partir de demanda, stock y sugerencias.', accent:'#65684C', soft:'#e7e8db', ink:'#2f3122' },
  'produccion':          { desc:'Producción del día: órdenes, granel y seguimiento de fabricación.', accent:'#3f7d4e', soft:'#dcefe0', ink:'#22432b' },
  'compras':             { desc:'Reposición unificada: déficit A8020, micro-envíos y faltantes, con carrito, proveedores y órdenes.', accent:'#405936', soft:'#dfe8d6', ink:'#22331b' },
  'consumo':             { desc:'Consumo vs stock de insumos del proveedor Carlos: cobertura, urgencias y reposición.', accent:'#7d6a2a', soft:'#efe7c8', ink:'#3a3110' },
  'distribucion':        { desc:'Distribución a sucursales: almacén, pesables, envasado y registro de producción fraccionada.', accent:'#2a6db5', soft:'#cfe1f5', ink:'#122d4c' },
  'ventas-hora':         { desc:'Dashboard de horas pico por sucursal con filtro de rango de fechas.', accent:'#5c3d8f', soft:'#ece4f7', ink:'#2e1a50' },
  'precios-proveedores': { desc:'Comparación de listas de proveedores contra costos SIGA: carga por PDF, URL o manual.', accent:'#2f855a', soft:'#d9f2e5', ink:'#1c3f2e' },
  'analisis-ventas':     { desc:'Rendimiento por sucursal: ticket promedio, días y horas pico, top productos y comparativa entre sucursales por rango de fechas.', accent:'#8f5c3d', soft:'#f3e2d6', ink:'#4c2e1a' },
  'cuentas-corrientes':  { desc:'Deuda viva de clientes: saldo por cliente, antigüedad y detalle de comprobantes con su saldo pendiente.', accent:'#a03d5c', soft:'#f7dde5', ink:'#4e1a2b' },
};
const ESTILO_DEFAULT = { desc:'', accent:'#65684C', soft:'#e7e8db', ink:'#2f3122' };

function tileHTML(m, logueado){
  const bloqueado = m.requiereAuth && !m.permitido;
  // Bloqueado + logueado: sin acceso (no clickeable). Bloqueado + anónimo: lleva al login.
  const sinAcceso = bloqueado && logueado;
  const cuerpo = `
      <div class="flex items-start justify-between gap-3">
        <span class="tile-icon" aria-hidden="true"><i data-lucide="${m.icon}"></i></span>
        ${bloqueado
          ? `<span class="badge badge-lock"><i data-lucide="lock" style="width:11px;height:11px"></i>${sinAcceso ? 'Sin acceso' : 'Requiere login'}</span>`
          : (m.requiereAuth === false
            ? `<span class="badge badge-public"><i data-lucide="globe" style="width:11px;height:11px"></i>Público</span>`
            : `<span class="badge badge-live"><span class="status-dot ok" style="box-shadow:none"></span>Activo</span>`)}
      </div>
      <div>
        <h2 class="tile-title">${m.titulo}</h2>
        <p class="tile-desc mt-1">${m.desc}</p>
      </div>
      <div class="tile-foot">
        <span class="tile-route">${m.href}</span>
        ${sinAcceso
          ? `<span class="tile-arrow" aria-hidden="true"><i data-lucide="lock"></i></span>`
          : `<span class="tile-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>`}
      </div>`;
  if (sinAcceso){
    return `
  <li role="listitem">
    <div class="tile tile-locked h-full" title="Tu usuario no tiene acceso a este módulo"
         style="--accent:${m.accent};--accent-soft:${m.soft};--accent-ink:${m.ink}"
         aria-label="${m.titulo} — sin acceso">${cuerpo}
    </div>
  </li>`;
  }
  const href = bloqueado ? ('/login?next=' + encodeURIComponent(m.href)) : m.href;
  return `
  <li role="listitem">
    <a class="tile fade-up h-full" href="${href}"
       style="--accent:${m.accent};--accent-soft:${m.soft};--accent-ink:${m.ink}"
       aria-label="Abrir ${m.titulo}">${cuerpo}
    </a>
  </li>`;
}

const soonHTML = `
  <li role="listitem">
    <div class="tile tile-soon h-full" aria-label="Próximo módulo">
      <span class="tile-icon" aria-hidden="true"><i data-lucide="plus"></i></span>
      <div>
        <h2 class="tile-title text-[#7a7c68]">Próximamente</h2>
        <p class="tile-desc mt-1">Nuevos módulos a medida que los vayamos creando.</p>
      </div>
      <span class="badge badge-soon mt-1">En camino</span>
    </div>
  </li>`;

const grid = document.getElementById('grid');

// Cierre de sesión
document.getElementById('btn-logout')?.addEventListener('click', async () => {
  try { await fetch('/api/logout', { method:'POST' }); } catch(e){}
  location.href = '/login';
});

async function initHub(){
  // 1) Sesión: el hub es público. Si no hay usuario, se muestra igual con los
  //    módulos abiertos; el login se ofrece pero no se fuerza.
  let user = null;
  try { const s = await (await fetch('/api/session')).json(); user = s && s.user; }
  catch(e){ user = null; }

  // 2) Barra: alterna entre "Iniciar sesión" (anónimo) y usuario+salir (logueado).
  const loginLink = document.getElementById('login-link');
  const userChip  = document.getElementById('user-chip');
  const logoutBtn = document.getElementById('btn-logout');
  const adminLink = document.getElementById('admin-link');
  if (user){
    const nameEl = document.getElementById('user-name');
    if (nameEl) nameEl.textContent = user.nombre || user.usuario;
    userChip?.classList.remove('hidden');
    logoutBtn?.classList.remove('hidden');
    if (user.esAdmin) adminLink?.classList.remove('hidden');
  } else {
    loginLink?.classList.remove('hidden');
  }

  // 3) Aviso si volvimos por falta de permiso a un módulo.
  const params = new URLSearchParams(location.search);
  if (params.get('error') === 'permiso'){
    const b = document.createElement('div');
    b.className = 'fade-up mb-6';
    b.setAttribute('role', 'alert');
    b.innerHTML = '<div style="background:#fdecec;border:1px solid #f3c0bb;color:#8a2a1c;border-radius:12px;padding:12px 16px;font-size:.9rem;display:flex;align-items:center;gap:10px">'
      + '<i data-lucide="alert-triangle" style="width:18px;height:18px;flex-shrink:0"></i>'
      + '<span>Tu usuario no tiene permiso para ese módulo. Estos son los módulos disponibles para vos.</span></div>';
    grid.closest('section')?.insertAdjacentElement('beforebegin', b);
    history.replaceState({}, '', location.pathname);
  }

  // 4) Módulos: se listan TODOS los activos; los bloqueados se muestran igual.
  let mods = [];
  try { const r = await fetch('/api/modulos'); if (r.ok) mods = await r.json(); } catch(e){ mods = []; }
  const tiles = (Array.isArray(mods) ? mods : []).map(m => ({ ...(ESTILOS[m.ref] || ESTILO_DEFAULT), ...m }));
  grid.innerHTML = tiles.map(m => tileHTML(m, !!user)).join('') + soonHTML;
  [...grid.querySelectorAll('.fade-up')].forEach((el,i)=>{ el.style.animationDelay = (i*55)+'ms'; });
  if (window.lucide) lucide.createIcons();
}

initHub();

// ── Reloj ────────────────────────────────────────────────────────────────────
const reloj = document.getElementById('reloj');
function tick(){
  try{ reloj.textContent = new Date().toLocaleString('es-AR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){}
}
tick(); setInterval(tick, 30000);

// ── Estado del servidor / DB ─────────────────────────────────────────────────
const dot = document.getElementById('status-dot');
const txt = document.getElementById('status-text');
async function chequearSalud(){
  try{
    const r = await fetch('/api/health',{cache:'no-store'});
    if(!r.ok) throw new Error('http '+r.status);
    const h = await r.json();
    dot.className = 'status-dot ok';
    txt.textContent = h.db ? 'Conectado · DB ok' : 'Conectado';
  }catch(e){
    dot.className = 'status-dot err';
    txt.textContent = 'Sin conexión';
  }
}
chequearSalud(); setInterval(chequearSalud, 60000);

// ── Hostname desde config ────────────────────────────────────────────────────
fetch('/api/config',{cache:'no-store'})
  .then(r=>r.ok?r.json():null)
  .then(c=>{ if(c&&c.hostname) document.getElementById('footer-host').textContent = c.hostname + (c.puerto?(':'+c.puerto):''); })
  .catch(()=>{});
</script>
</body>
</html>
