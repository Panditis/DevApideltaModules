<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apidelta — Relevamiento de Ropa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Spline+Sans+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   APIDELTA · RRHH / Relevamiento de ropa de trabajo
   Paleta oficial: #000 / #65684C / #BDBDB7 / #FFF / #FFCC00 · acento del área #4a4f7d
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --p:#FFCC00; --area:#4a4f7d; --area-soft:#e2e4f3; --area-ink:#22254a;
  --on-surf:#1f2024; --muted:#7d8069; --outline:#d8d8d2; --bg:#f6f6f3;
  --ok:#3f5e1f; --ok-bg:#e3f0d2; --err:#8a2a1c; --err-bg:#fbe3df; --na:#8a8c78; --na-bg:#f0f0ea;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--on-surf);font-size:14px;line-height:1.55}
.hidden{display:none!important}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .35s cubic-bezier(.2,.7,.2,1) both}

/* ── App bar ─────────────────────────────────────────────────────────────── */
.app-bar{
  background:linear-gradient(180deg,#6e7152 0%,#5d6045 100%);
  color:#fff;min-height:60px;padding:0 24px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 28px -16px rgba(101,104,76,.4);
}
.app-bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent 0%,#FFCC00 30%,#FFCC00 70%,transparent 100%);opacity:.55}
.app-bar-logo{height:34px;width:34px;display:block}
.app-bar-title{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:1.02rem;font-weight:700;line-height:1.1}
.app-bar-sub{font-size:.72rem;opacity:.72;font-weight:500}
.app-bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.status-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.72rem;font-weight:600;color:#fff;text-decoration:none}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px 56px}
.crumbs{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.crumbs a{color:#65684C;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.crumbs a:hover{text-decoration:underline}
.crumbs svg{width:14px;height:14px}

.page-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-icon{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;background:var(--area-soft);color:var(--area-ink);flex-shrink:0}
.page-icon svg{width:28px;height:28px}
h1{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:1.65rem;font-weight:800;color:#171712;line-height:1.15;letter-spacing:-.01em}
.page-sub{color:#5b5e4d;font-size:.92rem;margin-top:3px;max-width:60ch}
.page-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ── Botones ─────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:9px 15px;
  font-size:.85rem;font-weight:600;font-family:inherit;cursor:pointer;
  border:1px solid var(--outline);background:#fff;color:#3f4136;
  transition:background .15s ease,border-color .15s ease,transform .12s ease;
}
.btn:hover{background:#faf9f4;border-color:#c4c4ba}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--area);border-color:var(--area);color:#fff}
.btn-primary:hover{background:#3d4269;border-color:#3d4269}
.btn-danger{color:var(--err);border-color:#e8c9c3}
.btn-danger:hover{background:#fdf2f0;border-color:#dcaea5}
.btn-sm{padding:5px 10px;font-size:.78rem;border-radius:9px}
.btn-icon{padding:6px;border-radius:9px}
.btn-icon svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── KPIs ────────────────────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--outline);border-radius:15px;padding:15px 17px}
.kpi-label{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:1.75rem;font-weight:800;line-height:1.1;margin-top:3px}
.kpi-hint{font-size:.76rem;color:var(--muted);margin-top:2px}
.kpi.alert .kpi-value{color:var(--err)}
.kpi.warn .kpi-value{color:#7a5a12}

/* ── Filtros ─────────────────────────────────────────────────────────────── */
.toolbar{
  background:#fff;border:1px solid var(--outline);border-radius:15px;padding:13px 15px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;
}
.field{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=search],select,textarea{
  font-family:inherit;font-size:.86rem;color:var(--on-surf);
  border:1px solid var(--outline);border-radius:10px;padding:7px 11px;background:#fff;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--area);box-shadow:0 0 0 3px rgba(74,79,125,.14)}
.check{display:inline-flex;align-items:center;gap:7px;font-size:.85rem;font-weight:600;color:#3f4136;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--area);cursor:pointer}

/* ── Tabla ───────────────────────────────────────────────────────────────── */
.table-card{background:#fff;border:1px solid var(--outline);border-radius:15px;overflow:hidden}
.table-scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
thead th{
  position:sticky;top:0;z-index:2;background:#f4f4ee;color:#4c4f3e;
  font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--outline);white-space:nowrap;
}
thead th.prenda-col{text-align:center;border-left:1px solid #e8e8e0}
tbody td{padding:9px 12px;border-bottom:1px solid #eeeee8;vertical-align:middle}
tbody tr:hover{background:#fbfbf7}
tbody td.prenda-cell{text-align:center;border-left:1px solid #f2f2ec;white-space:nowrap}
.row-area{background:#f0f0ea}
.row-area td{
  padding:7px 12px;font-family:'Bricolage Grotesque','Public Sans',sans-serif;
  font-size:.8rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#4c4f3e;
}
.row-area .cuenta{font-family:'Spline Sans Mono',monospace;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:8px}
.nombre{font-weight:600;color:#171712}
.sub{font-size:.78rem;color:var(--muted)}
.obs{font-size:.78rem;color:#6b6e55;max-width:230px}
.acciones{display:flex;gap:5px;justify-content:flex-end}

/* Estado de cada prenda */
.est{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.est-si{background:var(--ok-bg);color:var(--ok)}
.est-no{background:var(--err-bg);color:var(--err)}
.est-na{background:var(--na-bg);color:var(--na)}
.est-vacio{background:#f7f7f2;color:#a9ab97;border:1px dashed #dedbd0}
.talle{display:block;font-family:'Spline Sans Mono',monospace;font-size:.8rem;font-weight:600;color:#3f4136;margin-bottom:2px}
.talle-vacio{color:#c0c1b3}

.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:8px}

/* ── Modal ───────────────────────────────────────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(24,25,20,.45);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;z-index:60;overflow-y:auto;
}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:780px;
  box-shadow:0 18px 60px rgba(15,17,21,.22);animation:fadeUp .22s cubic-bezier(.2,.7,.2,1) both;
}
.modal-sm{max-width:520px}
.modal-head{display:flex;align-items:center;gap:11px;padding:18px 22px;border-bottom:1px solid #eeeee8}
.modal-head h2{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:1.12rem;font-weight:700}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:15px 22px;border-top:1px solid #eeeee8;background:#fbfbf7;border-radius:0 0 18px 18px}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.grid-form .field input,.grid-form .field select,.grid-form .field textarea{width:100%}
.field-full{grid-column:1/-1}

/* Grilla de prendas dentro del modal de empleado */
.prendas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.prenda-box{border:1px solid var(--outline);border-radius:12px;padding:11px 13px;background:#fbfbf7}
.prenda-box .nom{font-size:.82rem;font-weight:700;color:#3f4136;margin-bottom:7px}
.prenda-box .row{display:flex;gap:8px}
.prenda-box input,.prenda-box select{flex:1;min-width:0}

/* Lista de indumentaria */
.prenda-item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f0f0ea}
.prenda-item:last-child{border-bottom:none}
.prenda-item input{flex:1}
.prenda-item .id{font-family:'Spline Sans Mono',monospace;font-size:.72rem;color:var(--muted);background:#f4f4ee;border:1px solid #e8e8e0;padding:2px 7px;border-radius:6px}

.aviso{border-radius:11px;padding:10px 13px;font-size:.85rem;display:flex;align-items:flex-start;gap:9px}
.aviso-err{background:#fdecec;border:1px solid #f3c0bb;color:#8a2a1c}
.aviso svg{width:17px;height:17px;flex-shrink:0;margin-top:1px}

/* Toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:#2b2d24;color:#fff;padding:10px 17px;border-radius:11px;font-size:.86rem;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.24);z-index:80;animation:fadeUp .2s ease both;
}
.toast.err{background:#8a2a1c}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<header class="app-bar">
  <a href="/" style="display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none">
    <svg class="app-bar-logo" viewBox="0 0 32 32" role="img" aria-label="Apidelta">
      <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="#405936"/>
      <polygon points="16,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5" fill="none" stroke="#FFCC00" stroke-width="1.4" opacity=".9"/>
      <text x="16" y="23" font-family="'Bricolage Grotesque',Arial,sans-serif" font-weight="800" font-size="18" text-anchor="middle" fill="#FFCC00">A</text>
    </svg>
    <div>
      <div class="app-bar-title">Apidelta</div>
      <div class="app-bar-sub">RRHH · Relevamiento de ropa</div>
    </div>
  </a>
  <div class="app-bar-right">
    <span id="user-chip" class="status-chip hidden"><i data-lucide="user" style="width:14px;height:14px"></i><span id="user-name">…</span></span>
    <a href="/rrhh" class="status-chip"><i data-lucide="users" style="width:14px;height:14px"></i><span>RRHH</span></a>
  </div>
</header>

<div class="wrap">

  <nav class="crumbs fade-up" aria-label="Ruta">
    <a href="/"><i data-lucide="arrow-left"></i>Centro de operaciones</a>
    <span aria-hidden="true">/</span>
    <a href="/rrhh">RRHH</a>
    <span aria-hidden="true">/</span>
    <span>Relevamiento de Ropa</span>
  </nav>

  <div class="page-head fade-up">
    <span class="page-icon" aria-hidden="true"><i data-lucide="shirt"></i></span>
    <div>
      <h1>Relevamiento de Ropa de Trabajo</h1>
      <p class="page-sub">
        Qué tiene hoy cada empleado y qué le falta. El calzado de seguridad es obligatorio en Producción y Logística;
        <strong>N/A</strong> marca la prenda que no aplica al puesto.
      </p>
    </div>
    <div class="page-actions">
      <button class="btn" id="btn-indumentaria" type="button">
        <i data-lucide="layers"></i>Indumentaria
      </button>
      <button class="btn btn-primary" id="btn-nuevo" type="button">
        <i data-lucide="user-plus"></i>Nuevo empleado
      </button>
    </div>
  </div>

  <section class="kpis fade-up" id="kpis" aria-label="Resumen"></section>

  <div class="toolbar fade-up">
    <div class="field" style="flex:1;min-width:210px">
      <label class="field-label" for="f-buscar">Buscar</label>
      <input type="search" id="f-buscar" placeholder="Nombre, puesto u observación…" autocomplete="off">
    </div>
    <div class="field">
      <label class="field-label" for="f-area">Área</label>
      <select id="f-area"><option value="">Todas</option></select>
    </div>
    <div class="field">
      <label class="field-label" for="f-ubicacion">Ubicación</label>
      <select id="f-ubicacion"><option value="">Todas</option></select>
    </div>
    <label class="check" style="margin-top:16px">
      <input type="checkbox" id="f-faltantes">Solo con faltantes
    </label>
    <label class="check" style="margin-top:16px">
      <input type="checkbox" id="f-sin-relevar">Solo sin relevar
    </label>
    <button class="btn btn-sm" id="btn-limpiar" type="button" style="margin-top:16px">
      <i data-lucide="rotate-ccw"></i>Limpiar
    </button>
  </div>

  <div class="table-card fade-up">
    <div class="table-scroll">
      <table id="tabla">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <p class="sub" style="margin-top:12px" id="pie-conteo"></p>
</div>

<div id="modales"></div>

<script src="/rrhh_relevamiento_ropa.js"></script>
</body>
</html>
