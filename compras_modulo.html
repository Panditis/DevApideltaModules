<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras · Apidelta</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { verde:'#405936', verdeDark:'#2e4027', verdeHover:'#4f6e42', amarillo:'#FFCC00',
    bg:'#eef2e9', card:'#ffffff', borde:'#c3c9bc', ink:'#1a1c18',
    rojo:'#D32F2F', naranja:'#E65100', ambar:'#F57F17', ok:'#388E3C' },
  fontFamily: { disp:['"Barlow Condensed"','sans-serif'], body:['Roboto','sans-serif'] },
  boxShadow: { fluent:'0 1px 3px rgba(26,28,24,.08), 0 4px 16px rgba(26,28,24,.06)' } } } };
</script>
<style>
  body{background:#eef2e9;}
  .acrylic{background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .tab-btn.active{background:#405936;color:#fff;}
  th{font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.02em;}
</style>
</head>
<body class="font-body text-ink">
<header class="acrylic sticky top-0 z-20 border-b border-borde shadow-fluent">
  <div class="max-w-[1400px] mx-auto px-4 py-3 flex items-center gap-3">
    <h1 class="font-disp text-2xl font-bold text-verde">COMPRAS</h1>
    <span class="text-sm text-ink/60">Apidelta</span>
    <a href="/" class="ml-auto text-sm text-verde hover:text-verdeHover">← Inicio</a>
  </div>
  <nav class="max-w-[1400px] mx-auto px-4 pb-2 flex gap-1 flex-wrap">
    <button class="tab-btn active px-4 py-2 rounded-lg font-disp text-lg border border-borde" data-tab="listado">Listado</button>
    <button class="tab-btn px-4 py-2 rounded-lg font-disp text-lg border border-borde" data-tab="proveedores">Proveedores</button>
    <button class="tab-btn px-4 py-2 rounded-lg font-disp text-lg border border-borde" data-tab="carrito">Carrito <span id="cartBadge" class="hidden ml-1 px-2 rounded-full bg-amarillo text-ink text-xs">0</span></button>
    <button class="tab-btn px-4 py-2 rounded-lg font-disp text-lg border border-borde" data-tab="presentaciones">Presentaciones</button>
    <button class="tab-btn px-4 py-2 rounded-lg font-disp text-lg border border-borde" data-tab="produccion">Producción</button>
    <button class="tab-btn px-4 py-2 rounded-lg font-disp text-lg border border-borde" data-tab="ordenes">Órdenes <span id="ordBadge" class="hidden ml-1 px-2 rounded-full bg-amarillo text-ink text-xs">0</span></button>
    <button class="tab-btn px-4 py-2 rounded-lg font-disp text-lg border border-borde" data-tab="prediccion">Predicción</button>
  </nav>
</header>
<main class="max-w-[1400px] mx-auto px-4 py-5">
  <section id="tab-listado" class="tab-panel">
    <div class="flex gap-2 mb-3 items-center flex-wrap">
      <input id="buscarListado" placeholder="Buscar producto…" class="px-3 py-2 rounded-lg border border-borde w-64">
      <select id="filtroTipo" class="px-3 py-2 rounded-lg border border-borde">
        <option value="">Almacén y pesables</option>
        <option value="almacen">Sólo almacén</option>
        <option value="pesable">Sólo pesables</option>
      </select>
      <label class="text-sm flex items-center gap-1"><input type="checkbox" id="soloSugerido"> Solo con sugerido &gt; 0</label>
      <span id="listadoCount" class="ml-auto text-sm text-ink/60"></span>
    </div>
    <div class="overflow-x-auto rounded-xl border border-borde shadow-fluent bg-card">
      <table class="w-full text-sm">
        <thead class="bg-verde/5 text-verde"><tr>
          <th class="text-left p-2">Producto</th>
          <th class="p-2">Central</th><th class="p-2">Sucursales</th>
          <th class="p-2">Importancia</th><th class="p-2">Consumo/mes</th>
          <th class="p-2 bg-amarillo/30">Sugerido</th>
          <th class="p-2">Proveedor</th><th class="p-2">Últ. compra</th><th class="p-2"></th>
        </tr></thead>
        <tbody id="listadoBody"></tbody>
      </table>
    </div>
  </section>
  <section id="tab-proveedores" class="tab-panel hidden">
    <div class="flex gap-2 mb-3">
      <input id="buscarProv" placeholder="Buscar proveedor (mín. 2 letras)…" class="px-3 py-2 rounded-lg border border-borde w-80">
      <button id="btnBuscarProv" class="px-4 py-2 rounded-lg bg-verde text-white hover:bg-verdeHover font-disp">Buscar</button>
    </div>
    <div id="provResultados" class="space-y-4"></div>
  </section>
  <section id="tab-carrito" class="tab-panel hidden"></section>
  <section id="tab-presentaciones" class="tab-panel hidden"></section>
  <section id="tab-produccion" class="tab-panel hidden"></section>
  <section id="tab-ordenes" class="tab-panel hidden"></section>
  <section id="tab-prediccion" class="tab-panel hidden"></section>
</main>
<!-- Aviso genérico: reemplaza a alert(), que rompe el estilo del módulo y bloquea el hilo. -->
<div id="mAviso" class="hidden fixed inset-0 z-50 items-center justify-center bg-ink/40 p-4"
     role="dialog" aria-modal="true" aria-labelledby="mAvisoTitulo">
  <div class="bg-card rounded-xl shadow-fluent border border-borde w-full max-w-sm">
    <div class="px-5 py-3 border-b border-borde flex items-center gap-2">
      <h3 id="mAvisoTitulo" class="font-disp text-xl font-bold text-verde">Aviso</h3>
      <button id="mAvisoX" class="ml-auto text-ink/50 hover:text-ink text-lg leading-none" aria-label="Cerrar">✕</button>
    </div>
    <p id="mAvisoMsg" class="px-5 py-4 text-sm leading-relaxed"></p>
    <div class="px-5 py-3 border-t border-borde flex justify-end">
      <button id="mAvisoOk" class="px-4 py-2 rounded-lg bg-verde text-white hover:bg-verdeHover font-disp">Aceptar</button>
    </div>
  </div>
</div>
<!-- Códigos de seguimiento: alta y baja de los productos cuyos componentes se siguen. -->
<div id="mTracking" class="hidden fixed inset-0 z-50 items-center justify-center bg-ink/40 p-4"
     role="dialog" aria-modal="true" aria-labelledby="mTrackingTitulo">
  <div class="bg-card rounded-xl shadow-fluent border border-borde w-full max-w-2xl max-h-[85vh] flex flex-col">
    <div class="px-5 py-3 border-b border-borde flex items-center gap-2">
      <h3 id="mTrackingTitulo" class="font-disp text-xl font-bold text-verde">Códigos de seguimiento</h3>
      <button id="mTrackingX" class="ml-auto text-ink/50 hover:text-ink text-lg leading-none" aria-label="Cerrar">✕</button>
    </div>
    <div class="px-5 py-4 overflow-y-auto">
      <div class="flex gap-2 mb-3">
        <input id="prodBuscar" placeholder="Buscar por nombre o código…" class="flex-1 border border-borde rounded px-2 py-1">
        <button id="btnProdBuscar" class="px-4 py-1 rounded bg-verde text-white hover:bg-verdeHover font-disp">Buscar</button>
      </div>
      <div id="prodResultados" class="text-sm max-h-56 overflow-y-auto mb-4"></div>
      <h4 class="font-disp text-lg text-verde mb-1">En seguimiento (<span id="trackCount">0</span>)</h4>
      <div id="trackLista" class="text-sm"></div>
    </div>
    <div class="px-5 py-3 border-t border-borde flex justify-end">
      <button id="mTrackingOk" class="px-4 py-2 rounded-lg bg-verde text-white hover:bg-verdeHover font-disp">Listo</button>
    </div>
  </div>
</div>
<!-- Detalle de consumo de un producto: avisar() sólo muestra texto plano (textContent),
     así que el contenido rico usa su propio modal, igual que #mTracking. -->
<div id="mDetallePlu" class="hidden fixed inset-0 z-50 items-center justify-center bg-ink/40 p-4"
     role="dialog" aria-modal="true" aria-labelledby="mDetallePluTitulo">
  <div class="bg-card rounded-xl shadow-fluent border border-borde w-full max-w-2xl max-h-[85vh] flex flex-col">
    <div class="px-5 py-3 border-b border-borde flex items-center gap-2">
      <h3 id="mDetallePluTitulo" class="font-disp text-xl font-bold text-verde">Detalle de consumo</h3>
      <button id="mDetallePluX" class="ml-auto text-ink/50 hover:text-ink text-lg leading-none" aria-label="Cerrar">✕</button>
    </div>
    <div id="mDetallePluCuerpo" class="px-5 py-4 overflow-y-auto text-sm"></div>
    <div class="px-5 py-3 border-t border-borde flex justify-end">
      <button id="mDetallePluOk" class="px-4 py-2 rounded-lg bg-verde text-white hover:bg-verdeHover font-disp">Listo</button>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const fmt = n => n == null ? '—' : (Math.round(n*100)/100).toLocaleString('es-AR');
const money = n => n == null ? '—' : '$'+Math.round(n).toLocaleString('es-AR');
const carrito = new Map();  // plu -> { plu, nombre, cantidad, proveedor, costoUnit, unidadesPorBulto }
let listadoData = [], presentaciones = {};
let trackingActual = [];   // productos seguidos en la pestaña Producción (se edita desde su modal)

// ---- Aviso ----
// Reemplazo de alert(): devuelve una promesa que resuelve al cerrarse, así el llamador puede
// encadenar igual que con el diálogo nativo. El mensaje va por textContent y nunca por innerHTML:
// suele venir de un `error` del server y no se interpola markup de una respuesta.
let avisoResolver = null;
function avisar(msg, titulo) {
  $('#mAvisoTitulo').textContent = titulo || 'Aviso';
  $('#mAvisoMsg').textContent = String(msg == null ? '' : msg);
  $('#mAviso').classList.remove('hidden');
  $('#mAviso').classList.add('flex');
  $('#mAvisoOk').focus();
  return new Promise(res => { avisoResolver = res; });
}
function cerrarAviso() {
  $('#mAviso').classList.add('hidden');
  $('#mAviso').classList.remove('flex');
  // Se limpia antes de resolver: si el handler vuelve a abrir el aviso, no se pisa el resolver nuevo.
  const resolver = avisoResolver;
  avisoResolver = null;
  if (resolver) resolver();
}
$('#mAvisoOk').addEventListener('click', cerrarAviso);
$('#mAvisoX').addEventListener('click', cerrarAviso);
$('#mAviso').addEventListener('click', e => { if (e.target === $('#mAviso')) cerrarAviso(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#mAviso').classList.contains('hidden')) cerrarAviso();
  else if (!$('#mTracking').classList.contains('hidden')) cerrarTracking();
  else if (!$('#mDetallePlu').classList.contains('hidden')) cerrarDetallePlu();
});

// ---- Fetch con manejo de sesión ----
// Si la sesión venció, la API responde 401 {"error":"No autenticado"}. Sin este manejo
// las vistas rompían con "can't access property length, r.proveedores is undefined".
async function apiFetch(url, opts) {
  const res = await fetch(url, opts);
  let datos = null;
  try { datos = await res.json(); } catch (e) { datos = null; }
  if (res.status === 401 || res.status === 403) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
    throw new Error('Sesión expirada');
  }
  if (!res.ok || (datos && datos.error)) {
    throw new Error((datos && datos.error) || ('Error ' + res.status));
  }
  return datos || {};
}

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  $('#tab-'+btn.dataset.tab).classList.remove('hidden');
  if (btn.dataset.tab === 'carrito') renderCarrito();
  if (btn.dataset.tab === 'presentaciones') cargarPresentaciones();
  if (btn.dataset.tab === 'produccion') cargarProduccion();
  // Se recarga al entrar para ver el estado real de las órdenes, que cambia desde otras sesiones.
  if (btn.dataset.tab === 'ordenes') cargarOrdenes();
  if (btn.dataset.tab === 'prediccion') cargarPrediccion();
}));

// ---- Listado ----
async function cargarListado() {
  try {
    const [lst, pres] = await Promise.all([
      apiFetch('/api/compras-modulo/listado'),
      apiFetch('/api/compras-modulo/presentaciones'),
    ]);
    listadoData = lst.productos || []; presentaciones = pres || {};
    renderListado();
  } catch (e) {
    $('#listadoBody').innerHTML = `<tr><td colspan="9" class="p-4 text-center text-rojo">No se pudo cargar el listado: ${escAttr(e.message)}</td></tr>`;
  }
}
function renderListado() {
  const q = $('#buscarListado').value.toLowerCase();
  const solo = $('#soloSugerido').checked;
  const tipo = $('#filtroTipo').value;
  const rows = listadoData.filter(p =>
    (!q || p.nombre.toLowerCase().includes(q) || p.plu.includes(q)) &&
    (!solo || p.sugerido > 0) &&
    (!tipo || p.tipo === tipo));
  $('#listadoCount').textContent = rows.length + ' productos';
  $('#listadoBody').innerHTML = rows.map(p => {
    // En pesables el stock de sucursal viene en `fraccionado` (kg equivalentes) y `stkSuc` llega vacío.
    const sucTotal = p.tipo === 'pesable'
      ? (p.fraccionado || 0)
      : Object.values(p.stkSuc || {}).reduce((s,v) => s + (Number(v)||0), 0);
    const sugClass = p.sugerido > 0 ? 'font-bold text-verde' : 'text-ink/40';
    // La importancia es el percentil de facturación de A8020 (0 a 1).
    const imp = p.importancia == null ? '·'
      : `<span class="px-2 py-0.5 rounded text-xs ${p.importancia>=0.8?'bg-verde text-white':p.importancia>=0.5?'bg-amarillo text-ink':'bg-ink/10 text-ink/60'}">${p.importancia.toFixed(2)}</span>`;
    const plu = escAttr(p.plu), pluJs = escJs(p.plu);
    return `<tr class="border-t border-borde hover:bg-verde/5">
      <td class="p-2 text-left"><button class="text-verde hover:underline" onclick="abrirDetallePlu('${pluJs}')">${escAttr(p.nombre)}</button>
        <span class="text-xs text-ink/40 ml-1">${plu}${p.tipo==='pesable'?' · granel':''}</span></td>
      <td class="p-2 text-center">${fmt(p.central)}</td>
      <td class="p-2 text-center">${fmt(sucTotal)}</td>
      <td class="p-2 text-center">${imp}</td>
      <td class="p-2 text-center">${p.consumoMensual==null?'·':fmt(p.consumoMensual)}</td>
      <td class="p-2 text-center ${sugClass}">${fmt(p.sugerido)}</td>
      <td class="p-2 text-left text-xs">${p.proveedor?escAttr(p.proveedor):'·'}${p.costo?`<div class="text-ink/50">${money(p.costo)}</div>`:''}</td>
      <td class="p-2 text-center text-xs">${p.ultimaCompraFecha?escAttr(p.ultimaCompraFecha):'·'}${p.ultimaCompraCantidad?`<div class="text-ink/50">${fmt(p.ultimaCompraCantidad)}u</div>`:''}</td>
      <td class="p-2 text-center"><button class="px-2 py-1 rounded bg-verde text-white text-xs hover:bg-verdeHover" onclick="addCarrito('${pluJs}')">+ carrito</button></td>
    </tr>`;
  }).join('');
}
$('#buscarListado').addEventListener('input', renderListado);
$('#soloSugerido').addEventListener('change', renderListado);
$('#filtroTipo').addEventListener('change', renderListado);

// ---- Carrito (agregar) ----
function addCarrito(plu) {
  const p = listadoData.find(x => x.plu === plu); if (!p) return;
  const uxb = (presentaciones[plu]||{}).unidadesPorBulto || null;
  const base = p.sugerido > 0 ? p.sugerido : 1;
  const cantidad = uxb ? Math.ceil(base/uxb)*uxb : base;
  carrito.set(plu, { plu, nombre: p.nombre, cantidad, proveedor: p.proveedor, costoUnit: p.costo || 0, unidadesPorBulto: uxb });
  actualizarBadge();
}
function actualizarBadge(){ const b=$('#cartBadge'); b.textContent=carrito.size; b.classList.toggle('hidden', carrito.size===0); }

// ---- Proveedores ----
async function buscarProveedores() {
  const q = $('#buscarProv').value.trim();
  if (q.length < 2) { $('#provResultados').innerHTML = '<p class="text-ink/60">Escribí al menos 2 letras.</p>'; return; }
  $('#provResultados').innerHTML = '<p class="text-ink/60">Buscando…</p>';
  let r;
  try { r = await apiFetch('/api/compras-modulo/proveedores/buscar?q='+encodeURIComponent(q)); }
  catch (e) { $('#provResultados').innerHTML = `<p class="text-rojo">No se pudo buscar: ${e.message}</p>`; return; }
  const proveedores = r.proveedores || [];
  if (!proveedores.length) { $('#provResultados').innerHTML = '<p class="text-ink/60">Sin resultados.</p>'; return; }
  $('#provResultados').innerHTML = proveedores.map(p => `
    <div class="rounded-xl border border-borde bg-card shadow-fluent p-4">
      <h3 class="font-disp text-xl text-verde">${p.proveedor} <span class="text-sm text-ink/50">(${p.cantProductos} productos)</span></h3>
      <div class="overflow-x-auto mt-2"><table class="w-full text-sm">
        <thead class="text-verde"><tr><th class="text-left p-1">Producto</th><th class="p-1">PLU</th><th class="p-1">Precio</th><th class="p-1">Fecha</th></tr></thead>
        <tbody>${p.productos.map(x=>`<tr class="border-t border-borde"><td class="p-1 text-left">${x.nombre}</td><td class="p-1 text-center">${x.plu}</td><td class="p-1 text-center">${money(x.precio)}</td><td class="p-1 text-center">${x.fecha||'—'}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`).join('');
}
$('#btnBuscarProv').addEventListener('click', buscarProveedores);
$('#buscarProv').addEventListener('keydown', e => { if (e.key === 'Enter') buscarProveedores(); });

// ---- Carrito (render + cobertura + orden) ----
async function renderCarrito() {
  const panel = $('#tab-carrito');
  if (!carrito.size) { panel.innerHTML = '<p class="text-ink/60">Carrito vacío. Agregá productos desde el Listado.</p>'; return; }
  const items = [...carrito.values()];
  const filas = items.map(it => `
    <tr class="border-t border-borde">
      <td class="p-2 text-left">${it.nombre}${it.unidadesPorBulto?`<span class="ml-1 text-xs text-ok">bulto x${it.unidadesPorBulto}</span>`:`<span class="ml-1 text-xs text-naranja cursor-pointer" onclick="irPresentacion('${it.plu}')">sin bulto ⚠</span>`}</td>
      <td class="p-2 text-center"><input type="number" min="0" value="${it.cantidad}" class="w-20 border border-borde rounded px-1 text-center" onchange="setCant('${it.plu}', this.value)"></td>
      <td class="p-2 text-center text-xs">${it.proveedor||'—'}</td>
      <td class="p-2 text-center">${money(it.costoUnit)}</td>
      <td class="p-2 text-center">${money(it.cantidad*it.costoUnit)}</td>
      <td class="p-2 text-center"><button class="text-rojo" onclick="delCarrito('${it.plu}')">✕</button></td>
    </tr>`).join('');
  const total = items.reduce((s,it)=>s+it.cantidad*it.costoUnit,0);
  let cob;
  try { cob = await apiFetch('/api/compras-modulo/carrito/cobertura', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})}); }
  catch (e) { cob = { cobertura: [] }; }
  const cobHtml = (cob.cobertura || []).map(c => `
    <div class="rounded-lg border border-borde p-3 flex items-center gap-3">
      <div class="flex-1"><b>${c.proveedor}</b> · cubre ${c.itemsCubiertos}/${c.totalItems} ítems · ${money(c.costoTotal)}</div>
      <button class="px-3 py-1 rounded bg-verde text-white text-sm hover:bg-verdeHover" onclick="generarOrden('${c.proveedor.replace(/'/g,"\\'")}')">Generar orden</button>
    </div>`).join('');
  panel.innerHTML = `
    <div class="overflow-x-auto rounded-xl border border-borde bg-card shadow-fluent mb-4"><table class="w-full text-sm">
      <thead class="text-verde"><tr><th class="text-left p-2">Producto</th><th class="p-2">Cantidad</th><th class="p-2">Proveedor</th><th class="p-2">Costo u.</th><th class="p-2">Subtotal</th><th></th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr class="border-t-2 border-verde font-bold"><td class="p-2 text-right" colspan="4">Total</td><td class="p-2 text-center">${money(total)}</td><td></td></tr></tfoot>
    </table></div>
    <h3 class="font-disp text-xl text-verde mb-2">Cobertura por proveedor</h3>
    <div class="space-y-2">${cobHtml}</div>`;
}
function setCant(plu,v){ const it=carrito.get(plu); if(it){ it.cantidad=Math.max(0,Number(v)||0); renderCarrito(); } }
function delCarrito(plu){ carrito.delete(plu); actualizarBadge(); renderCarrito(); }
function irPresentacion(plu){ document.querySelector('.tab-btn[data-tab="presentaciones"]').click(); setTimeout(()=>{ const i=$('#presPlu'); if(i){i.value=plu; i.focus();} },50); }
async function generarOrden(proveedor) {
  const items = [...carrito.values()].filter(it => it.proveedor === proveedor)
    .map(it => ({ plu: it.plu, nombre: it.nombre, cantidad: it.cantidad, costoUnit: it.costoUnit }));
  if (!items.length) return;
  try {
    const r = await apiFetch('/api/compras-modulo/ordenes', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proveedor,items})});
    if (!r.ok) throw new Error('respuesta inesperada del servidor');
    imprimirOrden(r.orden); items.forEach(it => carrito.delete(it.plu)); actualizarBadge(); renderCarrito();
  } catch (e) {
    avisar('No se pudo generar la orden: '+e.message, 'Error');
  }
}
function imprimirOrden(orden) {
  const w = window.open('', '_blank');
  w.document.write(`<html><head><title>Orden ${orden.id}</title>
    <style>body{font-family:Roboto,sans-serif;padding:24px;color:#1a1c18}h1{color:#405936;font-family:'Barlow Condensed',sans-serif}
    table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #c3c9bc;padding:6px;text-align:left}
    th{background:#eef2e9}tfoot td{font-weight:bold}@media print{button{display:none}}</style></head><body>
    <h1>ORDEN DE PEDIDO</h1>
    <p><b>Proveedor:</b> ${orden.proveedor}<br><b>Fecha:</b> ${orden.fecha}<br><b>N°:</b> ${orden.id}</p>

        <div class="text-sm max-h-40 overflow-y-auto">${sinBulto.map(p=>`<div class="flex justify-between border-b border-borde py-1"><span>${p.nombre}</span><button class="text-verde text-xs" onclick="prefillPres('${p.plu}')">cargar</button></div>`).join('')||'<span class="text-ink/50">Todos tienen bulto.</span>'}</div>
      </div>
      <div class="rounded-xl border border-borde bg-card shadow-fluent p-4">
        <h3 class="font-disp text-xl text-verde mb-2">Cargadas (${cargadas.length})</h3>
        <div class="text-sm max-h-96 overflow-y-auto">${cargadas.map(([plu,v])=>{

}
function prefillPres(plu){ $('#presPlu').value=plu; $('#presUxb').focus(); }
async function guardarPres() {
  const plu=$('#presPlu').value.trim(), uxb=Number($('#presUxb').value), nombreBulto=$('#presNombre').value.trim();
  if (!plu || !(uxb>0)) { avisar('Cargá el PLU y las unidades por bulto (mayor a 0).', 'Faltan datos'); return; }
  try {
    const r = await apiFetch('/api/compras-modulo/presentaciones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plu,unidadesPorBulto:uxb,nombreBulto})});
    if (!r.ok) throw new Error('respuesta inesperada del servidor');
    presentaciones=r.presentaciones; cargarPresentaciones();
  } catch (e) {
    avisar('No se pudo guardar la presentación: '+e.message, 'Error');
  }
}
async function delPres(plu){
  try {
    const r = await apiFetch('/api/compras-modulo/presentaciones/'+encodeURIComponent(plu),{method:'DELETE'});
    if (r.ok){ presentaciones=r.presentaciones; cargarPresentaciones(); }
  } catch (e) {
    avisar('No se pudo borrar la presentación: '+e.message, 'Error');
  }
}

// ---- Producción ----
// El tracking lo arma el usuario: elige qué productos se producen y la tabla muestra los
// componentes de la fórmula activa de cada uno, sumarizados (un componente aparece una sola vez).
async function cargarProduccion() {
  const panel = $('#tab-produccion');
  panel.innerHTML = '<p class="text-ink/60">Cargando…</p>';
  let r;
  try { r = await apiFetch('/api/compras-modulo/produccion-deficit'); }
  catch (e) { panel.innerHTML = `<p class="text-rojo">No se pudo cargar: ${e.message}</p>`; return; }
  const seguidos = r.productos || [];
  trackingActual = seguidos;
  const comps = r.componentes || [];
  const tabla = comps.length ? `
    <div class="overflow-x-auto rounded-xl border border-borde bg-card shadow-fluent"><table class="w-full text-sm">
      <thead class="text-verde"><tr><th class="text-left p-2">Componente</th><th class="p-2">Stock central</th><th class="p-2">Consumo x unidad</th><th class="p-2 bg-amarillo/30">Déficit</th><th class="p-2">Proveedor</th><th class="text-left p-2">Usado por</th></tr></thead>
      <tbody>${comps.map(c=>`<tr class="border-t border-borde hover:bg-verde/5">
        <td class="p-2 text-left">${c.nombre} <span class="text-xs text-ink/40">${c.plu}</span></td>
        <td class="p-2 text-center">${fmt(c.stock)}</td><td class="p-2 text-center">${fmt(c.consumoProyectado)}</td>
        <td class="p-2 text-center font-bold ${c.deficit>0?'text-rojo':'text-ink/40'}">${fmt(c.deficit)}</td>
        <td class="p-2 text-center text-xs">${c.proveedor||'—'}</td>
        <td class="p-2 text-left text-xs text-ink/60">${(c.usadoPor||[]).join(', ')}</td></tr>`).join('')}</tbody>
    </table></div>`
    : `<p class="text-ink/60">${seguidos.length ? 'Los productos seguidos no tienen componentes en su fórmula activa.' : 'Agregá productos para ver sus componentes.'}</p>`;
  panel.innerHTML = `
    <div class="flex items-center gap-3 mb-3">
      <button id="btnVerTracking" class="px-4 py-2 rounded-lg bg-verde text-white hover:bg-verdeHover font-disp">Ver códigos de seguimiento</button>
      <span class="text-sm text-ink/60">${seguidos.length} producto${seguidos.length===1?'':'s'} en seguimiento · ${comps.length} componentes distintos</span>
    </div>
    ${tabla}`;
  $('#btnVerTracking').addEventListener('click', abrirTracking);
}

// ---- Modal de códigos de seguimiento ----
function abrirTracking() {
  renderTrackingLista();
  $('#prodResultados').innerHTML = '';
  $('#prodBuscar').value = '';
  $('#mTracking').classList.remove('hidden');
  $('#mTracking').classList.add('flex');
  $('#prodBuscar').focus();
}
function cerrarTracking() {
  $('#mTracking').classList.add('hidden');
  $('#mTracking').classList.remove('flex');
  cargarProduccion();   // la tabla de componentes refleja las altas y bajas hechas en el modal
}
function renderTrackingLista() {
  $('#trackCount').textContent = trackingActual.length;
  $('#trackLista').innerHTML = trackingActual.length
    ? trackingActual.map(p => `<div class="flex justify-between items-center border-b border-borde py-1">
        <span>${p.nombre} <span class="text-xs text-ink/40">${p.plu}</span></span>
        <button class="text-rojo text-xs js-del-track" data-plu="${escAttr(p.plu)}">✕ quitar</button></div>`).join('')
    : '<span class="text-ink/50">Todavía no seguís ningún producto.</span>';
  $('#trackLista').querySelectorAll('.js-del-track').forEach(b =>
    b.addEventListener('click', () => delTracking(b.dataset.plu)));
}
$('#mTrackingX').addEventListener('click', cerrarTracking);
$('#mTrackingOk').addEventListener('click', cerrarTracking);
$('#mTracking').addEventListener('click', e => { if (e.target === $('#mTracking')) cerrarTracking(); });
$('#btnProdBuscar').addEventListener('click', buscarProducible);
$('#prodBuscar').addEventListener('keydown', e => { if (e.key === 'Enter') buscarProducible(); });
async function buscarProducible() {
  const q = $('#prodBuscar').value.trim();
  const cont = $('#prodResultados');
  if (q.length < 2) { cont.innerHTML = '<span class="text-ink/60">Escribí al menos 2 letras.</span>'; return; }
  cont.innerHTML = '<span class="text-ink/60">Buscando…</span>';
  let r;
  try { r = await apiFetch('/api/compras-modulo/productos-producibles?q='+encodeURIComponent(q)); }
  catch (e) { cont.innerHTML = `<span class="text-rojo">No se pudo buscar: ${e.message}</span>`; return; }
  const productos = r.productos || [];
  if (!productos.length) { cont.innerHTML = '<span class="text-ink/60">Sin resultados.</span>'; return; }
  // Los nombres de SIGA traen comillas: se pasan por data-* y no interpolados en un onclick.
  cont.innerHTML = productos.map(p => `<div class="flex justify-between items-center border-b border-borde py-1">
    <span>${p.nombre} <span class="text-xs text-ink/40">${p.plu}</span></span>
    <button class="text-verde text-xs js-add-track" data-plu="${p.plu}" data-nombre="${escAttr(p.nombre)}">+ seguir</button></div>`).join('');
  cont.querySelectorAll('.js-add-track').forEach(b =>
    b.addEventListener('click', () => addTracking(b.dataset.plu, b.dataset.nombre)));
}
function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
// Para valores que van dentro de un literal JS entre comillas simples en un onclick="…":
// primero se escapa a nivel JS (el navegador decodifica las entidades antes de parsear el script)
// y después a nivel HTML, así una comilla en el dato no rompe el handler.
function escJs(s) { return escAttr(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
// Alta y baja actualizan la lista del modal sin cerrarlo; la tabla de componentes se recalcula al salir.
async function addTracking(plu, nombre) {
  try {
    const r = await apiFetch('/api/compras-modulo/tracking-produccion', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plu,nombre})});
    trackingActual = r.productos || trackingActual;
    renderTrackingLista();
  } catch (e) { avisar('No se pudo agregar al seguimiento: '+e.message, 'Error'); }
}
async function delTracking(plu) {
  try {
    const r = await apiFetch('/api/compras-modulo/tracking-produccion/'+encodeURIComponent(plu), {method:'DELETE'});
    trackingActual = r.productos || trackingActual;
    renderTrackingLista();
  } catch (e) { avisar('No se pudo quitar del seguimiento: '+e.message, 'Error'); }
}

// ── Órdenes de compra: seguimiento hasta la recepción ────────────────────────
// Cada estado define su color y qué transiciones puede ofrecer la UI. El backend
// revalida la máquina de estados: acá sólo escondemos los botones que no aplican.
const ORD_ESTADOS = {
  GENERADA: { label: 'Generada', cls: 'bg-gray-200 text-gray-800', acciones: [['ENVIADA','Marcar enviada'],['ANULADA','Anular']] },
  ENVIADA:  { label: 'Enviada',  cls: 'bg-amarillo text-ink',      acciones: [['RECIBIDA','Marcar recibida'],['ANULADA','Anular']] },
  RECIBIDA: { label: 'Recibida', cls: 'bg-verde text-white',       acciones: [] },
  ANULADA:  { label: 'Anulada',  cls: 'bg-red-200 text-red-900',   acciones: [] },
};
let ordenes = [], ordFiltro = '', ordEstadoSel = '';
const hoyISO = () => new Date().toISOString().slice(0,10);
// Atrasada = prometida para antes de hoy y todavía sin recibir. Es el punto del seguimiento.
const ordAtrasada = (o) => o.estado === 'ENVIADA' && o.fechaEstimada && o.fechaEstimada < hoyISO();

async function cargarOrdenes() {
  const panel = $('#tab-ordenes');
  panel.innerHTML = '<p class="text-muted">Cargando…</p>';
  try {
    ordenes = await apiFetch('/api/compras-modulo/ordenes' + (ordEstadoSel ? '?estado='+ordEstadoSel : ''));
    renderOrdenes();
  } catch (e) {
    panel.innerHTML = `<p class="text-red-700">${e.message}</p>`;
  }
}

function renderOrdenes() {
  const panel = $('#tab-ordenes');
  const q = ordFiltro.trim().toLowerCase();
  // El filtro de texto es local: el de estado sí vuelve al servidor porque acota el listado.
  const rows = ordenes.filter(o => !q
    || (o.proveedor||'').toLowerCase().includes(q)
    || (o.items||[]).some(it => String(it.plu).includes(q)));
  const atrasadas = ordenes.filter(ordAtrasada).length;
  const badge = $('#ordBadge');
  badge.textContent = atrasadas; badge.classList.toggle('hidden', atrasadas === 0);
  panel.innerHTML = `
    <div class="flex gap-2 items-center mb-3">
      <input id="ordQ" class="border border-borde rounded px-3 py-1 flex-1" placeholder="Proveedor o PLU" value="${ordFiltro.replace(/"/g,'&quot;')}">
      <select id="ordEstado" class="border border-borde rounded px-3 py-1">
        <option value="">Todos los estados</option>
        ${Object.keys(ORD_ESTADOS).map(e=>`<option value="${e}" ${ordEstadoSel===e?'selected':''}>${ORD_ESTADOS[e].label}</option>`).join('')}
      </select>
      ${atrasadas ? `<span class="text-red-700 font-semibold">${atrasadas} atrasada(s)</span>` : ''}
    </div>
    <table class="w-full text-sm">
      <thead><tr class="text-left border-b border-borde">
        <th class="py-2">Fecha</th><th>Proveedor</th><th class="text-right">Items</th>
        <th class="text-right">Total</th><th>Estado</th><th>Estimada</th><th></th>
      </tr></thead>
      <tbody>${rows.map(filaOrden).join('') || '<tr><td colspan="7" class="py-3 text-muted">Sin órdenes</td></tr>'}</tbody>
    </table>`;
  $('#ordQ').addEventListener('input', e => { ordFiltro = e.target.value; renderOrdenes(); });
  $('#ordEstado').addEventListener('change', e => { ordEstadoSel = e.target.value; cargarOrdenes(); });
}

function filaOrden(o) {
  // Una orden con estado desconocido se muestra como GENERADA para no romper la tabla.
  const est = ORD_ESTADOS[o.estado] || ORD_ESTADOS.GENERADA;
  const atrasada = ordAtrasada(o);
  const acciones = est.acciones.map(([e,txt]) =>
    `<button class="px-2 py-1 rounded border border-borde text-xs hover:bg-gray-100" onclick="cambiarEstadoOrden(${o.id},'${e}')">${txt}</button>`).join(' ');
  return `<tr class="border-b border-borde ${atrasada ? 'bg-red-50' : ''}">
    <td class="py-2">${o.fecha||''}</td>
    <td>${o.proveedor||''}</td>
    <td class="text-right">${(o.items||[]).length}</td>
    <td class="text-right">$${(o.total||0).toLocaleString('es-AR')}</td>
    <td><span class="px-2 py-1 rounded text-xs ${est.cls}">${est.label}</span></td>
    <td class="${atrasada ? 'text-red-700 font-semibold' : ''}">${o.fechaEstimada||'·'}</td>
    <td class="text-right whitespace-nowrap">${acciones}</td>
  </tr>`;
}

async function cambiarEstadoOrden(id, estado) {
  let nota = null;
  if (estado === 'ANULADA') {
    // La anulación es irreversible: pedimos motivo para que quede en el historial.
    nota = prompt('Motivo de la anulación (opcional):');
    if (nota === null) return;   // canceló el prompt
  }
  try {
    await apiFetch(`/api/compras-modulo/ordenes/${id}/estado`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estado, nota }),
    });
    await cargarOrdenes();
  } catch (e) { avisar(e.message, 'Error'); }
}

      <div><b>Consumo promedio mensual:</b> ${d.consumoMensual == null ? 'sin calcular' : fmt(d.consumoMensual)}
        <div class="text-xs text-ink/60">ventana ${fmt(d.ventanaMeses)} meses</div></div>
      <div><b>Consumo por sucursal (total de la ventana):</b><div class="text-xs">${porSuc}</div></div>
      ${origenes ? `<div><b>Origen del consumo:</b><div class="text-xs">${origenes}</div></div>` : ''}
      ${filasPres ? `<div><b>Presentaciones que consumen de este granel:</b>
        <table class="w-full text-xs mt-1"><thead><tr class="text-ink/60">

      ${filasUsadoEn ? `<div><b>Usado en otros productos:</b>

          <tbody>${filasUsadoEn}</tbody></table></div>` : ''}
    </div>`;
}

// ── Predicción de compra ─────────────────────────────────────────────────────
// La serie mensual de consumo se recalcula aparte (consulta pesada a Siga, tarda
// minutos): esta pestaña sólo la lee y proyecta sobre el horizonte elegido.
const PRED_ESTADOS = {
  CRITICO: { label: 'Crítico', cls: 'bg-rojo text-white' },
  COMPRAR: { label: 'Comprar', cls: 'bg-amarillo text-ink' },
  OK:      { label: 'OK',      cls: 'bg-ok text-white' },
  EXCESO:  { label: 'Exceso',  cls: 'bg-ink/20 text-ink/60' },
};
let predData = null;         // última respuesta del endpoint
let predDias = 30;           // horizonte elegido
let predEstadoSel = '';      // filtro por estado
let predQ = '';              // buscador por nombre o PLU
let predRecalculando = false; // bloquea el botón mientras corre la consulta a Siga

async function cargarPrediccion() {
  const panel = $('#tab-prediccion');
  panel.innerHTML = '<p class="text-ink/60">Cargando…</p>';
  try {
    predData = await apiFetch('/api/compras-modulo/prediccion?dias=' + encodeURIComponent(predDias));
  } catch (e) {
    predData = null;
    panel.innerHTML = `<p class="text-rojo">No se pudo cargar la predicción: ${escAttr(e.message)}</p>`;
    return;
  }
  renderPrediccion();
}

function barraPrediccion() {
  const opciones = [15, 30, 45, 60]
    .map(d => `<option value="${d}"${d === predDias ? ' selected' : ''}>${d} días</option>`).join('');
  const serie = predData && predData.timestampSerie
    ? `Serie del ${escAttr(predData.timestampSerie)}`
    : 'Sin serie calculada';
  return `<div class="flex gap-2 mb-3 items-center flex-wrap">
    <label class="text-sm text-ink/70">Horizonte</label>
    <select id="predDias" class="px-3 py-2 rounded-lg border border-borde">${opciones}</select>
    <button id="btnRecalcSerie" class="px-4 py-2 rounded-lg font-disp ${predRecalculando ? 'bg-ink/20 text-ink/50 cursor-not-allowed' : 'bg-verde text-white hover:bg-verdeHover'}"${predRecalculando ? ' disabled' : ''}>${predRecalculando ? 'Recalculando…' : 'Recalcular serie mensual'}</button>
    <span class="text-xs text-ink/50">${predRecalculando ? 'Consultando Siga, puede tardar varios minutos…' : serie}</span>
  </div>`;
}

function renderPrediccion() {
  const panel = $('#tab-prediccion');
  if (!predData) { panel.innerHTML = ''; return; }
  if (predData.vacio) {
    panel.innerHTML = barraPrediccion() +
      '<p class="text-ink/60">Todavía no hay serie mensual de consumo. Usá “Recalcular serie mensual” para generarla (tarda varios minutos).</p>';
    engancharPrediccion();
    return;
  }
  const q = predQ.trim().toLowerCase();
  const rows = (predData.productos || []).filter(p =>
    (!predEstadoSel || p.estado === predEstadoSel) &&
    (!q || String(p.nombre || '').toLowerCase().includes(q) || String(p.plu).includes(q)));
  const filtros = `<div class="flex gap-2 mb-3 items-center flex-wrap">
    <input id="predQ" placeholder="Buscar por nombre o PLU…" class="px-3 py-2 rounded-lg border border-borde w-64" value="${escAttr(predQ)}">
    <select id="predEstado" class="px-3 py-2 rounded-lg border border-borde">
      <option value="">Todos los estados</option>
      ${Object.keys(PRED_ESTADOS).map(e => `<option value="${e}"${predEstadoSel === e ? ' selected' : ''}>${PRED_ESTADOS[e].label}</option>`).join('')}
    </select>
    <span class="ml-auto text-sm text-ink/60">${rows.length} de ${(predData.productos || []).length} productos · horizonte ${fmt(predData.dias)} días</span>
  </div>`;
  const cuerpo = rows.map(filaPrediccion).join('')
    || '<tr><td colspan="11" class="p-4 text-center text-ink/60">Sin productos para este filtro.</td></tr>';
  panel.innerHTML = barraPrediccion() + filtros + `
    <div class="overflow-x-auto rounded-xl border border-borde shadow-fluent bg-card">
      <table class="w-full text-sm">
        <thead class="bg-verde/5 text-verde"><tr>
          <th class="text-left p-2">Producto</th>
          <th class="p-2">μ diario</th><th class="p-2">Estacional</th><th class="p-2">Proyección</th>
          <th class="p-2">Seguridad</th><th class="p-2">Stock</th><th class="p-2">Pendiente</th>
          <th class="p-2 bg-amarillo/30">Necesidad</th><th class="p-2">Estado</th>
          <th class="p-2">Proveedor</th><th class="p-2">Lead time</th>
        </tr></thead>
        <tbody>${cuerpo}</tbody>
      </table>
    </div>`;
  engancharPrediccion();
}

function filaPrediccion(p) {
  // Un estado desconocido se muestra como OK para no romper la tabla.
  const est = PRED_ESTADOS[p.estado] || PRED_ESTADOS.OK;
  const necClass = p.necesidad > 0 ? 'font-bold text-verde' : 'text-ink/40';
  const plu = escAttr(p.plu), pluJs = escJs(p.plu);
  return `<tr class="border-t border-borde hover:bg-verde/5">
    <td class="p-2 text-left"><button class="text-verde hover:underline" onclick="abrirDetallePlu('${pluJs}')">${escAttr(p.nombre)}</button>
      <span class="text-xs text-ink/40 ml-1">${plu}${p.tipo === 'pesable' ? ' · granel' : ''}${p.abc ? ' · ' + escAttr(p.abc) : ''}</span></td>
    <td class="p-2 text-center">${fmt(p.muDiario)}</td>
    <td class="p-2 text-center">${p.estacional == null ? '·' : '×' + fmt(p.estacional)}</td>
    <td class="p-2 text-center">${fmt(p.proyeccion)}</td>
    <td class="p-2 text-center">${fmt(p.seguridad)}</td>
    <td class="p-2 text-center">${fmt(p.stock)}</td>
    <td class="p-2 text-center">${fmt(p.pendiente)}</td>
    <td class="p-2 text-center ${necClass}">${fmt(p.necesidad)}</td>
    <td class="p-2 text-center"><span class="px-2 py-0.5 rounded text-xs ${est.cls}">${est.label}</span></td>
    <td class="p-2 text-left text-xs">${p.proveedor ? escAttr(p.proveedor) : '·'}${p.costo ? `<div class="text-ink/50">${money(p.costo)}</div>` : ''}</td>
    <td class="p-2 text-center text-xs">${p.leadTimeDias == null ? '·' : fmt(p.leadTimeDias) + ' d'}</td>
  </tr>`;
}

// El panel se redibuja entero, así que los listeners se vuelven a enganchar acá.
function engancharPrediccion() {
  const sel = $('#predDias');
  if (sel) sel.addEventListener('change', e => { predDias = Number(e.target.value) || 30; cargarPrediccion(); });
  const btn = $('#btnRecalcSerie');
  if (btn) btn.addEventListener('click', recalcularSerieMensual);
  const q = $('#predQ');
  if (q) q.addEventListener('input', e => { predQ = e.target.value; renderPrediccion(); $('#predQ').focus(); });
  const est = $('#predEstado');
  if (est) est.addEventListener('change', e => { predEstadoSel = e.target.value; renderPrediccion(); });
}

// Dispara la consulta pesada a Siga. Mientras corre, el botón queda deshabilitado
// y en "Recalculando…" para que nadie la lance dos veces.
async function recalcularSerieMensual() {
  if (predRecalculando) return;
  predRecalculando = true;
  renderPrediccion();
  try {
    await apiFetch('/api/compras-modulo/consumo-mensual/recalcular');
    predRecalculando = false;
    await cargarPrediccion();
    avisar('La serie mensual de consumo se recalculó correctamente.', 'Serie actualizada');
  } catch (e) {
    predRecalculando = false;
    renderPrediccion();
    avisar('No se pudo recalcular la serie mensual: ' + e.message, 'Error');
  }
}

cargarListado();
</script>
</body>
</html>
